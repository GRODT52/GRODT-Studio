const PENT=[0,2,4,7,9];
function penta(i,base){
  base=base||261.63;
  const oct=Math.floor(i/5);
  const s=PENT[((i%5)+5)%5];
  return base*Math.pow(2,(s+12*oct)/12);
}

const SFX={
  ac:null,master:null,on:store.get(SAVE_SOUND,true),
  init(){
    if(this.ac) return;

  tone(freq,dur,type,vol,when,slideTo){

    const o=this.ac.createOscillator(),g=this.ac.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(Math.max(20,freq),t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol),t+0.008);

    const f=this.ac.createBiquadFilter();f.type='highpass';f.frequency.value=900;

const MUSIC={
  ac:null,master:null,bus:null,

      this.bus=this.ac.createGain();this.bus.gain.value=0.35;this.bus.connect(this.master);
    }catch(e){this.ac=null;}

  resume(){ if(this.ac && this.ac.state==='suspended') this.ac.resume(); },

    this.init();this.resume();

  stop(){ this.playing=false; if(this.timer){clearInterval(this.timer);this.timer=null;} },

    if(!this.playing||!this.ac) return;

    while(this.nextTime<this.ac.currentTime+ahead){
      if(SFX.on) this.schedule(this.step,this.nextTime);
      this.nextTime+=60/this.bpm/4;
      this.step=(this.step+1)%64;

  schedule(step,t){
    this.intensity+=(this.targetIntensity-this.intensity)*0.06;
    const I=this.intensity;

    if(s16%4===0) this.kick(t,0.85+I*0.15);
    if(s16===4||s16===12) this.snare(t,0.50+I*0.20);
    if(I>0.15&&(s16%2===1||(I>0.7))) this.hat(t,0.16+I*0.10);
    const bassPat=[0,0,7,0,0,3,0,5,0,0,7,0,3,0,5,0];
    if(s16%2===0||(I>0.55&&bar>=2)){

    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const src=this.ac.createBufferSource();src.buffer=buf;
    const f=this.ac.createBiquadFilter();f.type='highpass';f.frequency.value=1200;

  hat(t,vol){

    const buf=this.ac.createBuffer(1,len,this.ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const src=this.ac.createBufferSource();src.buffer=buf;
    const f=this.ac.createBiquadFilter();f.type='highpass';f.frequency.value=7000;
    const g=this.ac.createGain();g.gain.value=vol;
    src.connect(f);f.connect(g);g.connect(this.bus);src.start(t);
  },
  bass(t,freq,dur,vol){
    const o1=this.ac.createOscillator(),o2=this.ac.createOscillator(),g=this.ac.createGain(),f=this.ac.createBiquadFilter();

function burst(x,y,n,color,power,spread){
  spread=spread||TAU;
  for(let i=0;i<n;i++){
    const a=rnd(0,spread)+(spread<TAU?-Math.PI/2-spread/2:0);
    const s=rnd(60,300)*(power||1);
    spawnParticle(x,y,Math.cos(a)*s,Math.sin(a)*s-rnd(30,120),rnd(0.25,0.6),color,rnd(1.6,3.6),1400);
  }
}

  const nx=clamp(cx,rect.x,rect.x+rect.w),ny=clamp(cy,rect.y,rect.y+rect.h);
  const dx=cx-nx,dy=cy-ny;

  for(const c of level.crumble) if(c.state==='solid') arr.push(c);
  return arr;
}
function playerBox(p){ return {x:p.x,y:p.y,w:p.w,h:p.h}; }

function update(dt){
  if(!running||!level) return;
  if(hitstop>0){ hitstop-=dt; if(hitstop<=0) hitstop=0; }
  const frozen=hitstop>0;
  if(!frozen){
    gameTime+=dt;
    if(comboT>0){ comboT-=dt; if(comboT<=0) combo=0; }
    updateSaws(dt);
    updateCrumble(dt);
    updatePlayer(dt);
    updateCrystals();
    checkGoal();
    updateParticles(dt);
  }
  updateMusicIntensity();
  updateCamera(dt,false);
  if(flash>0) flash=Math.max(0,flash-dt*3.2);
}

function updateSaws(dt){
  for(const s of level.saws){
    const off=Math.sin(gameTime*s.speed+s.phase)*s.range;
    if(s.axis==='x') s.x=s.x0+off; else s.y=s.y0+off;
  }
}

function updateCrumble(dt){
  const p=player;
  for(const c of level.crumble){
    if(c.state==='solid'){
      const onTop=!p.dead&&p.y+p.h>c.y-6&&p.y+p.h<c.y+14&&p.x+p.w>c.x+2&&p.x<c.x+c.w-2;
      if(onTop&&p.onGround&&p.vy>=0){
        c.timer+=dt;
        c.shakeX=Math.sin(gameTime*70)*Math.min(c.timer*10,5);
        if(c.timer>0.6){ c.state='falling';c.vy=60;shake(3);burst(c.x+c.w/2,c.y+c.h/2,10,'#ff9f43',0.7); }
      } else { c.timer=Math.max(0,c.timer-dt*2); c.shakeX=0; }
    } else if(c.state==='falling'){
      c.vy+=GRAV*0.7*dt;c.y+=c.vy*dt;
      if(c.y>level.killY+400) c.state='gone';
    }
  }
}

function updateMusicIntensity(){
  if(!MUSIC.playing) return;
  let target=0.20;
  if(player.dashT>0) target+=0.28;
  target+=Math.min(combo,5)*0.10;
  target+=Math.min(Math.abs(player.vx)/MOVE,1)*0.12;
  if(!player.onGround&&!player.dead) target+=0.08;
  if(player.dead) target=0.05;
  MUSIC.targetIntensity=clamp(target,0.05,1);
}

function updatePlayer(dt){
  const p=player;
  if(p.coyote>0) p.coyote-=dt;
  if(p.buffer>0) p.buffer-=dt;
  if(p.dashCd>0) p.dashCd-=dt;
  if(p.wallLock>0) p.wallLock-=dt;
  if(p.landT>0) p.landT-=dt;
  if(p.dead){ p.deadT-=dt; if(p.deadT<=0) respawnPlayer(false); return; }

  if(input.jumpPressed){ p.buffer=BUFFER; input.jumpPressed=false; }
  if(input.dashPressed){
    input.dashPressed=false;
    if(p.dashCd<=0&&p.dashT<=0){
      p.dashT=DASH_TIME;p.dashCd=DASH_CD;p.dashDir=p.facing;p.vy=0;
      SFX.dash();shake(4);
      ring(p.x+p.w/2,p.y+p.h/2,C.cyan,4,46,0.35,3);
      for(let i=0;i<14;i++) spawnParticle(p.x+p.w/2,p.y+p.h/2,rnd(-160,160),rnd(-120,120),rnd(0.2,0.45),C.cyan,rnd(1.5,3.2),200);
    }
  }

  const dir=(input.right?1:0)-(input.left?1:0);
  if(p.dashT>0){
    p.dashT-=dt;p.vx=p.dashDir*DASH_SPEED;p.vy=0;
    if(p.dashT<=0) p.vx=p.dashDir*MOVE;
    if(Math.random()<0.9) p.trail.push({x:p.x,y:p.y,a:1,s:1.15});
  } else {
    const target=dir*MOVE;
    const a=(p.onGround?ACCEL:AIR_ACCEL)*dt;
    if(dir!==0){
      p.facing=dir;
      if(p.vx<target) p.vx=Math.min(target,p.vx+a);
      else if(p.vx>target) p.vx=Math.max(target,p.vx-a);
    } else {
      const f=(p.onGround?FRICTION:FRICTION*0.32)*dt;
      if(Math.abs(p.vx)<=f) p.vx=0; else p.vx-=Math.sign(p.vx)*f;
    }
    let g=GRAV;
    if(p.vy<0&&!input.jump) g*=2.0;
    p.vy+=g*dt;
    if(p.vy>MAXFALL) p.vy=MAXFALL;
    if(!p.onGround&&p.onWall!==0&&p.vy>0&&dir===p.onWall){
      p.vy=Math.min(p.vy,WALL_SLIDE);
      if(Math.random()<0.35) spawnParticle(p.x+(p.onWall>0?p.w:0),p.y+rnd(0,p.h),-p.onWall*rnd(30,90),rnd(-40,20),rnd(0.2,0.4),C.violet,rnd(1.2,2.4),300);
    }
    if(p.buffer>0){
      if(p.coyote>0) doGroundJump();
      else if(p.onWall!==0&&p.wallLock<=0&&!p.onGround) doWallJump();
      else if(p.jumpsLeft>0) doAirJump();
    }
  }

  moveAndCollide(dt);

  for(let i=p.trail.length-1;i>=0;i--){ p.trail[i].a-=dt*3.6; if(p.trail[i].a<=0) p.trail.splice(i,1); }
  if(!p.onGround&&Math.abs(p.vx)>260&&Math.random()<0.4) p.trail.push({x:p.x,y:p.y,a:0.35,s:0.85});
  if(p.trail.length>22) p.trail.splice(0,p.trail.length-22);
  p.squash=lerp(p.squash,1,1-Math.pow(0.0008,dt));
  checkHazards();
}

function doGroundJump(){
  const p=player;
  p.vy=-JUMP_V;p.buffer=0;p.coyote=0;p.jumpsLeft=1;p.squash=1.42;
  SFX.jump();burst(p.x+p.w/2,p.y+p.h,9,C.cyan,0.75,Math.PI*0.9);ring(p.x+p.w/2,p.y+p.h,C.cyan,3,34,0.28,2.5);
}
function doAirJump(){
  const p=player;
  p.vy=-DJUMP_V;p.jumpsLeft--;p.buffer=0;p.squash=1.5;
  SFX.djump();burst(p.x+p.w/2,p.y+p.h*0.7,14,C.violet,0.9);ring(p.x+p.w/2,p.y+p.h*0.7,C.violet,4,52,0.36,3);
  doFlash(0.10,'167,139,250');
}
function doWallJump(){
  const p=player;
  p.vy=-WALL_JUMP_Y;p.vx=-p.onWall*WALL_JUMP_X;p.facing=-p.onWall;p.jumpsLeft=1;p.buffer=0;p.wallLock=0.14;p.squash=1.35;
  SFX.wall();
  const wx=p.x+(p.onWall>0?p.w:0);
  burst(wx,p.y+p.h*0.5,12,C.mint,0.9);ring(wx,p.y+p.h*0.5,C.mint,3,40,0.3,2.5);
}

function moveAndCollide(dt){
  const p=player;
  const solids=allSolids();
  const wasGround=p.onGround;
  p.onGround=false;p.onWall=0;

  p.x+=p.vx*dt;
  for(const s of solids){
    if(overlap(p,s)){
      if(p.vx>0) p.x=s.x-p.w-0.01;
      else if(p.vx<0) p.x=s.x+s.w+0.01;
      p.vx=0;
    }
  }
  p.y+=p.vy*dt;
  for(const s of solids){
    if(overlap(p,s)){
      if(p.vy>0){ p.y=s.y-p.h-0.01;p.vy=0;p.onGround=true; }
      else if(p.vy<0){ p.y=s.y+s.h+0.01;p.vy=0; }
    }
  }
  if(p.onGround){
    p.coyote=COYOTE;p.jumpsLeft=1;
    if(!wasGround){
      const impact=clamp(Math.abs(p.vy)/900,0,1);
      p.squash=1-0.42*Math.max(impact,0.25);
      SFX.land();shake(3+impact*4);
      for(let i=0;i<10;i++) spawnParticle(p.x+rnd(0,p.w),p.y+p.h,rnd(-140,140),rnd(-120,-10),rnd(0.22,0.45),C.cyan,rnd(1.2,2.8),1200);
      ring(p.x+p.w/2,p.y+p.h,C.cyan,3,30+impact*22,0.25,2);
    }
  } else {
    const probeL={x:p.x-4,y:p.y+8,w:4,h:p.h-16};
    const probeR={x:p.x+p.w,y:p.y+8,w:4,h:p.h-16};
    for(const s of solids){
      if(overlap(probeL,s)&&p.vx<=0) p.onWall=-1;
      if(overlap(probeR,s)&&p.vx>=0) p.onWall=1;
    }
  }
  if(p.y>level.killY) killPlayer();
}

function checkHazards(){
  const p=player;
  if(p.dead) return;
  for(const s of level.spikes){
    const box=s.dir==='down'
      ?{x:s.x+7,y:s.y,w:s.w-14,h:s.h-14}
      :{x:s.x+7,y:s.y+14,w:s.w-14,h:s.h-14};
    if(overlap(p,box)){ killPlayer(); return; }
  }
  for(const s of level.saws){
    if(circleRect(s.x,s.y,s.r*0.82,playerBox(p))){ killPlayer(); return; }
  }
  for(const l of level.lasers){
    if(laserOn(l)&&overlap(p,l)){ killPlayer(); return; }
  }
}

function killPlayer(){
  const p=player;
  if(p.dead) return;
  p.dead=true;p.deadT=0.55;
  deaths++;totalDeaths++;combo=0;
  SFX.die();shake(16);hitstop=0.09;doFlash(0.5,'255,92,157');
  burst(p.x+p.w/2,p.y+p.h/2,34,C.pink,1.4);
  ring(p.x+p.w/2,p.y+p.h/2,C.pink,6,130,0.5,4);
  floatText(p.x+p.w/2,p.y-10,'СБОЙ',C.pink,20);
  for(const m of [15,30,45]) if(!popupShown[m]&&totalDeaths>=m){ popupShown[m]=true; showDeathPopup(POPUP_TEXTS[m]); }
  updateHUD();
}

function updateCrystals(){
  const p=player;
  for(const c of level.crystals){
    if(c.taken) continue;
    const dx=(p.x+p.w/2)-c.x, dy=(p.y+p.h/2)-c.y;
    if(dx*dx+dy*dy<38*38) collectCrystal(c);
  }
}
function collectCrystal(c){
  c.taken=true;combo=Math.min(combo+1,9);comboT=2.4;
  const gained=100*combo;score+=gained;
  SFX.crystal(combo);
  burst(c.x,c.y,22,C.gold,1.1);ring(c.x,c.y,C.gold,5,68,0.42,3);
  floatText(c.x,c.y-14,'+'+gained+(combo>1?' ×'+combo:''),C.gold,combo>1?20:15);
  shake(3);doFlash(0.09,'255,217,61');
  if(combo>1) floatText(c.x,c.y-46,'×'+combo,C.violet,30);
  updateHUD();
}

function checkGoal(){
  const p=player;
  if(p.dead) return;
  const g=level.goal;
  const box={x:g.x-CELL*0.8,y:g.y-CELL*1.1,w:CELL*1.6,h:CELL*2.2};
  if(overlap(p,box)) winLevel();
}

function updateCamera(dt,instant){
  if(!level) return;
  const p=player;
  const tx=p.x+p.w/2+p.vx*0.14, ty=p.y+p.h/2-26;
  const kx=instant?1:1-Math.pow(0.0012,dt);
  const ky=instant?1:1-Math.pow(0.0045,dt);
  cam.x=lerp(cam.x,tx,kx);cam.y=lerp(cam.y,ty,ky);
  const viewW=W/zoom, viewH=H/zoom, lw=level.w*CELL, lh=level.h*CELL;
  if(lw<=viewW) cam.x=lw/2; else cam.x=clamp(cam.x,viewW/2,lw-viewW/2);
  if(lh<=viewH) cam.y=lh/2; else cam.y=clamp(cam.y,viewH/2,lh-viewH/2);
  if(cam.shake>0.05) cam.shake*=Math.pow(0.0006,dt); else cam.shake=0;
}

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const q=particles[i];q.life-=dt;
    if(q.life<=0){particles.splice(i,1);continue;}
    q.vy+=q.grav*dt;q.vx*=Math.pow(0.14,dt);q.x+=q.vx*dt;q.y+=q.vy*dt;
  }
  for(let i=rings.length-1;i>=0;i--){ const r=rings[i];r.life-=dt;if(r.life<=0) rings.splice(i,1); }
  for(let i=floats.length-1;i>=0;i--){ const f=floats[i];f.life-=dt;f.y+=f.vy*dt;f.vy*=Math.pow(0.02,dt);if(f.life<=0) floats.splice(i,1); }
}

function render(){
  const bg=ctx.createRadialGradient(W*0.5,H*0.44,0,W*0.5,H*0.44,Math.max(W,H)*0.78);
  bg.addColorStop(0,'#0a0e1a');bg.addColorStop(1,'#070a12');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  if(!level){ renderVignette(); return; }

  const viewW=W/zoom, viewH=H/zoom;
  const shakeX=cam.shake?rnd(-cam.shake,cam.shake):0;
  const shakeY=cam.shake?rnd(-cam.shake,cam.shake):0;

  ctx.save();
  ctx.translate(W/2+shakeX,H/2+shakeY);
  ctx.scale(zoom,zoom);
  ctx.translate(-cam.x,-cam.y);

  drawGrid(viewW,viewH);
  drawSolids();drawCrumble();drawSpikes();drawCrystals();drawGoal();drawSaws();drawLasers();
  drawRings();drawParticlesBack();drawPlayerTrail();drawPlayer();drawParticlesFront();drawFloats();
  ctx.restore();
  renderVignette();
  if(flash>0.005){ ctx.fillStyle=`rgba(${flashColor},${flash*0.45})`;ctx.fillRect(0,0,W,H); }
}

function renderVignette(){
  const v=ctx.createRadialGradient(W*0.5,H*0.5,Math.min(W,H)*0.28,W*0.5,H*0.5,Math.max(W,H)*0.78);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.74)');
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}

function drawGrid(viewW,viewH){
  const x0=Math.floor((cam.x-viewW/2)/CELL)*CELL, x1=cam.x+viewW/2;
  const y0=Math.floor((cam.y-viewH/2)/CELL)*CELL, y1=cam.y+viewH/2;
  ctx.fillStyle='rgba(255,255,255,0.022)';
  for(let x=x0;x<x1;x+=CELL){
    for(let y=y0;y<y1;y+=CELL){
      const r=CELL*0.16;
      ctx.beginPath();
      ctx.moveTo(x+r,y);
      ctx.arcTo(x+CELL,y,x+CELL,y+CELL,r);
      ctx.arcTo(x+CELL,y+CELL,x,y+CELL,r);
      ctx.arcTo(x,y+CELL,x,y,r);
      ctx.arcTo(x,y,x+CELL,y,r);
      ctx.closePath();ctx.fill();
    }
  }
  ctx.strokeStyle='rgba(100,150,255,0.055)';ctx.lineWidth=1;ctx.beginPath();
  for(let x=x0;x<x1;x+=CELL){ ctx.moveTo(x,y0);ctx.lineTo(x,y1); }
  for(let y=y0;y<y1;y+=CELL){ ctx.moveTo(x0,y);ctx.lineTo(x1,y); }
  ctx.stroke();
}

function roundRectPath(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawSolids(){
  for(const s of level.solids){
    const r=CELL*0.16;
    roundRectPath(s.x,s.y,s.w,s.h,r);
    ctx.fillStyle='rgba(16,24,44,0.92)';ctx.fill();
    ctx.strokeStyle='rgba(127,212,255,0.10)';ctx.lineWidth=9;ctx.stroke();
    ctx.strokeStyle='rgba(127,212,255,0.20)';ctx.lineWidth=4;ctx.stroke();
    ctx.strokeStyle='rgba(160,225,255,0.72)';ctx.lineWidth=1.4;ctx.stroke();
  }
}

function drawCrumble(){
  for(const c of level.crumble){
    if(c.state==='gone') continue;
    const sx=c.shakeX||0, r=CELL*0.14;
    const alpha=c.state==='falling'?Math.max(0,1-(c.y-c.y0)/500):1;
    ctx.globalAlpha=alpha;
    roundRectPath(c.x+sx,c.y,c.w,c.h,r);
    ctx.fillStyle='rgba(40,20,16,0.95)';ctx.fill();
    ctx.strokeStyle='rgba(255,159,67,0.16)';ctx.lineWidth=9;ctx.stroke();
    ctx.strokeStyle='rgba(255,159,67,0.35)';ctx.lineWidth=4;ctx.stroke();
    ctx.strokeStyle='rgba(255,200,140,0.95)';ctx.lineWidth=1.5;ctx.stroke();
    const warn=clamp(c.timer/0.6,0,1);
    if(warn>0.3){
      ctx.globalAlpha=alpha*(warn-0.3)/0.7*(0.55+0.45*Math.sin(gameTime*34));
      roundRectPath(c.x+sx,c.y,c.w,c.h,r);
      ctx.fillStyle='#ff3355';ctx.fill();
    }
    ctx.globalAlpha=1;
  }
}

function drawSpikes(){
  for(const s of level.spikes){
    const n=Math.max(1,Math.round(s.w/CELL));
    const step=s.w/n;
    const isDown=s.dir==='down';
    for(let i=0;i<n;i++){
      const bx=s.x+i*step;
      ctx.beginPath();
      if(isDown){
        ctx.moveTo(bx,s.y);
        ctx.lineTo(bx+step/2,s.y+s.h-4);
        ctx.lineTo(bx+step,s.y);
      } else {
        ctx.moveTo(bx,s.y+s.h);
        ctx.lineTo(bx+step/2,s.y+4);
        ctx.lineTo(bx+step,s.y+s.h);
      }
      ctx.closePath();
      ctx.fillStyle='rgba(60,12,30,0.95)';ctx.fill();
      ctx.strokeStyle='rgba(255,92,157,0.16)';ctx.lineWidth=8;ctx.stroke();
      ctx.strokeStyle='rgba(255,92,157,0.35)';ctx.lineWidth=3.5;ctx.stroke();
      ctx.strokeStyle='rgba(255,170,205,0.95)';ctx.lineWidth=1.4;ctx.stroke();
    }
  }
}

function drawSaws(){
  for(const s of level.saws){
    ctx.save();ctx.translate(s.x,s.y);ctx.rotate(gameTime*10);
    const g=ctx.createRadialGradient(0,0,0,0,0,s.r*1.8);
    g.addColorStop(0,'rgba(255,92,157,0.32)');g.addColorStop(1,'rgba(255,92,157,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,s.r*1.8,0,TAU);ctx.fill();
    const teeth=10;
    ctx.beginPath();
    for(let i=0;i<teeth;i++){
      const a0=i/teeth*TAU,a1=(i+0.5)/teeth*TAU,a2=(i+1)/teeth*TAU;
      const rO=s.r*1.35,rI=s.r*0.85;
      ctx.moveTo(Math.cos(a0)*rO,Math.sin(a0)*rO);
      ctx.lineTo(Math.cos(a1)*rI,Math.sin(a1)*rI);
      ctx.lineTo(Math.cos(a2)*rO,Math.sin(a2)*rO);
    }
    ctx.strokeStyle='#ff5c9d';ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,s.r*0.85,0,TAU);
    ctx.fillStyle='rgba(60,12,30,0.95)';ctx.fill();
    ctx.strokeStyle='#ff9f43';ctx.lineWidth=2.5;ctx.stroke();
    ctx.beginPath();ctx.arc(0,0,s.r*0.30,0,TAU);
    ctx.fillStyle='#ffd93d';ctx.shadowColor='rgba(255,217,61,0.9)';ctx.shadowBlur=14;ctx.fill();ctx.shadowBlur=0;
    ctx.restore();
  }
}

function drawLasers(){
  for(const l of level.lasers){
    const on=laserOn(l);
    const ph=((gameTime/l.period)+l.phase)%1;
    const warn=ph>0.35&&ph<0.5;
    if(!on){
      ctx.globalAlpha=warn?0.28+0.28*Math.sin(gameTime*40):0.09;
      ctx.fillStyle='#ff3355';ctx.fillRect(l.x,l.y,l.w,l.h);
      ctx.globalAlpha=1;continue;
    }
    ctx.save();
    ctx.shadowColor='rgba(255,92,157,0.9)';ctx.shadowBlur=22;
    ctx.fillStyle='rgba(255,92,157,0.45)';ctx.fillRect(l.x-4,l.y,l.w+8,l.h);
    ctx.shadowBlur=0;
    ctx.fillStyle='#ff5c9d';ctx.fillRect(l.x,l.y,l.w,l.h);
    ctx.fillStyle='#ffffff';
    const cw=Math.max(1,l.w*0.4),ch=Math.max(1,l.h*0.4);
    ctx.fillRect(l.x+(l.w-cw)/2,l.y+(l.h-ch)/2,cw,ch);
    ctx.restore();
  }
}

function drawCrystals(){
  const t=gameTime;
  for(const c of level.crystals){
    if(c.taken) continue;
    const pulse=0.75+0.25*Math.sin(t*3+c.ph);
    const bob=Math.sin(t*2+c.ph)*4;
    const x=c.x,y=c.y+bob;
    const g=ctx.createRadialGradient(x,y,0,x,y,CELL*0.85);
    g.addColorStop(0,`rgba(255,217,61,${0.30*pulse})`);g.addColorStop(1,'rgba(255,217,61,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,CELL*0.85,0,TAU);ctx.fill();
    const s=CELL*0.22*(0.92+0.08*Math.sin(t*4+c.ph));
    ctx.save();ctx.translate(x,y);ctx.rotate(t*1.4+c.ph);
    ctx.beginPath();
    ctx.moveTo(0,-s);ctx.lineTo(s*0.72,0);ctx.lineTo(0,s);ctx.lineTo(-s*0.72,0);ctx.closePath();
    ctx.shadowColor='rgba(255,217,61,0.95)';ctx.shadowBlur=18;
    ctx.fillStyle='#ffd93d';ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(255,255,230,0.95)';ctx.lineWidth=1.2;ctx.stroke();
    ctx.restore();
  }
}

function drawGoal(){
  const g=level.goal, t=gameTime;
  const pulse=0.8+0.2*Math.sin(t*2.6);
  const grd=ctx.createRadialGradient(g.x,g.y,0,g.x,g.y,CELL*2.0);
  grd.addColorStop(0,`rgba(127,212,255,${0.30*pulse})`);
  grd.addColorStop(0.5,`rgba(167,139,250,${0.14*pulse})`);
  grd.addColorStop(1,'rgba(127,212,255,0)');
  ctx.fillStyle=grd;ctx.beginPath();ctx.arc(g.x,g.y,CELL*2.0,0,TAU);ctx.fill();
  ctx.save();ctx.translate(g.x,g.y);
  for(let i=0;i<3;i++){
    const rr=CELL*(0.55+i*0.26);
    const rot=t*(0.9+i*0.5)*(i%2?-1:1);
    ctx.save();ctx.rotate(rot);
    ctx.beginPath();ctx.ellipse(0,0,rr,rr*0.55,0,0,TAU);
    ctx.strokeStyle=i===0?'rgba(127,212,255,0.95)':i===1?'rgba(167,139,250,0.7)':'rgba(255,217,61,0.45)';
    ctx.lineWidth=2.2-i*0.5;
    ctx.shadowColor='rgba(127,212,255,0.9)';ctx.shadowBlur=16;ctx.stroke();
    ctx.restore();
  }
  ctx.beginPath();ctx.arc(0,0,CELL*0.24*pulse,0,TAU);
  ctx.fillStyle='#eaf7ff';ctx.shadowColor='rgba(200,240,255,1)';ctx.shadowBlur=28;ctx.fill();
  ctx.restore();ctx.shadowBlur=0;
}

function drawRings(){
  for(const r of rings){
    const k=1-r.life/r.max, rad=lerp(r.r0,r.r1,k), a=1-k;
    ctx.beginPath();ctx.arc(r.x,r.y,rad,0,TAU);
    ctx.strokeStyle=hexA(r.color,a*0.85);ctx.lineWidth=r.lw*(1-k*0.65);ctx.stroke();
  }
}
function drawParticlesBack(){
  ctx.globalCompositeOperation='lighter';
  for(const q of particles){
    if(q.grav<=700) continue;
    const k=q.life/q.max;
    ctx.globalAlpha=k;ctx.fillStyle=q.color;
    ctx.beginPath();ctx.arc(q.x,q.y,q.size*(0.4+k*0.8),0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function drawParticlesFront(){
  ctx.globalCompositeOperation='lighter';
  for(const q of particles){
    if(q.grav>700) continue;
    const k=q.life/q.max;
    ctx.globalAlpha=k;ctx.fillStyle=q.color;
    ctx.beginPath();ctx.arc(q.x,q.y,q.size*(0.4+k*0.8),0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
function drawFloats(){
  for(const f of floats){
    const k=f.life/f.max, scale=1+(1-k)*0.25;
    ctx.save();ctx.globalAlpha=Math.min(1,k*1.6);
    ctx.translate(f.x,f.y);ctx.scale(scale,scale);
    ctx.font=`800 ${f.size}px 'Segoe UI',system-ui,sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor=f.color;ctx.shadowBlur=18;ctx.fillStyle=f.color;
    ctx.fillText(f.text,0,0);
    ctx.restore();
  }
  ctx.shadowBlur=0;
}
function drawPlayerTrail(){
  const p=player;
  for(const t of p.trail){
    if(t.a<=0) continue;
    ctx.globalAlpha=t.a*0.42;ctx.fillStyle=C.cyan;
    roundRectPath(t.x,t.y,p.w*t.s,p.h*t.s,7);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawPlayer(){
  const p=player;
  if(p.dead) return;
  const sq=p.squash, sx=1/Math.sqrt(sq), sy=sq;
  const cx=p.x+p.w/2, cy=p.y+p.h/2;
  if(p.dashT>0){
    ctx.globalCompositeOperation='lighter';
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,64);
    g.addColorStop(0,'rgba(127,212,255,0.55)');g.addColorStop(1,'rgba(127,212,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,64,0,TAU);ctx.fill();
    ctx.globalCompositeOperation='source-over';
  }
  ctx.save();ctx.translate(cx,cy);ctx.scale(sx,sy);
  const w=p.w,h=p.h;
  ctx.shadowColor='rgba(127,212,255,0.95)';ctx.shadowBlur=26;
  roundRectPath(-w/2,-h/2,w,h,8);
  const grd=ctx.createLinearGradient(0,-h/2,0,h/2);
  grd.addColorStop(0,'#a9e6ff');grd.addColorStop(0.5,'#7fd4ff');grd.addColorStop(1,'#a78bfa');
  ctx.fillStyle=grd;ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(235,250,255,0.9)';ctx.lineWidth=1.6;ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,w*0.19,0,TAU);
  ctx.fillStyle='rgba(255,255,255,0.95)';ctx.shadowColor='rgba(255,255,255,1)';ctx.shadowBlur=14;ctx.fill();ctx.shadowBlur=0;
  ctx.beginPath();
  ctx.moveTo(p.facing*(w*0.5-2),-h*0.10);
  ctx.lineTo(p.facing*(w*0.5+5),0);
  ctx.lineTo(p.facing*(w*0.5-2),h*0.10);
  ctx.closePath();ctx.fillStyle='rgba(255,255,255,0.85)';ctx.fill();
  ctx.restore();
  if(p.onWall!==0&&!p.onGround&&p.vy>0){
    ctx.globalCompositeOperation='lighter';
    const wx=p.x+(p.onWall>0?p.w:0);
    ctx.fillStyle='rgba(167,139,250,0.5)';
    ctx.fillRect(wx-1.5,p.y+6,3,p.h-12);
    ctx.globalCompositeOperation='source-over';
  }
}

function hexA(hex,a){
  if(hex.startsWith('rgba')) return hex;
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

const el=id=>document.getElementById(id);
function fmtTime(s){
  const m=Math.floor(s/60), sec=Math.floor(s%60), d=Math.floor((s*10)%10);
  return `${m}:${sec<10?'0':''}${sec}.${d}`;
}
function updateHUD(){
  el('hudLevel').textContent=String(levelIndex+1).padStart(2,'0');
  el('hudTime').textContent=fmtTime(gameTime);
  el('hudScore').textContent=score.toLocaleString('ru-RU');
  el('hudDeaths').textContent=String(totalDeaths);
  if(level){
    const total=level.crystals.length;
    const got=level.crystals.filter(c=>c.taken).length;
    el('hudCryst').textContent=got+'/'+total;
  }
}
function buildLevelGrid(){
  const grid=el('levelGrid');grid.innerHTML='';
  for(let i=0;i<LEVELS.length;i++){
    const b=document.createElement('button');
    b.className='lvbtn'+(i>unlocked?' locked':'');
    const st=starsArr[i]||0;
    b.innerHTML=i>unlocked?'·':`<span>${i+1}</span><span class="st">${'★'.repeat(st)}${'☆'.repeat(3-st)}</span>`;
    if(i<=unlocked){
      b.addEventListener('click',()=>{
        try{ SFX.init();SFX.resume();SFX.ui();startLevel(i); }
        catch(e){ console.error(e);alert('Ошибка: '+e.message); }
      });
    }
    grid.appendChild(b);
  }
}
function showMenu(){
  MUSIC.stop();running=false;
  buildLevelGrid();
  el('menu').classList.add('show');
  el('win').classList.remove('show');
}
function hideMenu(){ el('menu').classList.remove('show'); }

function startLevel(i){
  SFX.init();SFX.resume();
  buildLevel(i);
  score=0;
  hideMenu();
  el('win').classList.remove('show');
  running=true;
  updateHUD();
  doFlash(0.35,'255,92,157');shake(6);
  MUSIC.start();
}

function winLevel(){
  if(!running) return;
  running=false;MUSIC.stop();
  const total=level.crystals.length;
  const got=level.crystals.filter(c=>c.taken).length;
  const allCrystals=got===total;
  const noDeaths=deaths===0;
  let st=1;
  if(noDeaths) st=2;
  if(noDeaths&&allCrystals) st=3;
  if(!noDeaths&&allCrystals&&st<2) st=2;
  if(st>(starsArr[levelIndex]||0)){ starsArr[levelIndex]=st; store.set(SAVE_STARS,starsArr); }
  if(levelIndex+1>unlocked&&levelIndex+1<LEVELS.length){ unlocked=levelIndex+1; store.set(SAVE_UNLOCK,unlocked); }
  const timeBonus=Math.max(0,Math.round(3000-gameTime*40));
  const deathBonus=noDeaths?1500:0;
  const crystalBonus=allCrystals?1000:0;
  const totalScore=score+timeBonus+deathBonus+crystalBonus;
  score=totalScore;
  SFX.win();doFlash(0.6,'255,217,61');shake(12);confetti();
  el('winTitle').textContent=(levelIndex===LEVELS.length-1)?'ВСЁ ПРОЙДЕНО':'УРОВЕНЬ ПРОЙДЕН';
  el('winStars').innerHTML=[0,1,2].map(i=>i<st?'<span class="on">★</span>':'☆').join('');
  el('winTime').textContent=fmtTime(gameTime);
  el('winScore').textContent=totalScore.toLocaleString('ru-RU');
  el('winCryst').textContent=got+'/'+total;
  el('winDeaths').textContent=String(deaths);
  el('btnNext').textContent=(levelIndex===LEVELS.length-1)?'В МЕНЮ':'ДАЛЕЕ →';
  setTimeout(()=>el('win').classList.add('show'),420);
  updateHUD();
}

function confetti(){
  const cols=[C.pink,C.teal,C.gold,C.violet,C.orange,C.mint,C.cyan];
  for(let i=0;i<140;i++){
    spawnParticle(rnd(0,level.w*CELL),rnd(-200,0),rnd(-120,120),rnd(80,380),rnd(0.9,2.2),cols[i%cols.length],rnd(2,5),500);
  }
}

const keyMap={
  'ArrowLeft':'left','KeyA':'left',
  'ArrowRight':'right','KeyD':'right',
  'ArrowUp':'jump','KeyW':'jump','Space':'jump',
  'ShiftLeft':'dash','ShiftRight':'dash','KeyK':'dash','KeyX':'dash','KeyJ':'dash'
};
window.addEventListener('keydown',e=>{
  if(e.repeat) return;
  const a=keyMap[e.code];
  if(!a) return;
  e.preventDefault();
  SFX.init();SFX.resume();
  if(a==='left') input.left=true;
  if(a==='right') input.right=true;
  if(a==='jump'){ input.jump=true;input.jumpPressed=true; }
  if(a==='dash'){ input.dashPressed=true; }
},{passive:false});
window.addEventListener('keyup',e=>{
  const a=keyMap[e.code];
  if(!a) return;
  e.preventDefault();
  if(a==='left') input.left=false;
  if(a==='right') input.right=false;
  if(a==='jump') input.jump=false;
},{passive:false});
window.addEventListener('keydown',e=>{
  if(e.repeat) return;
  if(e.code==='KeyR'&&running&&level){
    e.preventDefault();
    try{ buildLevel(levelIndex); }catch(err){ console.error(err);alert('Ошибка рестарта: '+err.message); }
    score=0;updateHUD();
  } else if(e.code==='Escape'&&running){
    e.preventDefault();showMenu();
  }
});

function bindHold(id,onDown,onUp){
  const b=el(id);
  const down=e=>{
    e.preventDefault();
    SFX.init();SFX.resume();
    if(b.setPointerCapture) b.setPointerCapture(e.pointerId);
    onDown();
  };
  const up=e=>{ e.preventDefault();if(onUp) onUp(); };
  b.addEventListener('pointerdown',down,{passive:false});
  b.addEventListener('pointerup',up,{passive:false});
  b.addEventListener('pointercancel',up,{passive:false});
  b.addEventListener('pointerleave',up,{passive:false});
}
bindHold('tLeft',()=>{input.left=true;},()=>{input.left=false;});
bindHold('tRight',()=>{input.right=true;},()=>{input.right=false;});
bindHold('tJump',()=>{input.jump=true;input.jumpPressed=true;},()=>{input.jump=false;});
bindHold('tDash',()=>{input.dashPressed=true;},null);
document.getElementById('touch').addEventListener('contextmenu',e=>e.preventDefault());

if('ontouchstart' in window||navigator.maxTouchPoints>0){ el('touch').classList.add('on'); }

/* ===== КНОПКИ — с защитой от ошибок ===== */
el('btnPlay').addEventListener('click',()=>{
  try{
    SFX.init();SFX.resume();SFX.ui();
    startLevel(unlocked);
  }catch(e){ console.error('[NR] play:',e); alert('Ошибка запуска: '+e.message); }
});
el('btnMenu').addEventListener('click',()=>{
  try{ SFX.init();SFX.resume();SFX.ui();showMenu(); }catch(e){ console.error(e); }
});
el('btnReset').addEventListener('click',()=>{
  SFX.init();SFX.resume();SFX.ui();
  if(level){
    try{ buildLevel(levelIndex); }catch(e){ console.error(e);alert('Ошибка рестарта: '+e.message); }
    score=0;running=true;updateHUD();
  }
});
el('btnSound').addEventListener('click',()=>{
  SFX.init();SFX.resume();
  SFX.on=!SFX.on;
  store.set(SAVE_SOUND,SFX.on);
  el('btnSound').textContent=SFX.on?'🔊':'🔇';
  if(SFX.on){ SFX.ui(); if(running) MUSIC.start(); } else { MUSIC.stop(); }
});
el('btnNext').addEventListener('click',()=>{
  try{
    SFX.ui();
    if(levelIndex===LEVELS.length-1){ el('win').classList.remove('show');showMenu(); }
    else { startLevel(levelIndex+1); }
  }catch(e){ console.error('[NR] next:',e);alert('Ошибка перехода: '+e.message); }
});
el('btnToMenu').addEventListener('click',()=>{
  SFX.ui();el('win').classList.remove('show');showMenu();
});

window.addEventListener('keydown',e=>{
  if(e.repeat) return;
  if(!el('win').classList.contains('show')) return;
  if(e.code==='KeyE'||e.code==='Enter'||e.code==='NumpadEnter'){
    e.preventDefault();e.stopPropagation();
    SFX.init();SFX.resume();
    el('btnNext').click();
  }
},true);

document.addEventListener('visibilitychange',()=>{ if(document.hidden&&running) showMenu(); });

let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt=(now-last)/1000;
  last=now;
  if(dt>0.05) dt=0.05;
  if(dt<=0) return;
  try{ update(dt);render(); }
  catch(e){ console.error('[NR] loop:',e); }
  if(running) updateHUD();
}

try{
  resize();
  el('btnSound').textContent=SFX.on?'🔊':'🔇';
  buildLevelGrid();
  buildLevel(0);
  running=false;
  requestAnimationFrame(loop);
}catch(e){
  console.error('[NR] boot:',e);
  alert('Ошибка запуска игры:\n'+e.message+'\n\nОткрой Console (F12) для деталей.');
}

['pointerdown','keydown'].forEach(ev=>{
  window.addEventListener(ev,()=>{ SFX.init();SFX.resume();MUSIC.init();MUSIC.resume(); },{once:true});
});

})();
</script>
