function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function pfYMD(y, m, d) { return y * 10000 + (m + 1) * 100 + d; }
function pfMonthKey(dateStr) { return Math.floor(dateStr / 100); }
function pfTodayMonthKey() { const d = new Date(); return d.getFullYear() * 100 + (d.getMonth() + 1); }
function pfDaysInMonth(monthKey) {
  const y = Math.floor(monthKey / 100), m = monthKey % 100;
  return new Date(y, m, 0).getDate();
}
function pfMonthLabel(monthKey) {
  const names = ['ЯНВАРЬ','ФЕВРАЛЬ','МАРТ','АПРЕЛЬ','МАЙ','ИЮНЬ','ИЮЛЬ','АВГУСТ','СЕНТЯБРЬ','ОКТЯБРЬ','НОЯБРЬ','ДЕКАБРЬ'];
  const y = Math.floor(monthKey / 100), m = monthKey % 100;
  return names[m - 1] + ' ' + y;
}


function pfMonthStars(monthKey) {
  const h = Core.SDK.get('dailyHistory', {});
  let sum = 0;
  Object.keys(h).forEach(function (k) {
    if (Math.floor(Number(k) / 100) === monthKey) sum += (h[k] && h[k].bestStars) || 0;
  });
  return sum;
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

Core.SDK = {
  ysdk: null, player: null, isStub: true, saveData: {},
  async init() {
    if (typeof YaGames === 'undefined') { console.log('[SDK] stub'); this.loadStub(); return; }
    try {
      this.ysdk = await Promise.race([
        YaGames.init(),
        new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, 3000); })
      ]);
      this.isStub = false;
      try { this.player = await this.ysdk.getPlayer({ scopes: false }); } catch (e) {}
      if (this.player) {
        try { this.saveData = (await this.player.getData()) || {}; } catch (e) { this.saveData = {}; }
      }
    } catch (e) { console.warn('[SDK] stub:', e.message); this.isStub = true; this.loadStub(); }
    this.migrate();
  },
  loadStub() {
    try { this.saveData = JSON.parse(localStorage.getItem('_game_save') || '{}'); }
    catch (e) { this.saveData = {}; }
  },
  migrate() {
    const d = Core.DEFAULT_SAVE;
    for (const k in d) if (this.saveData[k] === undefined) this.saveData[k] = JSON.parse(JSON.stringify(d[k]));
    if (!this.saveData.dailyHistory) this.saveData.dailyHistory = {};
    if (!this.saveData.monthlyRewards) this.saveData.monthlyRewards = {};
    if (!this.saveData.upgrades) this.saveData.upgrades = {};
    if (!this.saveData.achClaimed) this.saveData.achClaimed = {};
    if (!Array.isArray(this.saveData.achievements)) {
      const v = this.saveData.achievements;
      const arr = [];
      if (v && typeof v === 'object') Object.keys(v).forEach(function (k) { if (v[k]) arr.push(String(k)); });
      this.saveData.achievements = arr;
    }
  },
  async save(patch) {
    Object.assign(this.saveData, patch);
    if (this.isStub || !this.player) { try { localStorage.setItem('_game_save', JSON.stringify(this.saveData)); } catch (e) {} return; }
    try { await this.player.setData(this.saveData, true); } catch (e) {}
  },
  get(key, def) {
    if (this.saveData[key] === undefined) return def !== undefined ? def : Core.DEFAULT_SAVE[key];
    return this.saveData[key];
  },
  async rewarded() {
    if (this.isStub || !this.ysdk) { await new Promise(function (r) { setTimeout(r, 600); }); return true; }
    return new Promise((resolve) => {
      let ok = false;
      try {
        this.ysdk.adv.showRewardedVideo({ callbacks: {
          onRewarded: function () { ok = true; },
          onClose: function () { resolve(ok); },
          onError: function () { resolve(false); }
        }});
      } catch (e) { resolve(false); }
    });
  },
  interstitial() { if (this.isStub || !this.ysdk) return; try { this.ysdk.adv.showFullscreenAdv({ callbacks: {} }); } catch (e) {} },
  gameplayStart() { try { if (this.ysdk?.features?.GameplayAPI) this.ysdk.features.GameplayAPI.start(); } catch (e) {} },
  gameplayStop()  { try { if (this.ysdk?.features?.GameplayAPI) this.ysdk.features.GameplayAPI.stop(); } catch (e) {} }
};

    { id: 'month_stars_30', title: 'ЗОЛОТО МЕСЯЦА', desc: '30★ в одном месяце', goal: 30, value: function (s) { return Core.Achievements.bestMonthStars(s); } },

  ],
  unlocked: function () {
    const v = Core.SDK.get('achievements', []);
    if (Array.isArray(v)) return v;
    if (v && typeof v === 'object') {
      const arr = [];
      Object.keys(v).forEach(function (k) { if (v[k]) arr.push(String(k)); });
      Core.SDK.save({ achievements: arr });
      return arr;
    }
    Core.SDK.save({ achievements: [] });
    return [];
  },
  claimed: function () {
    const v = Core.SDK.get('achClaimed', {});
    if (v && typeof v === 'object' && !Array.isArray(v)) return v;
    return {};
  },
  isClaimed: function (id) { return !!this.claimed()[id]; },
  count: function () {
    const un = this.unlocked();
    return this.list.filter(function (a) { return un.indexOf(a.id) >= 0; }).length;
  },
  progress: function (a, s) {
    const v = Math.min(a.goal, (typeof a.value === 'function') ? (a.value(s) || 0) : 0);
    return { cur: v, goal: a.goal, done: v >= a.goal };
  },
  sync: function () {
    const s = this.stats();
    const un = this.unlocked().slice();
    const cl = this.claimed();
    const newly = [];
    this.list.forEach(function (a) {
      if (un.indexOf(a.id) < 0 && (a.value(s) || 0) >= a.goal) {
        un.push(a.id);
        newly.push(a);
        if (!cl[a.id]) {
          const r = Core.Achievements.rewardFor(a.id);
          const patch = {};
          if (r.coins) patch.coins = Core.SDK.get('coins', 0) + r.coins;
          if (r.hints) patch.hintsOwned = Core.SDK.get('hintsOwned', 0) + r.hints;
          cl[a.id] = Date.now();
          patch.achClaimed = cl;
          if (Object.keys(patch).length) Core.SDK.save(patch);
        }
      }
    });
    if (newly.length && un.length !== this.unlocked().length) Core.SDK.save({ achievements: un });
    return newly;
  }

Core.ensureTestObsidian = function () {
  if (!Core.TEST_OBSIDIAN) return;
  if (!Core.SDK || !Core.SDK.saveData) return;
  const owned = Core.SDK.get('ownedSkins', ['classic']).slice();
  const patch = {};
  if (owned.indexOf('obsidian') < 0) { owned.push('obsidian'); patch.ownedSkins = owned; }
  if (!Core.SDK.get('_obsidianTestSeen', false)) { patch.currentSkin = 'obsidian'; patch._obsidianTestSeen = true; }
  if (Object.keys(patch).length) Core.SDK.save(patch);
};

Core.syncObsidianAccess = function () {
  if (!Core.SDK || !Core.SDK.saveData) return;
  const rewards = Core.SDK.get('monthlyRewards', {});
  let earned = false;
  Object.keys(rewards).forEach(function (k) {
    const r = rewards[k];
    const cl = r.claimed || (r.tier ? [String(r.tier).toLowerCase()] : []);
    if (cl.indexOf('gold') >= 0) earned = true;
  });
  const owned = Core.SDK.get('ownedSkins', ['classic']).slice();
  const patch = {};
  if (Core.TEST_OBSIDIAN) {
    if (owned.indexOf('obsidian') < 0) { owned.push('obsidian'); patch.ownedSkins = owned; }
    if (!Core.SDK.get('_obsidianTestSeen', false)) { patch.currentSkin = 'obsidian'; patch._obsidianTestSeen = true; }
  } else if (!earned) {
    const i = owned.indexOf('obsidian');
    if (i >= 0) { owned.splice(i, 1); patch.ownedSkins = owned; }
    if (Core.SDK.get('currentSkin', 'classic') === 'obsidian') patch.currentSkin = 'classic';
    if (Core.SDK.get('_obsidianTestSeen', false)) patch._obsidianTestSeen = false;
  }
  if (Object.keys(patch).length) Core.SDK.save(patch);
};

Core.autoClaimMonthly = function (monthKey) {
  if (!Core.SDK || !Core.SDK.saveData) return [];
  const stars = pfMonthStars(monthKey);
  const rewards = Core.SDK.get('monthlyRewards', {});
  const rec = rewards[monthKey] || { claimed: [] };
  if (!rec.claimed) rec.claimed = rec.tier ? [String(rec.tier).toLowerCase()] : [];
  const tiers = [
    { key: 'bronze', need: 30, coins: 150, hints: 2, skin: null, label: 'БРОНЗА · 30★' },
    { key: 'silver', need: 60, coins: 300, hints: 3, skin: null, label: 'СЕРЕБРО · 60★' },
    { key: 'gold', need: 90, coins: 600, hints: 5, skin: 'obsidian', label: 'ЗОЛОТО · 90★' }
  ];
  const newly = [];
  tiers.forEach(function (t) { if (stars >= t.need && rec.claimed.indexOf(t.key) < 0) { rec.claimed.push(t.key); newly.push(t); } });
  if (!newly.length) return [];
  const patch = { coins: Core.SDK.get('coins', 0), hintsOwned: Core.SDK.get('hintsOwned', 0) };
  const owned = Core.SDK.get('ownedSkins', ['classic']).slice();
  let gotSkin = false;
  newly.forEach(function (t) {
    patch.coins += t.coins;
    patch.hintsOwned += t.hints;
    if (t.skin && owned.indexOf(t.skin) < 0) { owned.push(t.skin); gotSkin = true; }
  });
  if (gotSkin) patch.ownedSkins = owned;
  rec.stars = stars; rec.updatedAt = Date.now();
  rewards[monthKey] = rec; patch.monthlyRewards = rewards;

};
Core.Audio = (function () {
  let ctx = null;
  function ensure() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }
  function tone(freq, dur, type, vol) {
    ensure(); if (!ctx) return;
    const t = ctx.currentTime, osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type || 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.12, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(ctx.destination); osc.start(t); osc.stop(t + dur);
  }
  return {
    unlock: ensure,
    select: function () { tone(660, 0.06, 'triangle', 0.1); },
    pour:   function () { tone(380 + Math.random() * 80, 0.1, 'sine', 0.1); },
    drop:   function () { tone(520 + Math.random() * 60, 0.05, 'sine', 0.08); },
    error:  function () { tone(140, 0.15, 'sawtooth', 0.08); },
    coin:   function () { tone(1200, 0.05, 'triangle', 0.1); setTimeout(function () { tone(1600, 0.08, 'triangle', 0.09); }, 60); },
    buy:    function () { tone(523, 0.1, 'triangle', 0.13); setTimeout(function () { tone(784, 0.15, 'triangle', 0.13); }, 90); setTimeout(function () { tone(1047, 0.2, 'triangle', 0.11); }, 200); },
    combo:  function (n) { const b = 660 + Math.min(n, 6) * 60; tone(b, 0.09, 'triangle', 0.11); setTimeout(function () { tone(b + 200, 0.12, 'triangle', 0.1); }, 90); },
    bigCombo: function () { tone(880, 0.12, 'triangle', 0.15); setTimeout(function () { tone(1174, 0.12, 'triangle', 0.15); }, 100); setTimeout(function () { tone(1568, 0.2, 'triangle', 0.13); }, 200); setTimeout(function () { tone(2093, 0.3, 'triangle', 0.12); }, 320); },
    score:  function () { tone(880, 0.05, 'triangle', 0.06); },
    tubeComplete: function () {
      tone(784, 0.12, 'triangle', 0.14);
      setTimeout(function () { tone(988, 0.12, 'triangle', 0.14); }, 100);
      setTimeout(function () { tone(1318, 0.22, 'triangle', 0.12); }, 200);
    },
    record: function () {
      tone(880, 0.1, 'triangle', 0.14);
      setTimeout(function () { tone(1109, 0.1, 'triangle', 0.14); }, 100);
      setTimeout(function () { tone(1318, 0.1, 'triangle', 0.14); }, 200);
      setTimeout(function () { tone(1760, 0.3, 'triangle', 0.13); }, 300);
    },
    achievement: function () {

      setTimeout(function () { tone(880, 0.1, 'triangle', 0.14); }, 100);
      setTimeout(function () { tone(1175, 0.2, 'triangle', 0.13); }, 200);
    },
    win: function () {

      setTimeout(function () { tone(784, 0.2, 'triangle', 0.13); }, 240);

    }
  };
})();

Core.Utils = {
  shuffleWith: function (a, rng) {
    const rand = rng || Math.random;
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
};

Core.Juice = {
  vibrate: function (p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} },
  burst: function (scene, x, y, color, count, speed) {
    count = count || 14; speed = speed || 140;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (60 + Math.random() * speed);
      const r = 3 + Math.random() * 4;
      const p = scene.add.circle(x, y, r, color, 1).setDepth(950);
      scene.tweens.add({
        targets: p, x: x + Math.cos(a) * sp, y: y + Math.sin(a) * sp,
        alpha: 0, scale: 0.2, duration: 380 + Math.random() * 320, ease: 'Cubic.Out',
        onComplete: function () { p.destroy(); }
      });
    }
  },
  flash: function (scene, x, y, r) {
    const f = scene.add.circle(x, y, r, 0xffffff, 0.65).setDepth(940);
    scene.tweens.add({ targets: f, alpha: 0, scale: 1.5, duration: 200, onComplete: function () { f.destroy(); } });
  },
  ring: function (scene, x, y, color, fromR, toR, dur) {
    const r = scene.add.circle(x, y, fromR, color, 0).setStrokeStyle(3, color, 0.9).setDepth(940);
    scene.tweens.add({ targets: r, scale: toR / fromR, alpha: 0, duration: dur || 400, ease: 'Cubic.Out', onComplete: function () { r.destroy(); } });
  },
  ambient: function (scene, count, depth) {
    count = count || 25; depth = depth == null ? -5 : depth;
    const W = scene.scale.width, H = scene.scale.height;
    for (let i = 0; i < count; i++) {
      const color = Core.PALETTE[i % Core.PALETTE.length];
      const r = 3 + Math.random() * 10;
      const x = Math.random() * W, y = H + Math.random() * H;
      const p = scene.add.circle(x, y, r, color, 0.10 + Math.random() * 0.08).setDepth(depth);
      scene.tweens.add({
        targets: p, y: -50, x: x + (Math.random() - 0.5) * 120,
        duration: 12000 + Math.random() * 12000, repeat: -1, ease: 'Linear',
        onRepeat: function () { p.x = Math.random() * W; p.y = H + 20; }
      });
      scene.tweens.add({ targets: p, alpha: 0.03, duration: 2000 + Math.random() * 2000, yoyo: true, repeat: -1, ease: 'Sine.InOut' });
    }
  },
  trailPuff: function (scene, x, y, color) {
    const p = scene.add.circle(x, y, 5 + Math.random() * 3, color, 0.55).setDepth(930);
    scene.tweens.add({ targets: p, scale: 0.2, alpha: 0, duration: 280, ease: 'Cubic.Out', onComplete: function () { p.destroy(); } });
  },
  screenFlash: function (scene, color, alpha, dur) {
    const W = scene.scale.width, H = scene.scale.height;
    const f = scene.add.rectangle(0, 0, W, H, color || 0xffffff, alpha || 0.2).setOrigin(0).setDepth(935);
    scene.tweens.add({ targets: f, alpha: 0, duration: dur || 220, onComplete: function () { f.destroy(); } });
  }
};

Core.makeCoinTexture = function (scene) {

Core.renderBall = function (scene, radius, color, skinKey) {
  const skin = Core.Skins.balls[skinKey] || Core.Skins.balls.classic;
  const c = scene.add.container(0, 0);
  const r = radius;
  switch (skin.style) {
    case 'flat':
      c.add(scene.add.circle(0, 0, r, color));
      c.add(scene.add.circle(0, 0, r).setStrokeStyle(3, 0x000000, 0.35));
      c.add(scene.add.circle(-r * 0.25, -r * 0.25, r * 0.22, 0xffffff, 0.25));
      break;
    case 'neon':
      c.add(scene.add.circle(0, 0, r + 7, color, 0.25));
      c.add(scene.add.circle(0, 0, r + 3, color, 0.45));
      c.add(scene.add.circle(0, 0, r, color));
      c.add(scene.add.circle(0, 0, r).setStrokeStyle(2, 0xffffff, 0.85));
      c.add(scene.add.circle(-r * 0.3, -r * 0.3, r * 0.28, 0xffffff, 0.7));
      break;
    case 'metal':
      c.add(scene.add.circle(r * 0.15, r * 0.2, r * 0.85, 0x000000, 0.35));
      c.add(scene.add.circle(0, 0, r, 0x202028));
      c.add(scene.add.circle(0, 0, r - 2, color));
      c.add(scene.add.circle(0, 0, r - 7, 0x000000, 0.18));
      c.add(scene.add.circle(-r * 0.32, -r * 0.32, r * 0.3, 0xffffff, 0.7));
      c.add(scene.add.circle(r * 0.38, r * 0.42, r * 0.2, 0x000000, 0.35));

    default: // glossy
      c.add(scene.add.circle(4, 6, r - 6, 0x000000, 0.15));
      c.add(scene.add.circle(0, 0, r, color));
      c.add(scene.add.circle(-r * 0.3, -r * 0.3, r * 0.3, 0xffffff, 0.35));

  return c;
};

Core.coinLabel = function (scene, x, y, amount, opts) {
  opts = opts || {};
  const fs = opts.fontSize || 22;
  const iconSize = (opts.iconSize || Math.round(fs * 1.05)) * 1.3;
  const gap = opts.gap || 6;
  const color = opts.color || '#e8c874';
  const stroke = opts.stroke || '#000000';
  const st = opts.strokeThickness != null ? opts.strokeThickness : 3;
  const anchor = opts.anchor || 'center';
  const fmt = function (v) { return typeof v === 'number' ? v.toLocaleString('ru-RU') : String(v); };

  const txt = scene.add.text(0, 0, fmt(amount), {
    fontFamily: Core.FONT, fontSize: (fs) * 1.3 + 'px', fontStyle: '900', color: color, stroke: stroke, strokeThickness: st
  }).setOrigin(0, 0.5);
  const layout = function () {
    const totalW = iconSize + gap + txt.width;
    let startX = anchor === 'center' ? -totalW / 2 : (anchor === 'right' ? -totalW : 0);
    icon.x = startX + iconSize / 2;
    txt.x = startX + iconSize + gap;
  };
  const icon = scene.add.image(0, 0, 'coin_icon').setDisplaySize(iconSize, iconSize);
  const c = scene.add.container(x, y);
  c.add([icon, txt]);
  layout();
  c.__setAmount = function (v) { txt.setText(fmt(v)); layout(); };
  c.__tickTo = function (target, dur) {
    const startV = parseFloat(String(txt.text).replace(/[^\d.-]/g, '')) || 0;
    scene.tweens.addCounter({
      from: startV, to: target, duration: dur || 500,
      onUpdate: function (tw) { c.__setAmount(Math.round(tw.getValue())); },
      onComplete: function () { c.__setAmount(target); }
    });
  };
  return c;
};

class BaseGameScene extends Phaser.Scene {

    bg.fillGradientStyle(0x0a0a10, 0x0a0a10, 0x161022, 0x161022, 1);
    bg.fillRect(0, 0, W, H);
    Core.Juice.ambient(this, 22, -5);

    this.levelJustFinished = false;

    this.shufflesLeft = Core.SDK.get('shufflesOwned', 2); // ДОБАВИЛИ ПЕРЕМЕШКИ

    this.savedHints = this.hintsLeft;

    this.bestStars = this.isDaily ? 0 : (Core.SDK.get('bestStars', {})[this.level] || 0);

    }).setOrigin(1, 0.5);

    this.comboText = this.add.text(W - 20, 108, '', {

    if (par) {
      const good = this.moves <= par;
      const ok = this.moves <= Math.ceil(par * 1.35);
      this.movesText.setColor(good ? '#e8c874' : (ok ? '#c9c2d8' : '#e0556a'));

  }
  updateScore(smooth) {

    this.tweens.addCounter({
      from: prev, to: this.score, duration: 260,
      onUpdate: function (tw) { self.scoreText.setText('★ ' + Math.round(tw.getValue())); },

    }).setOrigin(0.5).setResolution(2);

  makeBtn(x, y, icon, label, onClick) {

    }).setOrigin(0.5).setResolution(2);
    const tw = Math.max(120, tipText.width + 28), th = 36;

    tipBg.lineStyle(1.5, 0xd4af37, 0.8); tipBg.strokeRoundedRect(-tw/2, -th/2, tw, th, 12);

  // ЛОГИКА ПЕРЕМЕШКИ
  async doShuffle() {
    if (this.animating || this.levelJustFinished) return;
    if (this.shufflesLeft > 0) {
      this.shufflesLeft--;
      Core.SDK.save({ shufflesOwned: this.shufflesLeft });
      this.updateShuffleLabel();
      this.performShuffle();
      return;
    }
    const coins = Core.SDK.get('coins', 0);
    if (coins >= 50) {
      Core.SDK.save({ coins: coins - 50, shufflesOwned: this.shufflesLeft + 1 });
      this.shufflesLeft++; this.updateShuffleLabel(); this.updateCoins();
      Core.Audio.buy(); this.showToast('Куплено!');
      this.doShuffle();
    } else {
      this.showToast('Не хватает монет (нужно 50)');
    }
  }
  updateShuffleLabel() { if (this.shuffleBtn) this.shuffleBtn.labelT.setText('Микс (' + this.shufflesLeft + ')'); }
  
  performShuffle() {
    this.animating = true;
    const activeTubes = [];
    const allBalls = [];
    
    // Собираем все шары из нерешенных колб
    this.tubes.forEach((t, i) => {
      if (!Logic.isUniform(t)) {
        activeTubes.push(i);
        allBalls.push(...t);
      }
    });
    
    // Перемешиваем
    Core.Utils.shuffleWith(allBalls);
    
    // Распределяем обратно
    let ballIdx = 0;
    activeTubes.forEach(i => {
      const count = this.tubes[i].length;
      this.tubes[i] = allBalls.slice(ballIdx, ballIdx + count);
      ballIdx += count;
    });

    // Визуально обновляем
    activeTubes.forEach(i => {
      this.ballGfx[i].forEach(b => b.destroy());
      this.ballGfx[i] = [];
      for (let j = 0; j < this.tubes[i].length; j++) {
        const b = this.makeBall(i, j);
        b.setAlpha(0);
        this.tweens.add({ targets: b, alpha: 1, duration: 300 });
        this.ballGfx[i].push(b);
      }
    });

    Core.Juice.screenFlash(this, 0xf0b060, 0.2, 300);
    Core.Audio.select();
    
    this.time.delayedCall(350, () => {
      this.animating = false;
      this.checkDoneTubes();
    });
  }

  showCombo(n) {

  getStars() {
    const assists = this.getAssists();
    const par = this.parMoves || Core.Solver.estimate(this.tubes || [], this.colors || 3);
    let stars;
    if (this.moves <= par) stars = 3;
    else if (this.moves <= Math.ceil(par * 1.35)) stars = 2;
    else stars = 1;
    if (assists >= 1) stars = Math.min(stars, 2);
    if (assists >= 3) stars = 1;
    return stars;

  onLevelComplete() {
    if (this.levelJustFinished) return;
    this.levelJustFinished = true;
    const stars = this.getStars();
    const perf = this.computeLevelScore(stars);
    this.scoreBreakdown = perf;
    this.starBonus = perf.starBonus;
    this.score = perf.total;
    this.updateScore(true);
    const up = Core.SDK.get('upgrades', {});
    const perks = Core.activePerks();
    const coinBonus = up.coinBonus ? 10 : 0;
    const baseCoins = 20 + stars * 10 + coinBonus;
    const isNewRecord = this.isDaily ? false : (this.score > this.bestScore);
    const recordBonus = isNewRecord ? 20 : 0;
    const patch = {};
    let coinsEarned = 0;
    let firstDaily = false;

    if (this.isDaily) {
      const dateKey = this.dailyDate || todayStr();
      const history = Core.SDK.get('dailyHistory', {});
      const prev = history[dateKey];
      firstDaily = !prev;
      const bestScore = Math.max(prev && prev.bestScore ? prev.bestScore : 0, this.score);
      const bestStars = Math.max(prev && prev.bestStars ? prev.bestStars : 0, stars);
      history[dateKey] = {
        bestScore: bestScore, bestStars: bestStars,
        lastScore: this.score, lastStars: stars,
        moves: this.moves, par: this.parMoves || 0,
        plays: (prev && prev.plays ? prev.plays : 0) + 1,
        completedAt: prev && prev.completedAt ? prev.completedAt : Date.now(),
        updatedAt: Date.now()
      };
      patch.dailyHistory = history;
      if (dateKey === todayStr()) {
        patch.dailyDate = dateKey;
        patch.dailyStars = Math.max(Core.SDK.get('dailyStars', 0), stars);
      }
      coinsEarned = firstDaily ? (baseCoins + 100 + (up.dailyBonus ? 50 : 0)) : 0;
      if (firstDaily) {
        patch.totalScore = Core.SDK.get('totalScore', 0) + this.score;
        patch.totalLevelsCompleted = Core.SDK.get('totalLevelsCompleted', 0) + 1;
      }
    } else {
      const bestScores = Core.SDK.get('bestScores', {});
      if (isNewRecord) bestScores[this.level] = this.score;
      patch.bestScores = bestScores;
      const bestStars = Core.SDK.get('bestStars', {});
      if (stars > (bestStars[this.level] || 0)) bestStars[this.level] = stars;
      patch.bestStars = bestStars;
      coinsEarned = baseCoins + recordBonus;
      this.level++;
      patch.level = this.level;
      patch.totalScore = Core.SDK.get('totalScore', 0) + this.score;
      patch.totalLevelsCompleted = Core.SDK.get('totalLevelsCompleted', 0) + 1;
    }

    coinsEarned = Math.round(coinsEarned * (perks.coinMult || 1));
    patch.coins = Core.SDK.get('coins', 0) + coinsEarned;
    patch.hintsOwned = this.hintsLeft;
    Core.SDK.save(patch);
    this.coinsEarned = coinsEarned;
    this.coinMult = perks.coinMult || 1;
    this.dailyFirstCompletion = firstDaily;
    this.levelScore = perf.total;
    this.totalScore = Core.SDK.get('totalScore', 0);
    this.totalCoins = patch.coins;
    this.isNewRecord = isNewRecord;
    this.starsGot = stars;
    this.recordAfter = this.isDaily
      ? (Core.SDK.get('dailyHistory', {})[this.dailyDate] || {}).bestScore || this.score
      : Core.SDK.get('bestScores', {})[this.level - 1] || this.score;
    Core.Audio.win();
    if (isNewRecord) this.time.delayedCall(500, () => Core.Audio.record());
    Core.Juice.vibrate([40, 40, 40, 40, 80]);
    this.cameras.main.shake(280, 0.004);
    Core.Juice.screenFlash(this, 0xf5f0e6, 0.3, 400);
    this.spawnConfetti();
    this.checkAchievementsAfterWin(stars, Core.SDK.get('totalLevelsCompleted', 0));
    this.time.delayedCall(1100, () => this.showWinPanel());

    if (this.coinMult > 1) {
      panel.add(this.add.text(0, 22, 'Скин: монеты ×' + this.coinMult, { fontFamily: Core.FONT, fontSize: '13px', fontStyle: '400', color: '#e8c874' }).setOrigin(0.5).setResolution(2));
    }

    panel.add(this.add.text(0, 62, 'Ходы: ' + this.moves + (b.par ? ' / цель ' + b.par : ''), { fontFamily: Core.FONT, fontSize: '18px', fontStyle: '400', color: '#c9c2d8' }).setOrigin(0.5).setResolution(2));
    panel.add(this.add.text(0, 96, 'Рекорд: ★ ' + this.recordAfter, { fontFamily: Core.FONT, fontSize: '18px', fontStyle: '400', color: '#e8c874' }).setOrigin(0.5).setResolution(2));
    panel.add(this.add.text(0, 128, 'Всего очков: ' + this.totalScore, { fontFamily: Core.FONT, fontSize: '15px', fontStyle: '400', color: '#9a8fb8' }).setOrigin(0.5).setResolution(2));

    const drawIcon = (type, color) => {

        g.strokeRoundedRect(-4, 5, 8, 10, 2);
      } else if (type === 'replay') {
        g.beginPath(); g.arc(0, 0, 12, Phaser.Math.DegToRad(-90), Phaser.Math.DegToRad(180), false); g.strokePath();
        g.fillStyle(color, 1); g.fillTriangle(0, -17, 0, -7, 9, -12);
      } else if (type === 'next') {
        g.fillStyle(color, 1); g.fillTriangle(-7, -13, -7, 13, 13, 0);
      } else if (type === 'archive') {
        g.strokeRoundedRect(-14, -11, 28, 26, 4);
        g.lineBetween(-14, -3, 14, -3);
        g.lineBetween(-7, -16, -7, -8);
        g.lineBetween(7, -16, 7, -8);
        g.fillStyle(color, 1);
        g.fillCircle(-6, 4, 2); g.fillCircle(0, 4, 2); g.fillCircle(6, 4, 2);
        g.fillCircle(-6, 10, 2); g.fillCircle(0, 10, 2);
      }
      return g;
    };
    const makeIconBtn = (x, y, type, fill, border, iconColor, cb) => {
      const size = 84;
      const shadow = this.add.rectangle(x, y + 5, size, size, 0x000000, 0.45);

    if (this.isDaily) {
      makeIconBtn(-104, 226, 'home', 0x2a2138, 0x4a4460, 0xf5f0e6, goMenu);

      makeIconBtn(104, 226, 'archive', 0xe8c874, 0xa8842a, 0x0a0a10, () => { close(); Core.SDK.gameplayStop(); this.scene.start('DailyArchive'); });
    } else {

  }
  buildLevel(level) { throw new Error('not implemented'); }
  resetState() { throw new Error('not implemented'); }
  doUndo() {}
  showHint() {}
  doShuffle() {}

  getAssists() {
    const perks = Core.activePerks();
    const usedHints = Math.max(0, (this.savedHints || 0) - (this.hintsLeft || 0));
    let a = (perks.hintFree ? 0 : usedHints) + (perks.undoFree ? 0 : (this.undoCount || 0)) + (perks.shuffleFree ? 0 : (this.shuffleCount || 0) * 2);
    if (Core.SDK.get('upgrades', {}).starShield) a = Math.max(0, a - 1);
    return a;
  }

  computeLevelScore(stars) {
    const par = this.parMoves || Core.Solver.estimate(this.tubes || [], this.colors || 3);
    const moves = this.moves || 0;
    const assists = this.getAssists();
    const over = Math.max(0, moves - par);
    const eff = Math.round(800 * Math.max(0, Math.min(1, 1 - over / Math.max(1, par * 1.5))));
    const starBonus = stars * 300;
    const base = 400 + (this.colors || 3) * 60;
    const penalty = assists * 50;
    const perks = Core.activePerks();
    const raw = Math.max(100, base + eff + starBonus - penalty);
    const total = Math.round(raw * (perks.scoreMult || 1));
    return { total: total, base: base, eff: eff, starBonus: starBonus, penalty: penalty, assists: assists, par: par, moves: moves, scoreMult: perks.scoreMult || 1 };
  }

class AchievementsScene extends Phaser.Scene {
  constructor() { super('Achievements'); }

  create() {
    const W = this.scale.width, H = this.scale.height;
    this.cameras.main.setBackgroundColor('#0a0a10');
    const bg = this.add.graphics();
    bg.fillGradientStyle(0x0a0a10, 0x0a0a10, 0x161022, 0x161022, 1);
    bg.fillRect(0, 0, W, H);
    Core.Juice.ambient(this, 10, -1);

    const back = this.add.text(20, 45, '←', { fontFamily: Core.FONT, fontSize: '42px', fontStyle: '400', color: '#f5f0e6' }).setOrigin(0, 0.5).setInteractive({ useHandCursor: true });
    back.on('pointerdown', () => this.scene.start('Menu'));
    this.add.text(W / 2, 45, 'ДОСТИЖЕНИЯ', { fontFamily: Core.FONT, fontSize: '30px', fontStyle: '400', color: '#f5f0e6', stroke: '#000000', strokeThickness: 4 }).setOrigin(0.5).setResolution(2);
    this.countText = this.add.text(W - 20, 45, '', { fontFamily: Core.FONT, fontSize: '20px', fontStyle: '400', color: '#e8c874' }).setOrigin(1, 0.5).setResolution(2);

    this.maskTop = 90;
    this.listY = 140;
    this.listContainer = this.add.container(0, this.listY);
    this.renderList();
    this.cameras.main.fadeIn(240, 0, 0, 0);
  }

  iconOf(id) {
    const map = {
      first_win: ['flag', 1], lvl_10: ['flag', 2], lvl_25: ['flag', 2], lvl_50: ['flag', 3], lvl_100: ['flag', 4],
      score_10k: ['gem', 2], score_50k: ['gem', 3],
      coins_500: ['coin', 1], coins_2000: ['coin', 3],
      perfect_5: ['star', 2], perfect_20: ['star', 3], stars_100: ['star', 3],
      daily_first: ['cal', 1], daily_7: ['cal', 2], daily_30: ['cal', 3], month_stars_30: ['cal', 4],
      collector: ['tube', 2],
      upgrades_1: ['gear', 1], upgrades_all: ['gear', 3],
      record_10: ['chart', 2]
    };
    return map[id] || ['star', 1];
  }

  tierColor(t) { return [0, 0xcd7f32, 0xc0c0c0, 0xe8c874, 0x7c5cff][t] || 0xe8c874; }

  drawGlyph(g, cat, color) {
    g.lineStyle(2.5, color, 1);
    g.fillStyle(color, 1);
    if (cat === 'flag') {
      g.lineBetween(-4, -9, -4, 10);
      g.beginPath(); g.moveTo(-4, -9); g.lineTo(9, -5); g.lineTo(-4, -1); g.closePath(); g.fillPath();
    } else if (cat === 'gem') {
      g.beginPath(); g.moveTo(0, -10); g.lineTo(9, -2); g.lineTo(0, 10); g.lineTo(-9, -2); g.closePath(); g.fillPath();
      g.lineStyle(1.5, 0x0a0a10, 0.5); g.lineBetween(0, -10, 0, 10); g.lineBetween(-9, -2, 9, -2);
    } else if (cat === 'coin') {
      g.fillCircle(0, 0, 10);
      g.fillStyle(0x0a0a10, 0.35); g.fillCircle(0, 0, 6);
      g.fillStyle(color, 1); g.fillCircle(0, 0, 3.5);
    } else if (cat === 'star') {
      const pts = []; for (let i = 0; i < 10; i++) { const r = i % 2 === 0 ? 10 : 4.5; const a = -Math.PI / 2 + i * Math.PI / 5; pts.push([Math.cos(a) * r, Math.sin(a) * r]); }
      g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < 10; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); g.fillPath();
    } else if (cat === 'cal') {
      g.lineStyle(2.5, color, 1); g.strokeRoundedRect(-9, -8, 18, 17, 3);
      g.lineBetween(-9, -3, 9, -3);
      g.lineBetween(-4, -11, -4, -5); g.lineBetween(4, -11, 4, -5);
      g.fillCircle(-3, 3, 1.7); g.fillCircle(3, 3, 1.7);
    } else if (cat === 'tube') {
      g.lineStyle(2.5, color, 1); g.strokeRoundedRect(-6, -9, 12, 18, 5);
      g.fillStyle(color, 0.55); g.fillRoundedRect(-4, 1, 8, 7, { tl: 2, tr: 2, bl: 4, br: 4 });
    } else if (cat === 'gear') {
      const hp = []; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 - Math.PI / 6; hp.push([Math.cos(a) * 9, Math.sin(a) * 9]); }
      g.beginPath(); g.moveTo(hp[0][0], hp[0][1]); for (let i = 1; i < 6; i++) g.lineTo(hp[i][0], hp[i][1]); g.closePath(); g.fillPath();
      g.fillStyle(0x241a3a, 1); g.fillCircle(0, 0, 3.5);
    } else if (cat === 'chart') {
      g.fillRect(-9, 3, 5, 7); g.fillRect(-2, -2, 5, 12); g.fillRect(5, -7, 5, 17);
    }
  }

  drawAchBadge(parent, x, y, cat, tier, unlocked) {
    const col = unlocked ? this.tierColor(tier) : 0x3a3450;
    const ring = this.add.graphics();
    ring.fillStyle(0x241a3a, unlocked ? 1 : 0.8); ring.fillCircle(0, 0, 26);
    ring.lineStyle(2.5, col, unlocked ? 1 : 0.5); ring.strokeCircle(0, 0, 26);
    ring.setPosition(x, y);
    const glyph = this.add.graphics();
    glyph.setPosition(x, y);
    this.drawGlyph(glyph, cat, unlocked ? col : 0x55506a);
    parent.add([ring, glyph]);
  }

  renderList() {
    const W = this.scale.width, H = this.scale.height;
    const s = Core.Achievements.stats();
    const un = Core.Achievements.unlocked();
    const claimedMap = Core.Achievements.claimed();
    this.listContainer.removeAll(true);
    const rowH = 88, gap = 10, rowW = W - 60;
    Core.Achievements.list.forEach((a, i) => {
      const y = i * (rowH + gap);
      const c = this.add.container(W / 2, y);
      const p = Core.Achievements.progress(a, s);
      const done = un.indexOf(a.id) >= 0 || p.done;
      const rewarded = !!claimedMap[a.id];
      const reward = Core.Achievements.rewardFor(a.id);
      const rewardStr = Core.Achievements.rewardLabel(reward);
      const ic = this.iconOf(a.id);
      const card = this.add.graphics();
      card.fillStyle(0x1c1628, done ? 1 : 0.88); card.fillRoundedRect(-rowW / 2, -rowH / 2, rowW, rowH, 14);
      card.lineStyle(2, done ? this.tierColor(ic[1]) : 0x3a3450, done ? 0.9 : 0.5); card.strokeRoundedRect(-rowW / 2, -rowH / 2, rowW, rowH, 14);
      c.add(card);
      this.drawAchBadge(c, -rowW / 2 + 48, 0, ic[0], ic[1], done);
      c.add(this.add.text(-rowW / 2 + 92, -22, a.title, { fontFamily: Core.FONT, fontSize: '18px', fontStyle: '400', color: done ? '#e8c874' : '#f5f0e6' }).setOrigin(0, 0.5).setResolution(2));
      c.add(this.add.text(-rowW / 2 + 92, -2, a.desc, { fontFamily: Core.FONT, fontSize: '12px', fontStyle: '400', color: '#9a8fb8' }).setOrigin(0, 0.5).setResolution(2));
      const rewardLine = rewarded ? '✓ ' + rewardStr : ('Награда: ' + rewardStr);
      c.add(this.add.text(-rowW / 2 + 92, 18, rewardLine, { fontFamily: Core.FONT, fontSize: '13px', fontStyle: '400', color: rewarded ? '#7c5cff' : '#e8c874' }).setOrigin(0, 0.5).setResolution(2));
      c.add(this.add.text(rowW / 2 - 20, -22, (done ? '✓ ' : '') + p.cur + '/' + p.goal, { fontFamily: Core.FONT, fontSize: '13px', fontStyle: '400', color: done ? '#e8c874' : '#c9c2d8' }).setOrigin(1, 0.5).setResolution(2));
      const barX = -rowW / 2 + 92, barY = 32, barW = rowW - 180, barH = 8;
      const track = this.add.graphics(); track.fillStyle(0x0a0a10, 1); track.fillRoundedRect(barX, barY - barH / 2, barW, barH, 4); c.add(track);
      const fillW = Math.max(0, Math.min(1, p.cur / p.goal)) * barW;
      if (fillW > 0) { const fg = this.add.graphics(); fg.fillStyle(done ? this.tierColor(ic[1]) : 0x7c5cff, 1); fg.fillRoundedRect(barX, barY - barH / 2, fillW, barH, 4); c.add(fg); }
      this.listContainer.add(c);
    });
    this.countText.setText(Core.Achievements.count() + ' / ' + Core.Achievements.list.length);

    const totalH = Core.Achievements.list.length * (rowH + gap);
    const viewH = H - this.maskTop - 20;
    if (this.listMask) { this.listMask.destroy(); this.listMask = null; }
    const maskShape = this.make.graphics({ x: 0, y: this.maskTop });
    maskShape.fillRect(0, 0, W, viewH);
    this.listContainer.setMask(maskShape.createGeometryMask());
    this.listMask = maskShape;
    this.listContainer.y = this.listY;
    const minY = this.listY - Math.max(0, totalH - viewH);
    const maxY = this.listY;
    let dragging = false, startY = 0, startScrollY = 0;
    this.input.removeAllListeners('pointerdown');
    this.input.removeAllListeners('pointerup');
    this.input.removeAllListeners('pointermove');
    this.input.removeAllListeners('wheel');
    this.input.on('pointerdown', (p) => { if (p.y > this.maskTop) { dragging = true; startY = p.y; startScrollY = this.listContainer.y; } });
    this.input.on('pointerup', () => { dragging = false; });
    this.input.on('pointermove', (p) => { if (dragging) this.listContainer.y = Math.max(minY, Math.min(maxY, startScrollY + (p.y - startY))); });
    this.input.on('wheel', (p, objs, dx, dy) => { this.listContainer.y = Math.max(minY, Math.min(maxY, this.listContainer.y - dy * 0.5)); });
  }
}

class LevelMapScene extends Phaser.Scene {
  constructor() { super('LevelMap'); }
  create() {
    const W = this.scale.width, H = this.scale.height;
    this.currentPage = Math.floor((Core.SDK.get('level', 1) - 1) / 20);
    const bg = this.add.graphics();
    bg.fillGradientStyle(0x0a0a10, 0x0a0a10, 0x161022, 0x161022, 1);
    bg.fillRect(0, 0, W, H);
    Core.Juice.ambient(this, 14, -1);
    const back = this.add.text(20, 45, '←', {
      fontFamily: Core.FONT, fontSize: '54.6px', fontStyle: '900', color: '#f5f0e6'
    }).setOrigin(0, 0.5).setInteractive({ useHandCursor: true });
    back.on('pointerdown', () => this.scene.start('Menu'));
    this.add.text(W / 2, 45, 'УРОВНИ', Core.TextStyles.heading(30)).setOrigin(0.5);
    this.coinLabel = Core.coinLabel(this, W - 20, 45, Core.SDK.get('coins', 0), { fontSize: 20, iconSize: 22, anchor: 'right' });
    this.gridContainer = this.add.container(0, 0);
    this.pageText = this.add.text(W / 2, H - 60, '', Core.TextStyles.soft(16, '#c9c2d8')).setOrigin(0.5);
    this.prevBtn = this.add.rectangle(60, H - 60, 60, 50, 0x1c1628).setOrigin(0.5).setStrokeStyle(2, 0xd4af37, 0.6);
    this.add.text(60, H - 60, '‹', { fontFamily: Core.FONT, fontSize: '41.6px', fontStyle: '900', color: '#f5f0e6' }).setOrigin(0.5);
    this.prevBtn.setInteractive({ useHandCursor: true });
    this.prevBtn.on('pointerdown', () => { if (this.currentPage > 0) { this.currentPage--; this.renderPage(); } });
    this.nextBtn = this.add.rectangle(W - 60, H - 60, 60, 50, 0x1c1628).setOrigin(0.5).setStrokeStyle(2, 0xd4af37, 0.6);
    this.add.text(W - 60, H - 60, '›', { fontFamily: Core.FONT, fontSize: '41.6px', fontStyle: '900', color: '#f5f0e6' }).setOrigin(0.5);
    this.nextBtn.setInteractive({ useHandCursor: true });
    this.nextBtn.on('pointerdown', () => { this.currentPage++; this.renderPage(); });
    this.renderPage();
    this.cameras.main.fadeIn(250, 0, 0, 0);
  }
  renderPage() {
    this.gridContainer.removeAll(true);
    const W = this.scale.width, H = this.scale.height;
    const currentLevel = Core.SDK.get('level', 1);
    const bestStars = Core.SDK.get('bestStars', {});
    const bestScores = Core.SDK.get('bestScores', {});
    const perPage = 20, cols = 4;
    const startLevel = this.currentPage * perPage + 1;
    const cellW = 150, cellH = 150, gapX = 15, gapY = 15;
    const totalW = cols * cellW + (cols - 1) * gapX;
    const startX = (W - totalW) / 2 + cellW / 2;
    const startY = 150;
    for (let i = 0; i < perPage; i++) {
      const lvl = startLevel + i;
      const col = i % cols, row = Math.floor(i / cols);
      const x = startX + col * (cellW + gapX);
      const y = startY + row * (cellH + gapY);
      const locked = lvl > currentLevel;
      const done = lvl < currentLevel;
      const isCurrent = lvl === currentLevel;
      const stars = bestStars[lvl] || 0;
      const record = bestScores[lvl] || 0;
      const cell = this.add.container(x, y);
      let bgColor = 0x1c1628, strokeColor = 0x4a4460, strokeAlpha = 0.6;
      if (isCurrent) { strokeColor = 0xd4af37; strokeAlpha = 1; }
      else if (done) { strokeColor = 0xe8c874; strokeAlpha = 0.75; }
      const bg = this.add.rectangle(0, 0, cellW, cellH, bgColor).setOrigin(0.5).setStrokeStyle(isCurrent ? 3 : 2, strokeColor, strokeAlpha);
      cell.add(bg);
      if (isCurrent) this.tweens.add({ targets: bg, alpha: 0.75, duration: 700, yoyo: true, repeat: -1, ease: 'Sine.InOut' });
      if (locked) {
        cell.add(this.add.text(0, -8, '🔒', { fontSize: '34px' }).setOrigin(0.5).setAlpha(0.45));
      } else {
        cell.add(this.add.text(0, -34, String(lvl), {
          fontFamily: Core.FONT, fontSize: '38px', fontStyle: '400',
          color: isCurrent ? '#e8c874' : (done ? '#f5f0e6' : '#c9c2d8'),
          stroke: '#000000', strokeThickness: 3
        }).setOrigin(0.5).setResolution(2));
        for (let s = 0; s < 3; s++) {
          const on = s < stars;
          cell.add(this.add.text(-30 + s * 30, 8, '★', {
            fontFamily: Core.FONT, fontSize: '22px', fontStyle: '400',
            color: on ? '#e8c874' : '#3a3450'
          }).setOrigin(0.5).setResolution(2));
        }
        cell.add(this.add.text(0, 44, record ? ('РЕКОРД ★ ' + record) : 'РЕКОРДА НЕТ', {
          fontFamily: Core.FONT, fontSize: record ? '14px' : '12px', fontStyle: '400',
          color: record ? '#e8c874' : '#6f6785'
        }).setOrigin(0.5).setResolution(2));
        bg.setInteractive({ useHandCursor: true });
        bg.on('pointerover', () => bg.setFillStyle(0x2a2138));
        bg.on('pointerout', () => bg.setFillStyle(bgColor));
        bg.on('pointerdown', () => { Core.Audio.select(); this.scene.start('BallSort', { level: lvl, mode: 'level' }); });
      }
      this.gridContainer.add(cell);
    }
    const totalPages = Math.max(1, Math.ceil(currentLevel / perPage));
    this.pageText.setText('Страница ' + (this.currentPage + 1) + ' / ' + totalPages);
    this.prevBtn.setAlpha(this.currentPage === 0 ? 0.3 : 1);
    this.nextBtn.setAlpha(this.currentPage >= totalPages - 1 ? 0.3 : 1);
  }
}

  setShopTab(tab) {
    this.shopTab = tab; Core._shopTab = tab;

      this.tabs[k].bg.setFillStyle(on ? 0xe8c874 : 0x1c1628);

  createHintCard(x, y, count, price, badge) {

      c.add(this.add.rectangle(58, -66, 84, 26, 0x7c5cff).setOrigin(0.5));
      c.add(this.add.text(58, -66, badge, { fontFamily: Core.FONT, fontSize: '12px', fontStyle: '400', color: '#f5f0e6' }).setOrigin(0.5).setResolution(2));
    }
    btn.on('pointerover', () => btn.setAlpha(0.85));
    btn.on('pointerout', () => btn.setAlpha(1));
    btn.on('pointerdown', () => this.buyHint(count, price));

  }

  renderUpgrades() {
    const W = this.scale.width;
    this.content.add(this.add.text(W / 2, 205, 'Постоянные улучшения. Покупаются один раз и работают всегда.', {
      fontFamily: Core.FONT, fontSize: '15px', fontStyle: '400', color: '#9a8fb8', align: 'center', wordWrap: { width: W - 100 }
    }).setOrigin(0.5).setResolution(2));
    this.createUpgradeCard(280, 'coinBonus', 'КОШЕЛЬ', '+10 монет за каждую победу', 400);
    this.createUpgradeCard(410, 'dailyBonus', 'ДНЕВНОЙ БОНУС', '+50 монет за первое прохождение дня', 500);
    this.createUpgradeCard(540, 'starShield', 'ЩИТ ЗВЁЗД', 'Первая подсказка/отмена/шаффл не снижают звёзды', 800);
  }

  createUpgradeCard(y, key, name, desc, cost) {
    const W = this.scale.width;
    const owned = !!Core.SDK.get('upgrades', {})[key];
    const c = this.add.container(W / 2, y);
    const bg = this.add.rectangle(0, 0, W - 80, 110, 0x1c1628).setStrokeStyle(2, owned ? 0xd4af37 : 0x4a4460, owned ? 1 : 0.65);
    c.add(bg);
    c.add(this.add.text(-(W - 80) / 2 + 26, -26, name, {
      fontFamily: Core.FONT, fontSize: '21px', fontStyle: '400', color: owned ? '#e8c874' : '#f5f0e6'
    }).setOrigin(0, 0.5).setResolution(2));
    c.add(this.add.text(-(W - 80) / 2 + 26, 14, desc, {
      fontFamily: Core.FONT, fontSize: '14px', fontStyle: '400', color: '#9a8fb8', wordWrap: { width: W - 320 }
    }).setOrigin(0, 0.5).setResolution(2));
    const btnX = (W - 80) / 2 - 100;
    if (owned) {
      const b = this.add.rectangle(btnX, 0, 150, 52, 0xe8c874).setStrokeStyle(2, 0xa8842a, 1);
      c.add(b);
      c.add(this.add.text(btnX, 0, '✓ АКТИВНО', { fontFamily: Core.FONT, fontSize: '15px', fontStyle: '400', color: '#0a0a10' }).setOrigin(0.5).setResolution(2));
    } else {
      const b = this.add.rectangle(btnX, 0, 150, 52, 0x241a3a).setStrokeStyle(2, 0xd4af37, 1).setInteractive({ useHandCursor: true });
      c.add(b);
      c.add(Core.coinLabel(this, btnX, 0, cost, { fontSize: 17, iconSize: 19, anchor: 'center' }));
      b.on('pointerover', () => b.setAlpha(0.85));
      b.on('pointerout', () => b.setAlpha(1));
      b.on('pointerdown', () => this.buyUpgrade(key, cost));
    }
    this.content.add(c);
  }

  buyUpgrade(key, cost) {
    const coins = Core.SDK.get('coins', 0);
    if (coins < cost) { this.showToast('Не хватает монет'); return; }
    const up = Core.SDK.get('upgrades', {});
    if (up[key]) { this.showToast('Уже активно'); return; }
    up[key] = true;
    Core.SDK.save({ coins: coins - cost, upgrades: up });
    Core.Audio.buy();
    this.showToast('Улучшение куплено');
    this.scene.restart();
  }

  renderSkins() {
    this.skinContainer = this.content;
    const W = this.scale.width;
    this.tubeTab = this.makeSubTab(W / 2 - 90, 210, 'ТРУБЫ', 'tubes');
    this.ballTab = this.makeSubTab(W / 2 + 90, 210, 'ШАРЫ', 'balls');
    this.content.add([this.tubeTab.bg, this.tubeTab.lbl, this.ballTab.bg, this.ballTab.lbl]);
    this.updateSubTabs();
    const startY = 280, rowH = 115;
    if (this.skinTab === 'tubes') {
      const owned = Core.SDK.get('ownedSkins', ['classic']);
      const current = Core.SDK.get('currentSkin', 'classic');
      Object.keys(Core.Skins.tubes).forEach((k, i) => this.createSkinRow(k, Core.Skins.tubes[k], owned, current, startY + i * rowH, rowH - 12));
    } else {
      const owned = Core.SDK.get('ownedBallSkins', ['classic']);
      const current = Core.SDK.get('currentBallSkin', 'classic');
      Object.keys(Core.Skins.balls).forEach((k, i) => this.createBallSkinRow(k, Core.Skins.balls[k], owned, current, startY + i * rowH, rowH - 12));
    }
  }

  makeSubTab(x, y, text, key) {
    const bg = this.add.rectangle(x, y, 160, 44, 0x1c1628).setStrokeStyle(2, 0x4a4460, 0.7).setInteractive({ useHandCursor: true });
    const lbl = this.add.text(x, y, text, { fontFamily: Core.FONT, fontSize: '16px', fontStyle: '400', color: '#9a8fb8' }).setOrigin(0.5).setResolution(2);
    bg.on('pointerdown', () => { Core.Audio.select(); this.setSkinTab(key); });
    return { bg, lbl };
  }

  updateSubTabs() {
    const set = (t, on) => { t.bg.setFillStyle(on ? 0x7c5cff : 0x1c1628); t.bg.setStrokeStyle(2, on ? 0xe8c874 : 0x4a4460, on ? 1 : 0.7); t.lbl.setColor(on ? '#f5f0e6' : '#9a8fb8'); };
    set(this.tubeTab, this.skinTab === 'tubes');
    set(this.ballTab, this.skinTab === 'balls');
  }

  setSkinTab(tab) {
    this.skinTab = tab; Core._skinTab = tab;
    this.content.removeAll(true);
    this.renderSkins();
  }

  createSkinRow(key, skin, owned, current, y, height) {
    const W = this.scale.width;
    const c = this.add.container(W / 2, y);
    const exclusive = !!skin.exclusive;
    const testUnlock = exclusive && !!Core.TEST_OBSIDIAN;
    const isOwned = owned.indexOf(key) >= 0 || testUnlock;
    const isCurrent = current === key;
    const bg = this.add.rectangle(0, 0, W - 60, height, 0x1c1628).setOrigin(0.5)
      .setStrokeStyle(2, isCurrent ? 0xd4af37 : (exclusive ? 0x7c5cff : 0x4a4460), isCurrent ? 1 : 0.65);
    c.add(bg);
    const g = this.add.graphics();
    const tx = -W / 2 + 80, ty = 0, tw = 40, th = 80, r = 10;
    const x0 = tx - tw / 2, y0 = ty - th / 2;
    g.fillStyle(skin.fill, skin.fillAlpha);
    g.lineStyle(skin.lineWidth, skin.stroke, skin.strokeAlpha);
    g.beginPath();
    g.moveTo(x0, y0);
    g.lineTo(x0, y0 + th - r);
    g.arc(x0 + r, y0 + th - r, r, Math.PI, Math.PI / 2, true);
    g.lineTo(x0 + tw - r, y0 + th);
    g.arc(x0 + tw - r, y0 + th - r, r, Math.PI / 2, 0, true);
    g.lineTo(x0 + tw, y0);

const GameRegistry = { title: 'Ball Sort', sceneKey: 'BallSort' };

const MAX_TUBE = 4;

const Logic = {
  clone: function (t) { return t.map(function (x) { return x.slice(); }); },
  isUniform: function (t) { return t.length === MAX_TUBE && t.every(function (c) { return c === t[0]; }); },
  isSolved: function (tubes) { return tubes.every(function (t) { return t.length === 0 || Logic.isUniform(t); }); },
  canPour: function (tubes, from, to) {
    if (from === to) return false;
    const f = tubes[from], t = tubes[to];
    if (f.length === 0) return false;
    if (t.length >= MAX_TUBE) return false;
    if (t.length === 0) return true;
    return t[t.length - 1] === f[f.length - 1];
  },
  pourCount: function (tubes, from, to) {
    if (!Logic.canPour(tubes, from, to)) return 0;
    const f = tubes[from], t = tubes[to], c = f[f.length - 1];
    let count = 0;
    for (let i = f.length - 1; i >= 0 && f[i] === c; i--) count++;
    return Math.min(count, MAX_TUBE - t.length);
  },
  applyPour: function (tubes, from, to) {
    const n = Logic.pourCount(tubes, from, to);
    for (let k = 0; k < n; k++) tubes[to].push(tubes[from].pop());
    return n;
  }
};


Core.Solver = {
  key: function (t) {
    return t.map(function (x) { return x.join(','); }).sort().join('|');
  },
  shortest: function (tubes, cap) {
    cap = cap || 12000;
    const start = Logic.clone(tubes);
    const queue = [{ t: start, d: 0 }];
    const seen = new Set([this.key(start)]);
    let head = 0;
    while (head < queue.length) {
      const cur = queue[head++];
      if (Logic.isSolved(cur.t)) return { status: 'SOLVED', moves: cur.d };
      if (seen.size >= cap) break;
      for (let a = 0; a < cur.t.length; a++) {
        if (cur.t[a].length === 0 || Logic.isUniform(cur.t[a])) continue;
        for (let b = 0; b < cur.t.length; b++) {
          if (!Logic.canPour(cur.t, a, b)) continue;
          if (cur.t[b].length === 0) {
            let firstEmpty = -1;
            for (let e = 0; e < cur.t.length; e++) if (cur.t[e].length === 0) { firstEmpty = e; break; }
            if (b !== firstEmpty) continue;
          }
          const next = Logic.clone(cur.t);
          Logic.applyPour(next, a, b);
          const k = this.key(next);
          if (seen.has(k)) continue;
          seen.add(k);
          queue.push({ t: next, d: cur.d + 1 });
        }
      }
    }
    return { status: seen.size >= cap ? 'UNKNOWN' : 'UNSOLVABLE', moves: null };
  },
  estimate: function (tubes, colors) {
    let runs = 0;
    tubes.forEach(function (t) {
      for (let i = 0; i < t.length; i++) if (i === 0 || t[i] !== t[i - 1]) runs++;
    });
    const base = Math.max(colors * 2, runs - colors);
    return Math.ceil(base * 1.7) + colors + 2;
  },
  parFor: function (tubes, colors) {
    const r = this.shortest(tubes, 12000);
    return r.status === 'SOLVED' ? r.moves : this.estimate(tubes, colors);
  }
};

function isSolvable(tubes, maxDepth) {
  const start = Date.now();
  const queue = [Logic.clone(tubes)];
  const visited = new Set();
  
  function keyOf(t) { return t.map(x => x.join(',')).join('|'); }
  
  while (queue.length > 0) {
    if (Date.now() - start > 400) return true; 
    const current = queue.shift();
    if (Logic.isSolved(current)) return true;
    const k = keyOf(current);
    if (visited.has(k)) continue;
    visited.add(k);
    if (visited.size > 2000) return true; 

    for (let a = 0; a < current.length; a++) {
      for (let b = 0; b < current.length; b++) {
        if (!Logic.canPour(current, a, b)) continue;
        if (current[b].length === 0 && Logic.isUniform(current[a])) continue;
        const next = Logic.clone(current);
        Logic.applyPour(next, a, b);
        queue.push(next);
      }
    }
  }
  return false;
}

function generateLevel(level, seed) {
  const rng = (seed !== undefined && seed !== null) ? mulberry32(seed) : Math.random;
  let colors;
  if (seed !== undefined && seed !== null) {
    colors = 5 + Math.floor(rng() * 3);
  } else {
    if (level <= 1) colors = 3;
    else if (level <= 3) colors = 4;
    else if (level <= 7) colors = 5;
    else if (level <= 15) colors = 6;
    else if (level <= 30) colors = 7;
    else colors = Math.min(9, 7 + Math.floor((level - 30) / 15));
  }
  for (let attempt = 0; attempt < 15; attempt++) {
    const balls = [];
    for (let c = 0; c < colors; c++) for (let i = 0; i < MAX_TUBE; i++) balls.push(c);
    Core.Utils.shuffleWith(balls, rng);
    const tubes = [];
    for (let i = 0; i < colors; i++) tubes.push(balls.slice(i * MAX_TUBE, (i + 1) * MAX_TUBE));
    tubes.push([]); tubes.push([]);
    if (Logic.isSolved(tubes)) continue;
    if (isSolvable(tubes, 50 + colors * 8)) return { tubes: tubes, colors: colors };
  }
  const balls = [];
  for (let c = 0; c < colors; c++) for (let i = 0; i < MAX_TUBE; i++) balls.push(c);
  const tubes = [];
  for (let i = 0; i < colors; i++) tubes.push(balls.slice(i * MAX_TUBE, (i + 1) * MAX_TUBE));
  tubes.push([]); tubes.push([]);
  
  for(let k=0; k<20; k++) {
     const from = Math.floor(rng() * tubes.length);
     const to = Math.floor(rng() * tubes.length);
     if(from !== to && tubes[from].length > 0 && tubes[to].length < MAX_TUBE) {
         tubes[to].push(tubes[from].pop());
     }
  }
  return { tubes: tubes, colors: colors };
}

class BallSortScene extends BaseGameScene {
  constructor() { super('BallSort'); }
  buildLevel(level) {
    this.ballSkin = Core.SDK.get('currentBallSkin', 'classic');
    const data = this.isDaily ? generateLevel(0, this.seed) : generateLevel(level);
    this.tubes = data.tubes;
    this.colors = data.colors;
    this.parMoves = data.parMoves || Core.Solver.parFor(this.tubes, this.colors);
    this.layoutTubes();
    this.renderTubes();
    this.updateMoves();
  }
  resetState() {
    this.selected = -1;
    this.undoStack = [];
    this.animating = false;
    this.shuffleCount = 0;
    this.doneTubes = new Set();
    this.bonusAwarded = new Set();
    this.doneGlows = {};
    this.selectedGlow = null;
  }
  layoutTubes() {
    const W = this.scale.width;
    const n = this.tubes.length;
    let cols, rows;
    if (n <= 5) { cols = n; rows = 1; }
    else { cols = Math.ceil(n / 2); rows = 2; }
    const tubeW = 64, tubeH = 240, hGap = 20, vGap = 50;
    const totalW = cols * tubeW + (cols - 1) * hGap;
    const startX = (W - totalW) / 2 + tubeW / 2;
    const startY = 185 + tubeH / 2;
    this.tubeGeom = [];
    for (let i = 0; i < n; i++) {
      const col = i % cols, row = Math.floor(i / cols);
      this.tubeGeom.push({ x: startX + col * (tubeW + hGap), y: startY + row * (tubeH + vGap), w: tubeW, h: tubeH });
    }
  }
  renderTubes() {
    this.tubeGfx = []; this.ballGfx = []; this.zones = [];
    for (let i = 0; i < this.tubes.length; i++) {
      this.drawTube(i, false);
      this.ballGfx[i] = [];
      for (let j = 0; j < this.tubes[i].length; j++) this.ballGfx[i].push(this.makeBall(i, j));
    }
    for (let i = 0; i < this.tubes.length; i++) {
      const g = this.tubeGeom[i];
      const objs = [this.tubeGfx[i]].concat(this.ballGfx[i]);
      objs.forEach(function (o) { o.setAlpha(0); o.y = o.y + 60; });
      this.tweens.add({ targets: objs, alpha: 1, y: '-=60', duration: 420, delay: i * 55, ease: 'Back.Out' });
      
      const zone = this.add.zone(g.x, g.y, g.w + 40, g.h + 40).setInteractive({ useHandCursor: true });
      zone.on('pointerdown', () => this.onTubeClick(i));
      this.zones.push(zone);
    }
  }
  drawTube(i, selected) {
    if (this.tubeGfx[i]) this.tubeGfx[i].destroy();
    const g = this.tubeGeom[i];
    const x0 = g.x - g.w / 2, y0 = g.y - g.h / 2, r = 14;
    const s = this.skin;
    const gfx = this.add.graphics();
    if (selected) {
      gfx.fillStyle(s.activeFill, s.activeFillAlpha);
      gfx.lineStyle(s.lineWidth + 1, s.activeStroke, 0.95);
    } else {
      gfx.fillStyle(s.fill, s.fillAlpha);
      gfx.lineStyle(s.lineWidth, s.stroke, s.strokeAlpha);
    }
    gfx.beginPath();
    gfx.moveTo(x0, y0);
    gfx.lineTo(x0, y0 + g.h - r);
    gfx.arc(x0 + r, y0 + g.h - r, r, Math.PI, Math.PI / 2, true);
    gfx.lineTo(x0 + g.w - r, y0 + g.h);
    gfx.arc(x0 + g.w - r, y0 + g.h - r, r, Math.PI / 2, 0, true);
    gfx.lineTo(x0 + g.w, y0);
    gfx.closePath();
    gfx.strokePath(); gfx.fillPath();
    this.tubeGfx[i] = gfx;
  }
  createSelectionGlow(i) {
    if (this.selectedGlow) this.selectedGlow.destroy();
    const g = this.tubeGeom[i];
    const glow = this.add.rectangle(g.x, g.y, g.w + 24, g.h + 24, 0xd4af37, 0.12).setStrokeStyle(3, 0xd4af37, 0.9).setDepth(-2);
    this.tweens.add({ targets: glow, alpha: 0.03, duration: 700, yoyo: true, repeat: -1, ease: 'Sine.InOut' });
    this.selectedGlow = glow;
  }
  clearSelectionGlow() {
    if (this.selectedGlow) { this.selectedGlow.destroy(); this.selectedGlow = null; }
  }
  ballPos(tubeIdx, idxFromBottom) {
    const g = this.tubeGeom[tubeIdx];
    const ballR = 26, step = ballR * 2 + 2, bottomPad = 12;
    return { x: g.x, y: g.y + g.h / 2 - bottomPad - ballR - idxFromBottom * step };
  }
  makeBall(tubeIdx, idx) {
    const pos = this.ballPos(tubeIdx, idx);
    const color = Core.PALETTE[this.tubes[tubeIdx][idx] % Core.PALETTE.length];
    const c = Core.renderBall(this, 26, color, this.ballSkin || 'classic');
    c.setPosition(pos.x, pos.y);
    return c;
  }
  onTubeClick(i) {
    if (this.animating || this.levelJustFinished) return;
    if (this.selected === -1) {
      if (this.tubes[i].length === 0) return;
      if (Logic.isUniform(this.tubes[i])) return;
      this.selected = i;
      this.drawTube(i, true); this.liftTop(i, true);
      this.createSelectionGlow(i);
      const g = this.tubeGeom[i];
      Core.Juice.ring(this, g.x, g.y, 0xd4af37, 20, g.w * 0.9, 400);
      Core.Audio.select();
    } else if (this.selected === i) {
      this.drawTube(i, false); this.liftTop(i, false); this.selected = -1;
      this.clearSelectionGlow();
    } else {
      const from = this.selected, to = i;
      if (Logic.canPour(this.tubes, from, to)) {
        this.drawTube(from, false); this.liftTop(from, false); this.selected = -1;
        this.clearSelectionGlow();
        this.pour(from, to, true, true);
      } else {
        Core.Audio.error(); Core.Juice.vibrate(30);
        this.cameras.main.shake(180, 0.006);
        this.shake(to);
        this.combo = 0; this.updateComboIndicator();
        this.drawTube(from, false); this.liftTop(from, false);
        this.clearSelectionGlow();
        if (this.tubes[i].length > 0 && !Logic.isUniform(this.tubes[i])) {
          this.selected = i; this.drawTube(i, true); this.liftTop(i, true);
          this.createSelectionGlow(i);
        } else this.selected = -1;
      }
    }
  }
  liftTop(i, on) {
    const top = this.ballGfx[i][this.ballGfx[i].length - 1];
    if (!top) return;
    const base = this.ballPos(i, this.tubes[i].length - 1);
    this.tweens.add({ targets: top, y: on ? base.y - 12 : base.y, duration: 140, ease: 'Cubic.Out' });
  }
  shake(i) {
    const self = this;
    [this.tubeGfx[i]].concat(this.ballGfx[i]).forEach(function (t) {
      const bx = t.x;
      self.tweens.add({ targets: t, x: bx + 8, duration: 45, yoyo: true, repeat: 2, ease: 'Sine.InOut', onComplete: function () { t.x = bx; } });
    });
  }
  checkDoneTubes() {
    for (let i = 0; i < this.tubes.length; i++) {
      const isDone = Logic.isUniform(this.tubes[i]);
      const wasDone = this.doneTubes.has(i);
      if (isDone && !wasDone) this.onTubeCompleted(i);
      else if (!isDone && wasDone) {
        this.doneTubes.delete(i);
        if (this.doneGlows[i]) { this.doneGlows[i].destroy(); delete this.doneGlows[i]; }
      }
    }
  }
  onTubeCompleted(i) {
    this.doneTubes.add(i);
    const g = this.tubeGeom[i];
    const color = Core.PALETTE[this.tubes[i][0] % Core.PALETTE.length];
    const glow = this.add.graphics().setDepth(-1);
    const x0 = g.x - g.w / 2 - 6, y0 = g.y - g.h / 2 - 6, r = 16;
    glow.fillStyle(0xe8c874, 0.10);
    glow.lineStyle(4, 0xe8c874, 1);
    glow.beginPath();
    glow.moveTo(x0, y0);
    glow.lineTo(x0, y0 + g.h + 12 - r);
    glow.arc(x0 + r, y0 + g.h + 12 - r, r, Math.PI, Math.PI / 2, true);
    glow.lineTo(x0 + g.w + 12 - r, y0 + g.h + 12);
    glow.arc(x0 + g.w + 12 - r, y0 + g.h + 12 - r, r, Math.PI / 2, 0, true);
    glow.lineTo(x0 + g.w + 12, y0);
    glow.closePath(); glow.strokePath(); glow.fillPath();
    this.doneGlows[i] = glow;
    this.tweens.add({ targets: glow, alpha: 0.4, duration: 700, yoyo: true, repeat: -1, ease: 'Sine.InOut' });
    Core.Juice.burst(this, g.x, g.y - g.h * 0.15, 0xe8c874, 32, 200);
    Core.Juice.burst(this, g.x, g.y - g.h * 0.15, color, 24, 180);
    const ring = this.add.circle(g.x, g.y, 20, 0xffffff, 0.85).setDepth(940);
    this.tweens.add({ targets: ring, scale: 7, alpha: 0, duration: 550, ease: 'Cubic.Out', onComplete: () => ring.destroy() });
    Core.Juice.ring(this, g.x, g.y, 0xe8c874, 40, 140, 500);
    Core.Juice.screenFlash(this, 0xe8c874, 0.22, 280);
    this.tweens.add({ targets: this.cameras.main, zoom: 1.02, duration: 130, yoyo: true, ease: 'Sine.InOut' });
    Core.Juice.vibrate([30, 30, 30]);
    Core.Audio.tubeComplete();
    if (!this.bonusAwarded.has(i)) {
      this.bonusAwarded.add(i);
      this.addScore(50, i, { color: '#e8c874', size: 34 });
      const label = this.add.text(g.x, g.y - g.h / 2 - 32, '★ +50', {
        fontFamily: Core.FONT, fontSize: '46.8px', fontStyle: '900', color: '#e8c874',
        stroke: '#000000', strokeThickness: 5
      }).setOrigin(0.5).setDepth(1500).setScale(0);
      this.tweens.add({ targets: label, scale: 1, duration: 350, ease: 'Back.Out' });
      this.tweens.add({ targets: label, alpha: 0, y: label.y - 90, duration: 900, delay: 500, onComplete: () => label.destroy() });
    }
  }
  animateMove(src, dst, cnt) {
    if (cnt <= 0) return;
    this.animating = true; this.refreshUndoButton();
    const moved = this.ballGfx[src].splice(-cnt).reverse();
    const destLen = this.ballGfx[dst].length;
    for (let k = 0; k < cnt; k++) {
      this.tubes[dst].push(this.tubes[src].pop());
      this.ballGfx[dst].push(moved[k]);
    }
    const self = this;
    for (let k = 0; k < cnt; k++) {
      const ball = moved[k];
      const target = this.ballPos(dst, destLen + k);
      const trail = this.time.addEvent({
        delay: 40, loop: true,
        callback: function () {
          if (!ball.active) { trail.remove(); return; }
          Core.Juice.trailPuff(self, ball.x + (Math.random() - 0.5) * 10, ball.y + (Math.random() - 0.5) * 10, 0xffffff);
        }
      });
      this.tweens.add({
        targets: ball, x: target.x, y: target.y, duration: 280, delay: k * 80, ease: 'Cubic.Out',
        onComplete: function () {
          trail.remove();
          self.tweens.add({ targets: ball, scaleX: 1.2, scaleY: 0.8, duration: 100, yoyo: true, ease: 'Quad.Out' });
          Core.Juice.flash(self, target.x, target.y, 26);
          Core.Juice.ring(self, target.x, target.y, 0xffffff, 26, 46, 250);
          Core.Audio.drop();
          if (k === cnt - 1) {
            self.animating = false; self.refreshUndoButton();
            self.checkDoneTubes();
            if (Logic.isSolved(self.tubes)) self.onLevelComplete();
          }
        }
      });
    }
  }
  pour(from, to, recordUndo, countMove) {
    const cnt = Logic.pourCount(this.tubes, from, to);
    if (cnt === 0) return;
    if (recordUndo) this.undoStack.push({ from: from, to: to, cnt: cnt });
    this.animateMove(from, to, cnt);
    if (countMove) {
      this.moves++; this.updateMoves(); this.combo++;
      if (this.combo > this.maxCombo) this.maxCombo = this.combo;
      const pts = Math.min(this.combo, 5) * 10;
      this.addScore(pts, to);
      this.updateComboIndicator();
      if (this.combo >= 3 && (this.combo === 3 || this.combo % 5 === 0)) this.showCombo(this.combo);
    }
  }
  doUndo() {
    if (this.animating || this.levelJustFinished) return;
    if (this.undoStack.length === 0) return;
    const last = this.undoStack.pop();
    this.undoCount++; this.combo = 0; this.updateComboIndicator();
    this.clearSelectionGlow();
    this.animateMove(last.to, last.from, last.cnt);
    this.moves = Math.max(0, this.moves - 1);
    this.updateMoves(); this.refreshUndoButton();
  }
  showHint() {
    let best = null, bestScore = Infinity;
    for (let a = 0; a < this.tubes.length; a++) {
      for (let b = 0; b < this.tubes.length; b++) {
        if (!Logic.canPour(this.tubes, a, b)) continue;
        const n = Logic.clone(this.tubes);
        Logic.applyPour(n, a, b);
        let score = 0;
        for (let i = 0; i < n.length; i++) if (n[i].length > 0 && !Logic.isUniform(n[i])) score++;
        if (score < bestScore) { bestScore = score; best = { from: a, to: b }; }
      }
    }
    if (!best) return;
    this.flash(best.from);
    this.time.delayedCall(400, () => this.flash(best.to));
  }
  flash(i) {
    const g = this.tubeGeom[i];
    const r = this.add.rectangle(g.x, g.y, g.w + 20, g.h + 20, 0xe8c874, 0.35).setStrokeStyle(3, 0xe8c874, 1).setDepth(50);
    this.tweens.add({ targets: r, alpha: 0, duration: 600, onComplete: function () { r.destroy(); } });
  }

  doShuffle() {
    if (this.animating || this.levelJustFinished) return;
    const locked = [], free = [];
    for (let i = 0; i < this.tubes.length; i++) {
      if (Logic.isUniform(this.tubes[i])) locked.push(i); else free.push(i);
    }
    if (free.length === 0) { this.showToast('Все колбы уже собраны'); return; }
    const balls = [];
    free.forEach(i => { this.tubes[i].forEach(c => balls.push(c)); });
    if (balls.length === 0 || balls.length % 4 !== 0) { this.showToast('Нечего перемешивать'); return; }
    const k = balls.length / 4;

    let next = null;
    for (let attempt = 0; attempt < 14; attempt++) {
      Core.Utils.shuffleWith(balls, Math.random);
      const sub = [];
      for (let c = 0; c < k; c++) sub.push(balls.slice(c * 4, (c + 1) * 4));
      sub.push([]); sub.push([]);
      if (Logic.isSolved(sub)) continue;
      const info = Core.Solver.shortest(sub, 12000);
      if (info.status === 'SOLVED') { next = sub; break; }
    }
    if (!next) {
      const byColor = {};
      balls.forEach(c => { (byColor[c] = byColor[c] || []).push(c); });
      const cols = Object.keys(byColor).map(Number);
      const sub = cols.map(c => [c, c, c, c]);
      sub.push([]); sub.push([]);
      for (let c = 0; c < cols.length; c++) {
        const a = c, b = (c + 1) % cols.length;
        const t = sub[a][3]; sub[a][3] = sub[b][3]; sub[b][3] = t;
      }
      next = sub;
    }

    this.clearSelectionGlow();
    if (this.tubeGfx) this.tubeGfx.forEach(g => g && g.destroy());
    if (this.ballGfx) this.ballGfx.forEach(arr => arr.forEach(b => b && b.destroy()));
    if (this.zones) this.zones.forEach(z => z && z.destroy());
    this.selected = -1;
    this.undoStack = [];
    this.combo = 0; this.updateComboIndicator();
    for (let j = 0; j < free.length; j++) this.tubes[free[j]] = (next[j] || []).slice();
    this.shuffleCount = (this.shuffleCount || 0) + 1;
    this.layoutTubes();
    this.renderTubes();
    this.checkDoneTubes();
    this.refreshUndoButton();
    Core.Audio.select();
    Core.Juice.vibrate([20, 20]);
    this.showToast('Перемешано');
  }
}

try {
  window.__game = new Phaser.Game({
    type: Phaser.AUTO, width: 720, height: 1280, parent: 'game',
    backgroundColor: '#0a0a10',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [BootScene, MenuScene, AchievementsScene, LevelMapScene, ShopScene, DailyArchiveScene, BallSortScene]
  });
} catch (e) {
  if (window.__showFatal) window.__showFatal('Запуск: ' + (e && e.message));
  console.error(e);
}
