function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function todayStr() {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

Core.SDK = {
  ysdk: null, player: null, isStub: true, saveData: {},
  async init() {
    if (typeof YaGames === 'undefined') { console.log('[SDK] stub'); this.loadStub(); return; }
    try {
      this.ysdk = await Promise.race([
        YaGames.init(),
        new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, 3000); })
      ]);
      this.isStub = false;
      try { this.player = await this.ysdk.getPlayer({ scopes: false }); } catch (e) {}
      if (this.player) {
        try { this.saveData = (await this.player.getData()) || {}; } catch (e) { this.saveData = {}; }
      }
    } catch (e) { console.warn('[SDK] stub:', e.message); this.isStub = true; this.loadStub(); }
    this.migrate();
  },
  loadStub() {
    try { this.saveData = JSON.parse(localStorage.getItem('_game_save') || '{}'); }
    catch (e) { this.saveData = {}; }
  },
  migrate() {
    const d = Core.DEFAULT_SAVE;
    for (const k in d) if (this.saveData[k] === undefined) this.saveData[k] = JSON.parse(JSON.stringify(d[k]));
  },
  async save(patch) {
    Object.assign(this.saveData, patch);
    if (this.isStub || !this.player) { try { localStorage.setItem('_game_save', JSON.stringify(this.saveData)); } catch (e) {} return; }
    try { await this.player.setData(this.saveData, true); } catch (e) {}
  },
  get(key, def) {
    if (this.saveData[key] === undefined) return def !== undefined ? def : Core.DEFAULT_SAVE[key];
    return this.saveData[key];
  },
  async rewarded() {
    if (this.isStub || !this.ysdk) { await new Promise(function (r) { setTimeout(r, 600); }); return true; }
    return new Promise((resolve) => {
      let ok = false;
      try {
        this.ysdk.adv.showRewardedVideo({ callbacks: {
          onRewarded: function () { ok = true; },
          onClose: function () { resolve(ok); },
          onError: function () { resolve(false); }
        }});
      } catch (e) { resolve(false); }
    });
  },
  interstitial() { if (this.isStub || !this.ysdk) return; try { this.ysdk.adv.showFullscreenAdv({ callbacks: {} }); } catch (e) {} },
  gameplayStart() { try { if (this.ysdk?.features?.GameplayAPI) this.ysdk.features.GameplayAPI.start(); } catch (e) {} },
  gameplayStop()  { try { if (this.ysdk?.features?.GameplayAPI) this.ysdk.features.GameplayAPI.stop(); } catch (e) {} }
};

Core.Audio = (function () {
  let ctx = null;
  function ensure() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ctx && ctx.state === 'suspended') ctx.resume();
  }
  function tone(freq, dur, type, vol) {
    ensure(); if (!ctx) return;
    const t = ctx.currentTime, osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type || 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol || 0.12, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(ctx.destination); osc.start(t); osc.stop(t + dur);
  }
  return {
    unlock: ensure,
    select: function () { tone(660, 0.06, 'triangle', 0.1); },
    pour:   function () { tone(380 + Math.random() * 80, 0.1, 'sine', 0.1); },
    drop:   function () { tone(520 + Math.random() * 60, 0.05, 'sine', 0.08); },
    error:  function () { tone(140, 0.15, 'sawtooth', 0.08); },
    coin:   function () { tone(1200, 0.05, 'triangle', 0.1); setTimeout(function () { tone(1600, 0.08, 'triangle', 0.09); }, 60); },
    buy:    function () { tone(523, 0.1, 'triangle', 0.13); setTimeout(function () { tone(784, 0.15, 'triangle', 0.13); }, 90); setTimeout(function () { tone(1047, 0.2, 'triangle', 0.11); }, 200); },
    combo:  function (n) { const b = 660 + Math.min(n, 6) * 60; tone(b, 0.09, 'triangle', 0.11); setTimeout(function () { tone(b + 200, 0.12, 'triangle', 0.1); }, 90); },
    bigCombo: function () { tone(880, 0.12, 'triangle', 0.15); setTimeout(function () { tone(1174, 0.12, 'triangle', 0.15); }, 100); setTimeout(function () { tone(1568, 0.2, 'triangle', 0.13); }, 200); setTimeout(function () { tone(2093, 0.3, 'triangle', 0.12); }, 320); },
    score:  function () { tone(880, 0.05, 'triangle', 0.06); },
    tubeComplete: function () {
      tone(784, 0.12, 'triangle', 0.14);
      setTimeout(function () { tone(988, 0.12, 'triangle', 0.14); }, 100);
      setTimeout(function () { tone(1318, 0.22, 'triangle', 0.12); }, 200);
    },
    record: function () {
      tone(880, 0.1, 'triangle', 0.14);
      setTimeout(function () { tone(1109, 0.1, 'triangle', 0.14); }, 100);
      setTimeout(function () { tone(1318, 0.1, 'triangle', 0.14); }, 200);
      setTimeout(function () { tone(1760, 0.3, 'triangle', 0.13); }, 300);
    },
    achievement: function () {
      tone(659, 0.1, 'triangle', 0.14);
      setTimeout(function () { tone(880, 0.1, 'triangle', 0.14); }, 100);
      setTimeout(function () { tone(1175, 0.2, 'triangle', 0.13); }, 200);
    },
    win: function () {
      tone(523, 0.15, 'triangle', 0.13);
      setTimeout(function () { tone(659, 0.15, 'triangle', 0.13); }, 120);
      setTimeout(function () { tone(784, 0.2, 'triangle', 0.13); }, 240);
      setTimeout(function () { tone(1047, 0.4, 'triangle', 0.11); }, 380);
    }
  };
})();

Core.Utils = {
  shuffleWith: function (a, rng) {
    const rand = rng || Math.random;
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
};

Core.PALETTE = [
  0xe74c3c, 0x3498db, 0x2ecc71, 0xf1c40f, 0x9b59b6,
  0xe67e22, 0x1abc9c, 0xec407a, 0x795548, 0x607d8b
];

Core.Juice = {
  vibrate: function (p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} },
  burst: function (scene, x, y, color, count, speed) {
    count = count || 14; speed = speed || 140;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (60 + Math.random() * speed);
      const r = 3 + Math.random() * 4;
      const p = scene.add.circle(x, y, r, color, 1).setDepth(950);
      scene.tweens.add({
        targets: p, x: x + Math.cos(a) * sp, y: y + Math.sin(a) * sp,
        alpha: 0, scale: 0.2, duration: 380 + Math.random() * 320, ease: 'Cubic.Out',
        onComplete: function () { p.destroy(); }
      });
    }
  },
  flash: function (scene, x, y, r) {
    const f = scene.add.circle(x, y, r, 0xffffff, 0.65).setDepth(940);
    scene.tweens.add({ targets: f, alpha: 0, scale: 1.5, duration: 200, onComplete: function () { f.destroy(); } });
  },
  ring: function (scene, x, y, color, fromR, toR, dur) {
    const r = scene.add.circle(x, y, fromR, color, 0).setStrokeStyle(3, color, 0.9).setDepth(940);
    scene.tweens.add({ targets: r, scale: toR / fromR, alpha: 0, duration: dur || 400, ease: 'Cubic.Out', onComplete: function () { r.destroy(); } });
  },
  ambient: function (scene, count, depth) {
    count = count || 25; depth = depth == null ? -5 : depth;
    const W = scene.scale.width, H = scene.scale.height;
    for (let i = 0; i < count; i++) {
      const color = Core.PALETTE[i % Core.PALETTE.length];
      const r = 3 + Math.random() * 10;
      const x = Math.random() * W, y = H + Math.random() * H;
      const p = scene.add.circle(x, y, r, color, 0.10 + Math.random() * 0.08).setDepth(depth);
      scene.tweens.add({
        targets: p, y: -50, x: x + (Math.random() - 0.5) * 120,
        duration: 12000 + Math.random() * 12000, repeat: -1, ease: 'Linear',
        onRepeat: function () { p.x = Math.random() * W; p.y = H + 20; }
      });
      scene.tweens.add({ targets: p, alpha: 0.03, duration: 2000 + Math.random() * 2000, yoyo: true, repeat: -1, ease: 'Sine.InOut' });
    }
  },
  trailPuff: function (scene, x, y, color) {
    const p = scene.add.circle(x, y, 5 + Math.random() * 3, color, 0.55).setDepth(930);
    scene.tweens.add({ targets: p, scale: 0.2, alpha: 0, duration: 280, ease: 'Cubic.Out', onComplete: function () { p.destroy(); } });
  },
  screenFlash: function (scene, color, alpha, dur) {
    const W = scene.scale.width, H = scene.scale.height;
    const f = scene.add.rectangle(0, 0, W, H, color || 0xffffff, alpha || 0.2).setOrigin(0).setDepth(935);
    scene.tweens.add({ targets: f, alpha: 0, duration: dur || 220, onComplete: function () { f.destroy(); } });
  }
};

Core.makeCoinTexture = function (scene) {
  if (scene.textures.exists('coin_icon')) return;
  const size = 64, cx = size / 2, cy = size / 2, r = size / 2 - 2;
  const g = scene.add.graphics();
  g.fillStyle(0x8b6914, 1); g.fillCircle(cx, cy, r);
  g.fillStyle(0xffd93d, 1); g.fillCircle(cx, cy, r - 2);
  g.lineStyle(2, 0xd4a017, 0.9); g.strokeCircle(cx, cy, r - 8);
  g.fillStyle(0xfff0a0, 0.85); g.fillCircle(cx - r * 0.35, cy - r * 0.35, r * 0.3);
  g.fillStyle(0xffffff, 0.9);  g.fillCircle(cx - r * 0.45, cy - r * 0.45, r * 0.1);
  g.generateTexture('coin_icon', size, size); g.destroy();
};

Core.renderBall = function (scene, radius, color, skinKey) {
  const skin = Core.Skins.balls[skinKey] || Core.Skins.balls.classic;
  const c = scene.add.container(0, 0);
  const r = radius;
  switch (skin.style) {
    case 'flat':
      c.add(scene.add.circle(0, 0, r, color));
      c.add(scene.add.circle(0, 0, r).setStrokeStyle(3, 0x000000, 0.35));
      c.add(scene.add.circle(-r * 0.25, -r * 0.25, r * 0.22, 0xffffff, 0.25));
      break;
    case 'neon':
      c.add(scene.add.circle(0, 0, r + 7, color, 0.25));
      c.add(scene.add.circle(0, 0, r + 3, color, 0.45));
      c.add(scene.add.circle(0, 0, r, color));
      c.add(scene.add.circle(0, 0, r).setStrokeStyle(2, 0xffffff, 0.85));
      c.add(scene.add.circle(-r * 0.3, -r * 0.3, r * 0.28, 0xffffff, 0.7));
      break;
    case 'metal':
      c.add(scene.add.circle(r * 0.15, r * 0.2, r * 0.85, 0x000000, 0.35));
      c.add(scene.add.circle(0, 0, r, 0x202028));
      c.add(scene.add.circle(0, 0, r - 2, color));
      c.add(scene.add.circle(0, 0, r - 7, 0x000000, 0.18));
      c.add(scene.add.circle(-r * 0.32, -r * 0.32, r * 0.3, 0xffffff, 0.7));
      c.add(scene.add.circle(r * 0.38, r * 0.42, r * 0.2, 0x000000, 0.35));
      break;
    default: // glossy
      c.add(scene.add.circle(4, 6, r - 6, 0x000000, 0.15));
      c.add(scene.add.circle(0, 0, r, color));
      c.add(scene.add.circle(-r * 0.3, -r * 0.3, r * 0.3, 0xffffff, 0.35));
  }
  return c;
};

Core.coinLabel = function (scene, x, y, amount, opts) {
  opts = opts || {};
  const fs = opts.fontSize || 22;
  const iconSize = opts.iconSize || Math.round(fs * 1.05);
  const gap = opts.gap || 6;
  const color = opts.color || '#ffd93d';
  const stroke = opts.stroke || '#000000';
  const st = opts.strokeThickness != null ? opts.strokeThickness : 3;
  const anchor = opts.anchor || 'center';
  const fmt = function (v) { return typeof v === 'number' ? v.toLocaleString('ru-RU') : String(v); };

  const txt = scene.add.text(0, 0, fmt(amount), {
    fontFamily: Core.FONT, fontSize: fs + 'px', fontStyle: '900', color: color, stroke: stroke, strokeThickness: st
  }).setOrigin(0, 0.5);
  const layout = function () {
    const totalW = iconSize + gap + txt.width;
    let startX = anchor === 'center' ? -totalW / 2 : (anchor === 'right' ? -totalW : 0);
    icon.x = startX + iconSize / 2;
    txt.x = startX + iconSize + gap;
  };
  const icon = scene.add.image(0, 0, 'coin_icon').setDisplaySize(iconSize, iconSize);
  const c = scene.add.container(x, y);
  c.add([icon, txt]);
  layout();
  c.__setAmount = function (v) { txt.setText(fmt(v)); layout(); };
  c.__tickTo = function (target, dur) {
    const startV = parseFloat(String(txt.text).replace(/[^\d.-]/g, '')) || 0;
    scene.tweens.addCounter({
      from: startV, to: target, duration: dur || 500,
      onUpdate: function (tw) { c.__setAmount(Math.round(tw.getValue())); },
      onComplete: function () { c.__setAmount(target); }
    });
  };
  return c;
};

Core.makeGradients = function (scene) {
  function grad(key, w, h, top, bot, rad) {
    if (scene.textures.exists(key)) return;
    const g = scene.add.graphics();
    g.fillGradientStyle(top, top, bot, bot, 1);
    g.fillRoundedRect(0, 0, w, h, rad);
    g.generateTexture(key, w, h); g.destroy();
  }
  grad('btn_big',   320, 120, 0x66e0bb, 0x2eae86, 22);
  grad('btn_small', 170, 70,  0x4ecca3, 0x2a9070, 16);
  grad('btn_menu',  240, 70,  0x4ecca3, 0x2a9070, 16);
  grad('btn_daily', 340, 100, 0xffd93d, 0xd4a017, 20);
  grad('btn_daily_done', 340, 100, 0x3a3a4a, 0x2a2a3a, 20);
  Core.makeCoinTexture(scene);
};

Core.showAchievement = function (scene, achId) {
  const ach = Core.Achievements.list.find(function (a) { return a.id === achId; });
  if (!ach) return;
  Core.Audio.achievement();
  Core.Juice.vibrate([20, 15, 30]);
  const W = scene.scale.width;
  const c = scene.add.container(W / 2, -100).setDepth(2000);
  c.add(scene.add.rectangle(0, 0, 420, 90, 0x1a1a2e).setStrokeStyle(3, 0xffd93d));
  c.add(scene.add.text(-170, 0, ach.icon, { fontSize: '44px' }).setOrigin(0.5));
  c.add(scene.add.text(-130, -18, 'ДОСТИЖЕНИЕ!', {

class BaseGameScene extends Phaser.Scene {
  init(data) {
    this.mode = (data && data.mode) || 'level';
    this.level = (data && data.level) || Core.SDK.get('level', 1);
    this.seed = (data && data.seed) || null;
    this.isDaily = this.mode === 'daily';
  }
  create() {
    const W = this.scale.width, H = this.scale.height;
    this.cameras.main.setBackgroundColor('#0f3460');
    const bg = this.add.graphics();
    bg.fillGradientStyle(0x1a1a2e, 0x1a1a2e, 0x16213e, 0x0f3460, 1);
    bg.fillRect(0, 0, W, H);
    Core.Juice.ambient(this, 22, -5);

    this.moves = 0; this.score = 0; this.animating = false;
    this.levelJustFinished = false;
    this.hintsLeft = Core.SDK.get('hintsOwned', 3);
    this.undoCount = 0; this.combo = 0; this.maxCombo = 0;
    this.savedHints = this.hintsLeft;
    this.bestScore = this.isDaily ? 0 : (Core.SDK.get('bestScores', {})[this.level] || 0);
    this.bestStars = this.isDaily ? 0 : (Core.SDK.get('bestStars', {})[this.level] || 0);
    this.skin = Core.Skins.tubes[Core.SDK.get('currentSkin', 'classic')] || Core.Skins.tubes.classic;

    this.createTopBar();
    this.buildLevel(this.level);
    this.resetState();
    this.createBottomBar();
    Core.SDK.gameplayStart();
    this.cameras.main.fadeIn(280, 0, 0, 0);
  }
  createTopBar() {
    const W = this.scale.width;
    const bar = this.add.graphics();
    bar.fillStyle(0x000000, 0.3); bar.fillRect(0, 0, W, 90);
    const back = this.add.text(20, 45, '←', {
      fontFamily: Core.FONT, fontSize: '42px', fontStyle: '900', color: '#ffffff'
    }).setOrigin(0, 0.5).setInteractive({ useHandCursor: true });
    back.on('pointerdown', () => { Core.SDK.gameplayStop(); this.scene.start('Menu'); });
    let title = 'Уровень ' + this.level;
    if (this.isDaily) title = '🎁 Ежедневный';
    this.add.text(W / 2, 30, title, Core.TextStyles.heading(26)).setOrigin(0.5);
    const subtitle = this.bestScore > 0 ? 'Рекорд: ★ ' + this.bestScore : (this.isDaily ? 'Только раз в день' : '');
    this.add.text(W / 2, 62, subtitle, Core.TextStyles.soft(13, '#888888')).setOrigin(0.5);
    this.coinLabel = Core.coinLabel(this, 20, 110, Core.SDK.get('coins', 0), { fontSize: 18, iconSize: 20, anchor: 'left' });
    this.scoreText = this.add.text(W - 20, 28, '★ 0', {
      fontFamily: Core.FONT, fontSize: '26px', fontStyle: '900', color: '#ffd93d', stroke: '#000000', strokeThickness: 3
    }).setOrigin(1, 0.5);
    this.movesText = this.add.text(W - 20, 66, 'Ходы: 0', Core.TextStyles.soft(14, '#aaaaaa')).setOrigin(1, 0.5);
    this.comboText = this.add.text(W - 20, 108, '', {
      fontFamily: Core.FONT, fontSize: '22px', fontStyle: '900', color: '#ff9f43', stroke: '#000000', strokeThickness: 3
    }).setOrigin(1, 0.5).setVisible(false);
  }
  updateMoves() { if (this.movesText) this.movesText.setText('Ходы: ' + this.moves); }
  updateScore(smooth) {
    if (!this.scoreText) return;
    const self = this;
    const prev = parseInt(String(this.scoreText.text).replace(/[^\d-]/g, ''), 10) || 0;
    if (smooth === false) { this.scoreText.setText('★ ' + this.score); return; }
    this.tweens.addCounter({
      from: prev, to: this.score, duration: 260,
      onUpdate: function (tw) { self.scoreText.setText('★ ' + Math.round(tw.getValue())); },
      onComplete: function () { self.scoreText.setText('★ ' + self.score); }
    });
  }
  updateCoins() { if (this.coinLabel) this.coinLabel.__setAmount(Core.SDK.get('coins', 0)); }
  updateComboIndicator() {
    if (!this.comboText) return;
    if (this.combo < 2) { this.comboText.setVisible(false); return; }
    this.comboText.setText('x' + this.combo + ' КОМБО');
    this.comboText.setVisible(true);
    this.tweens.add({ targets: this.comboText, scale: 1.35, duration: 140, yoyo: true, ease: 'Quad.Out' });
  }
  addScore(pts, tubeIndex, opts) {
    opts = opts || {};
    if (pts <= 0) return;
    this.score += pts; this.updateScore(true);
    const g = (this.tubeGeom || [])[tubeIndex];
    if (g) {
      const size = opts.size || 26;
      const color = opts.color || '#ffd93d';
      const t = this.add.text(g.x, g.y - g.h / 2 - 16, '+' + pts, {
        fontFamily: Core.FONT, fontSize: size + 'px', fontStyle: '900', color: color,
        stroke: '#000000', strokeThickness: 4
      }).setOrigin(0.5).setDepth(1000).setScale(0);
      this.tweens.add({ targets: t, scale: 1, duration: 180, ease: 'Back.Out' });
      this.tweens.add({ targets: t, y: t.y - 65, alpha: 0, duration: 800, delay: 200, ease: 'Cubic.Out', onComplete: () => t.destroy() });
    }
    this.tweens.add({ targets: this.scoreText, scale: 1.25, duration: 130, yoyo: true, ease: 'Quad.Out' });
    Core.Audio.score();
  }
  createBottomBar() {
    const W = this.scale.width, H = this.scale.height;
    const y = H - 90;
    this.undoBtn = this.makeBtn(W / 2 - 100, y, '↶', 'Отмена', () => this.doUndo());
    this.hintBtn = this.makeBtn(W / 2 + 100, y, '💡', 'Подсказка (' + this.hintsLeft + ')', () => this.doHint());
    this.refreshUndoButton();
  }
  makeBtn(x, y, icon, label, onClick) {
    const c = this.add.container(x, y);
    const img = this.add.image(0, 0, 'btn_small').setOrigin(0.5);
    c.add(img);
    c.add(this.add.text(0, -12, icon, {
      fontFamily: Core.FONT, fontSize: '28px', fontStyle: '900', color: '#ffffff', stroke: '#0f3460', strokeThickness: 2
    }).setOrigin(0.5));
    const labelT = this.add.text(0, 18, label, Core.TextStyles.soft(13, '#0f3460')).setOrigin(0.5);
    c.add(labelT);
    img.setInteractive({ useHandCursor: true });
    img.on('pointerover', () => img.setTint(0xc9ffe8));
    img.on('pointerout',  () => img.clearTint());
    img.on('pointerdown', onClick);
    return { container: c, labelT: labelT, bg: img };
  }
  refreshUndoButton() {
    if (!this.undoBtn) return;
    const disabled = !this.undoStack || this.undoStack.length === 0 || this.animating;
    this.undoBtn.container.setAlpha(disabled ? 0.4 : 1);
  }
  showToast(msg) {
    const W = this.scale.width, H = this.scale.height;
    const t = this.add.text(W / 2, H * 0.85, msg, {
      fontFamily: Core.FONT, fontSize: '18px', fontStyle: '800', color: '#ffffff',
      backgroundColor: '#000000cc', padding: { x: 16, y: 10 }
    }).setOrigin(0.5).setDepth(1000);
    this.tweens.add({ targets: t, alpha: 0, y: H * 0.8, duration: 1400, delay: 900, onComplete: () => t.destroy() });
  }
  async doHint() {
    if (this.animating) return;
    if (this.hintsLeft > 0) {
      this.hintsLeft--;
      Core.SDK.save({ hintsOwned: this.hintsLeft });
      this.updateHintLabel(); this.showHint(); return;
    }
    this.offerHintPurchase();
  }
  offerHintPurchase() {
    const W = this.scale.width, H = this.scale.height;
    const overlay = this.add.rectangle(0, 0, W, H, 0x000000, 0.75).setOrigin(0).setInteractive().setDepth(1001);
    const panel = this.add.container(W / 2, H / 2).setDepth(1002);
    panel.add(this.add.rectangle(0, 0, 440, 340, 0x1a1a2e).setStrokeStyle(4, 0x4ecca3));
    panel.add(this.add.text(0, -130, 'Нет подсказок', Core.TextStyles.title(32)).setOrigin(0.5));
    panel.add(this.add.text(0, -80, 'Как получить ещё?', Core.TextStyles.soft(16, '#cccccc')).setOrigin(0.5));
    const coins = Core.SDK.get('coins', 0), canBuy = coins >= 30;
    const adBtn = this.add.rectangle(0, -25, 380, 60, 0x4ecca3).setOrigin(0.5).setInteractive({ useHandCursor: true });
    panel.add(adBtn);
    panel.add(this.add.text(0, -25, '🎬  +1 за рекламу', {
      fontFamily: Core.FONT, fontSize: '20px', fontStyle: '900', color: '#0f3460'
    }).setOrigin(0.5));
    adBtn.on('pointerover', () => adBtn.setFillStyle(0x5ddcb3));
    adBtn.on('pointerout',  () => adBtn.setFillStyle(0x4ecca3));
    adBtn.on('pointerdown', async () => {
      overlay.destroy(); panel.destroy();
      this.showToast('Смотрим рекламу...');
      const ok = await Core.SDK.rewarded();
      if (ok) { this.hintsLeft++; Core.SDK.save({ hintsOwned: this.hintsLeft }); this.updateHintLabel(); this.showHint(); }
      else this.showToast('Реклама недоступна');
    });
    const buyBtn = this.add.rectangle(0, 50, 380, 60, canBuy ? 0xffd93d : 0x3a3a4a).setOrigin(0.5);
    if (canBuy) buyBtn.setInteractive({ useHandCursor: true });
    panel.add(buyBtn);
    panel.add(this.add.text(0, 50, canBuy ? 'Купить за 30' : 'Не хватает монет', {
      fontFamily: Core.FONT, fontSize: '20px', fontStyle: '900', color: canBuy ? '#0f3460' : '#888888'
    }).setOrigin(0.5));
    if (canBuy) {
      buyBtn.on('pointerover', () => buyBtn.setFillStyle(0xffe566));
      buyBtn.on('pointerout',  () => buyBtn.setFillStyle(0xffd93d));
      buyBtn.on('pointerdown', () => {
        overlay.destroy(); panel.destroy();
        Core.SDK.save({ coins: coins - 30, hintsOwned: this.hintsLeft + 1 });
        this.hintsLeft++; this.updateHintLabel(); this.updateCoins();
        Core.Audio.buy(); this.showToast('Куплено!'); this.showHint();
      });
    }
    const close = this.add.text(0, 130, 'Отмена', Core.TextStyles.soft(16, '#888888')).setOrigin(0.5).setInteractive();
    close.on('pointerdown', () => { overlay.destroy(); panel.destroy(); });
    panel.add(close);
    panel.setScale(0.7); panel.setAlpha(0);
    this.tweens.add({ targets: panel, scale: 1, alpha: 1, duration: 300, ease: 'Back.Out' });
  }
  updateHintLabel() { if (this.hintBtn) this.hintBtn.labelT.setText('Подсказка (' + this.hintsLeft + ')'); }
  showCombo(n) {
    const W = this.scale.width;
    const isBig = n >= 5, isHuge = n >= 10;
    if (isBig) {
      Core.Audio.bigCombo();
      this.cameras.main.shake(220, 0.005);
      Core.Juice.screenFlash(this, 0xffd93d, 0.22, 240);
      this.tweens.add({ targets: this.cameras.main, zoom: 1.03, duration: 150, yoyo: true, ease: 'Sine.InOut' });
      Core.Juice.vibrate([30, 20, 40]);
    } else { Core.Audio.combo(n); Core.Juice.vibrate(15); }
    const fontSize = isHuge ? 56 : (isBig ? 46 : 38);
    const t = this.add.text(W / 2, 190, 'x' + n + ' КОМБО!', Core.TextStyles.title(fontSize)).setOrigin(0.5).setDepth(1500);
    t.setScale(0.2);
    this.tweens.add({ targets: t, scale: 1, duration: 300, ease: 'Back.Out' });
    this.tweens.add({ targets: t, alpha: 0, y: 140, duration: 800, delay: 600, onComplete: function () { t.destroy(); } });
    if (isBig) Core.Juice.burst(this, W / 2, 190, 0xffd93d, 24, 160);
  }
  getStars() {
    const usedHints = (this.savedHints - this.hintsLeft);
    const used = usedHints + this.undoCount;
    if (used === 0) return 3;
    if (used <= 2) return 2;
    return 1;
  }
  checkAchievementsAfterWin(stars, totalLevelsAfter) {
    const unlocked = [];
    const totalLevels = totalLevelsAfter || Core.SDK.get('totalLevelsCompleted', 0);
    const coins = Core.SDK.get('coins', 0);
    const ownedSkins = Core.SDK.get('ownedSkins', []);
    if (totalLevels >= 1 && Core.Achievements.unlock('first_win')) unlocked.push('first_win');
    if (stars === 3 && totalLevels >= 2 && Core.Achievements.unlock('three_stars')) unlocked.push('three_stars');
    if (this.maxCombo >= 10 && this.colors >= 5 && Core.Achievements.unlock('combo_10')) unlocked.push('combo_10');
    if (totalLevels >= 10 && Core.Achievements.unlock('ten_levels')) unlocked.push('ten_levels');
    if (totalLevels >= 50 && Core.Achievements.unlock('fifty_levels')) unlocked.push('fifty_levels');
    if (this.isDaily && Core.Achievements.unlock('daily_done')) unlocked.push('daily_done');
    if (coins >= 1000 && Core.Achievements.unlock('rich')) unlocked.push('rich');
    if (ownedSkins.length >= 4 && Core.Achievements.unlock('all_skins')) unlocked.push('all_skins');
    unlocked.forEach((id, i) => {
      this.time.delayedCall(1400 + i * 900, () => Core.showAchievement(this, id));
    });
  }
  onLevelComplete() {
    if (this.levelJustFinished) return;
    this.levelJustFinished = true;
    const stars = this.getStars();
    const starBonus = stars * 100;
    this.starBonus = starBonus;
    this.score += starBonus; this.updateScore(true);
    const baseCoins = 20 + stars * 10;
    const isNewRecord = this.isDaily ? false : (this.score > this.bestScore);
    const recordBonus = isNewRecord ? 20 : 0;
    let coinsEarned = baseCoins + recordBonus;
    if (this.isDaily) coinsEarned += 100;
    this.coinsEarned = coinsEarned;
    const patch = {};
    if (this.isDaily) {
      patch.dailyDate = todayStr();
      patch.dailyStars = Math.max(Core.SDK.get('dailyStars', 0), stars);
    } else {
      const bestScores = Core.SDK.get('bestScores', {});
      if (isNewRecord) bestScores[this.level] = this.score;
      patch.bestScores = bestScores;
      const bestStars = Core.SDK.get('bestStars', {});
      if (stars > (bestStars[this.level] || 0)) bestStars[this.level] = stars;
      patch.bestStars = bestStars;
      this.level++;
      patch.level = this.level;
    }
    patch.totalScore = Core.SDK.get('totalScore', 0) + this.score;
    patch.coins = Core.SDK.get('coins', 0) + coinsEarned;
    patch.totalLevelsCompleted = Core.SDK.get('totalLevelsCompleted', 0) + 1;
    patch.hintsOwned = this.hintsLeft;
    Core.SDK.save(patch);
    this.levelScore = this.score;
    this.totalScore = patch.totalScore;
    this.totalCoins = patch.coins;
    this.isNewRecord = isNewRecord;
    this.starsGot = stars;
    Core.Audio.win();
    if (isNewRecord) this.time.delayedCall(500, () => Core.Audio.record());
    Core.Juice.vibrate([40, 40, 40, 40, 80]);
    this.cameras.main.shake(280, 0.004);
    Core.Juice.screenFlash(this, 0xffffff, 0.35, 400);
    this.spawnConfetti();
    this.checkAchievementsAfterWin(stars, patch.totalLevelsCompleted);
    this.time.delayedCall(1100, () => this.showWinPanel());
  }
  spawnConfetti() {
    const W = this.scale.width, H = this.scale.height;
    for (let i = 0; i < 110; i++) {
      const c = Core.PALETTE[i % Core.PALETTE.length];
      const rect = this.add.rectangle(Math.random() * W, -20, 6 + Math.random() * 10, 6 + Math.random() * 10, c).setDepth(900);
      this.tweens.add({
        targets: rect, y: H + 40, x: rect.x + (Math.random() - 0.5) * 400,
        angle: Math.random() * 720 - 360, duration: 1800 + Math.random() * 1400, ease: 'Cubic.In',
        onComplete: () => rect.destroy()
      });
    }
  }
  showWinPanel() {
    const W = this.scale.width, H = this.scale.height;
    const stars = this.starsGot;
    const overlay = this.add.rectangle(0, 0, W, H, 0x000000, 0.7).setOrigin(0).setInteractive().setDepth(1001);
    const panel = this.add.container(W / 2, H / 2).setDepth(1002);
    panel.add(this.add.rectangle(0, 0, 460, 580, 0x1a1a2e).setStrokeStyle(4, this.isDaily ? 0xffd93d : 0x4ecca3));
    const title = this.isDaily ? '🎁 ЕЖЕДНЕВНЫЙ!' : 'ПОБЕДА!';
    panel.add(this.add.text(0, -240, title, Core.TextStyles.title(44)).setOrigin(0.5));
    for (let i = 0; i < 3; i++) {
      const on = i < stars;
      const star = this.add.text(-80 + i * 80, -160, '★', {
        fontFamily: Core.FONT, fontSize: '64px', fontStyle: '900',
        color: on ? '#ffd93d' : '#333a4a', stroke: on ? '#b8860b' : '#1a1a2e', strokeThickness: on ? 4 : 2
      }).setOrigin(0.5).setAlpha(0).setScale(0.3);
      panel.add(star);
      this.tweens.add({ targets: star, alpha: 1, scale: on ? 1 : 0.85, duration: 380, delay: 200 + i * 140, ease: 'Back.Out' });
    }
    if (this.isNewRecord) {
      const rec = this.add.text(0, -100, '🏆 НОВЫЙ РЕКОРД!', {
        fontFamily: Core.FONT, fontSize: '24px', fontStyle: '900', color: '#ffd93d',
        stroke: '#000000', strokeThickness: 4
      }).setOrigin(0.5).setAlpha(0).setScale(0.3);
      panel.add(rec);
      this.tweens.add({ targets: rec, alpha: 1, scale: 1, duration: 500, delay: 900, ease: 'Back.Out' });
      this.tweens.add({ targets: rec, scale: 1.06, duration: 500, delay: 1500, yoyo: true, repeat: -1, ease: 'Sine.InOut' });
    }
    panel.add(this.add.text(0, -60, '★ ' + this.levelScore, Core.TextStyles.gold(38)).setOrigin(0.5));
    panel.add(this.add.text(0, -20,
      '+' + this.starBonus + ' за звёзды' + (this.isDaily ? ' · +100 за дейлик' : (this.isNewRecord ? ' · +20 за рекорд' : '')),
      Core.TextStyles.soft(14, '#4ecca3')).setOrigin(0.5));
    const coinsLabel = Core.coinLabel(this, 0, 25, 0, { fontSize: 24, iconSize: 26, anchor: 'center' });
    panel.add(coinsLabel);
    this.time.delayedCall(500, () => { coinsLabel.__tickTo(this.coinsEarned, 900); });
    panel.add(this.add.text(0, 70, 'Ходов: ' + this.moves, Core.TextStyles.soft(14, '#888888')).setOrigin(0.5));
    panel.add(this.add.text(0, 97, 'Всего очков: ' + this.totalScore, Core.TextStyles.soft(14, '#7fd4c1')).setOrigin(0.5));
    panel.add(this.add.text(0, 120, 'Монет всего: ' + this.totalCoins, {
      fontFamily: Core.FONT, fontSize: '14px', fontStyle: '800', color: '#ffd93d'
    }).setOrigin(0.5));
    if (this.isDaily) {
      const menuBtn = this.add.image(0, 190, 'btn_menu').setOrigin(0.5).setInteractive({ useHandCursor: true });
      panel.add(menuBtn);
      panel.add(this.add.text(0, 190, 'В меню', Core.TextStyles.heading(24)).setOrigin(0.5));
      menuBtn.on('pointerover', () => menuBtn.setTint(0xc9ffe8));
      menuBtn.on('pointerout',  () => menuBtn.clearTint());
      menuBtn.on('pointerdown', () => { overlay.destroy(); panel.destroy(); Core.SDK.gameplayStop(); this.scene.start('Menu'); });
    } else {
      const nextBtn = this.add.image(0, 190, 'btn_menu').setOrigin(0.5).setInteractive({ useHandCursor: true });
      panel.add(nextBtn);
      panel.add(this.add.text(0, 190, 'Далее →', Core.TextStyles.heading(24)).setOrigin(0.5));
      nextBtn.on('pointerover', () => nextBtn.setTint(0xc9ffe8));
      nextBtn.on('pointerout',  () => nextBtn.clearTint());
      nextBtn.on('pointerdown', () => {
        overlay.destroy(); panel.destroy();
        const nextLevel = this.level;
        const needAd = ((nextLevel - 1) % 3 === 0) && nextLevel > 1;
        if (needAd) { Core.SDK.interstitial(); this.time.delayedCall(500, () => this.scene.restart({ level: nextLevel, mode: 'level' })); }
        else this.scene.restart({ level: nextLevel, mode: 'level' });
      });
      const menuT = this.add.text(0, 245, 'В меню', Core.TextStyles.soft(16, '#888888')).setOrigin(0.5).setInteractive();
      menuT.on('pointerdown', () => { Core.SDK.gameplayStop(); this.scene.start('Menu'); });
      panel.add(menuT);
    }
    panel.setScale(0.6); panel.setAlpha(0);
    this.tweens.add({ targets: panel, scale: 1, alpha: 1, duration: 500, ease: 'Back.Out' });
  }
  buildLevel(level) { throw new Error('not implemented'); }
  resetState() { throw new Error('not implemented'); }
  doUndo() {}
  showHint() {}
}

class BootScene extends Phaser.Scene {

class MenuScene extends Phaser.Scene {
  constructor() { super('Menu'); }
  create() {
    const W = this.scale.width, H = this.scale.height;
    const bg = this.add.graphics();
    bg.fillGradientStyle(0x1a1a2e, 0x1a1a2e, 0x16213e, 0x0f3460, 1);
    bg.fillRect(0, 0, W, H);
    Core.Juice.ambient(this, 18, -1);
    for (let i = 0; i < 30; i++) {
      const x = Math.random() * W, y = Math.random() * H;
      const size = 1 + Math.random() * 2.5;
      const star = this.add.circle(x, y, size, 0xffffff, 0.4 + Math.random() * 0.4).setDepth(-1);

class AchievementsScene extends Phaser.Scene {
  constructor() { super('Achievements'); }
  create() {
    const W = this.scale.width, H = this.scale.height;
    const bg = this.add.graphics();
    bg.fillGradientStyle(0x1a1a2e, 0x1a1a2e, 0x16213e, 0x0f3460, 1);
    bg.fillRect(0, 0, W, H);
    Core.Juice.ambient(this, 14, -1);

    const back = this.add.text(20, 45, '←', {
      fontFamily: Core.FONT, fontSize: '42px', fontStyle: '900', color: '#ffffff'
    }).setOrigin(0, 0.5).setInteractive({ useHandCursor: true });
    back.on('pointerdown', () => this.scene.start('Menu'));

    this.add.text(W / 2, 45, 'ДОСТИЖЕНИЯ', Core.TextStyles.heading(30)).setOrigin(0.5);

    const count = Core.Achievements.count();
    const total = Core.Achievements.list.length;
    this.add.text(W / 2, 92, count + ' / ' + total, Core.TextStyles.gold(22)).setOrigin(0.5);

    const barW = W - 120, barH = 12, barY = 118;
    this.add.rectangle(W / 2, barY, barW, barH, 0x1a1a2e).setOrigin(0.5).setStrokeStyle(2, 0x444455);
    if (count > 0) {
      const fillW = (barW - 4) * (count / total);
      const fill = this.add.rectangle(W / 2 - barW / 2 + 2, barY, fillW, barH - 4, 0xffd93d).setOrigin(0, 0.5);
      this.tweens.add({ targets: fill, scaleX: 1.02, duration: 800, yoyo: true, repeat: -1, ease: 'Sine.InOut' });
    }

    const listY = 160;
    const rowH = 95;
    const rowGap = 12;
    const rowW = W - 60;
    const container = this.add.container(0, listY);

    const list = Core.Achievements.list;
    const saved = Core.SDK.get('achievements', {});

    list.forEach((ach, i) => {
      const unlocked = !!saved[ach.id];
      const y = i * (rowH + rowGap);
      const c = this.add.container(W / 2, y);

      const bgColor = unlocked ? 0x2e2a1a : 0x1f1f30;
      const strokeColor = unlocked ? 0xffd93d : 0x333344;
      const rowBg = this.add.rectangle(0, 0, rowW, rowH, bgColor).setOrigin(0.5).setStrokeStyle(2, strokeColor, unlocked ? 1 : 0.5);
      c.add(rowBg);

      const iconBg = this.add.circle(-rowW / 2 + 60, 0, 36, unlocked ? 0x3a2e10 : 0x252535)
        .setStrokeStyle(2, strokeColor, unlocked ? 0.9 : 0.4);
      c.add(iconBg);
      const icon = this.add.text(-rowW / 2 + 60, 0, unlocked ? ach.icon : '🔒', {
        fontSize: unlocked ? '40px' : '28px'
      }).setOrigin(0.5);
      if (!unlocked) icon.setAlpha(0.4);
      c.add(icon);

      c.add(this.add.text(-rowW / 2 + 120, -18, ach.name, {
        fontFamily: Core.FONT, fontSize: '20px', fontStyle: '900',
        color: unlocked ? '#ffd93d' : '#666677'
      }).setOrigin(0, 0.5));

      c.add(this.add.text(-rowW / 2 + 120, 12, ach.desc, {
        fontFamily: Core.FONT, fontSize: '14px', fontStyle: '700',
        color: unlocked ? '#cccccc' : '#555566',
        wordWrap: { width: rowW - 200 }
      }).setOrigin(0, 0.5));

      if (unlocked) {
        c.add(this.add.text(rowW / 2 - 30, 0, '✓', {
          fontFamily: Core.FONT, fontSize: '32px', fontStyle: '900', color: '#4ecca3'
        }).setOrigin(0.5));
      } else {
        c.add(this.add.text(rowW / 2 - 30, 0, '—', {
          fontFamily: Core.FONT, fontSize: '24px', fontStyle: '900', color: '#444455'
        }).setOrigin(0.5));
      }

      if (unlocked) {
        this.tweens.add({
          targets: icon, scale: 1.1, duration: 1400 + i * 100, yoyo: true, repeat: -1, ease: 'Sine.InOut'
        });
      }

      container.add(c);
    });

    const totalH = list.length * (rowH + rowGap);
    const viewH = H - listY - 60;
    if (totalH > viewH) {
      const maskShape = this.make.graphics({ x: 0, y: listY });
      maskShape.fillRect(0, 0, W, viewH);
      container.setMask(maskShape.createGeometryMask());

      let dragging = false, startY = 0, startScrollY = 0;
      const minY = listY - (totalH - viewH);
      const maxY = listY;
      container.y = listY;

      this.input.on('pointerdown', (p) => {
        if (p.y > listY - 20) { dragging = true; startY = p.y; startScrollY = container.y; }
      });
      this.input.on('pointerup', () => { dragging = false; });
      this.input.on('pointermove', (p) => {
        if (!dragging) return;
        let ny = startScrollY + (p.y - startY);
        ny = Math.max(minY, Math.min(maxY, ny));
        container.y = ny;
      });

      this.input.on('wheel', (p, objs, dx, dy) => {
        let ny = container.y - dy * 0.5;
        ny = Math.max(minY, Math.min(maxY, ny));
        container.y = ny;
      });

      const hint = this.add.text(W / 2, H - 30, '↑ листай ↓', Core.TextStyles.soft(12, '#555555')).setOrigin(0.5);
      this.tweens.add({ targets: hint, alpha: 0.3, duration: 1200, yoyo: true, repeat: -1 });
    }

    this.cameras.main.fadeIn(250, 0, 0, 0);
  }
}

class LevelMapScene extends Phaser.Scene {
  constructor() { super('LevelMap'); }
  create() {
    const W = this.scale.width, H = this.scale.height;
    this.currentPage = Math.floor((Core.SDK.get('level', 1) - 1) / 20);
    const bg = this.add.graphics();
    bg.fillGradientStyle(0x1a1a2e, 0x1a1a2e, 0x16213e, 0x0f3460, 1);
    bg.fillRect(0, 0, W, H);
    Core.Juice.ambient(this, 14, -1);
    const back = this.add.text(20, 45, '←', {
      fontFamily: Core.FONT, fontSize: '42px', fontStyle: '900', color: '#ffffff'
    }).setOrigin(0, 0.5).setInteractive({ useHandCursor: true });
    back.on('pointerdown', () => this.scene.start('Menu'));
    this.add.text(W / 2, 45, 'УРОВНИ', Core.TextStyles.heading(30)).setOrigin(0.5);
    this.coinLabel = Core.coinLabel(this, W - 20, 45, Core.SDK.get('coins', 0), { fontSize: 20, iconSize: 22, anchor: 'right' });
    this.gridContainer = this.add.container(0, 0);
    this.pageText = this.add.text(W / 2, H - 60, '', Core.TextStyles.soft(16, '#cccccc')).setOrigin(0.5);
    this.prevBtn = this.add.rectangle(60, H - 60, 60, 50, 0x2a2a4a).setOrigin(0.5).setStrokeStyle(2, 0x4ecca3, 0.6);
    this.add.text(60, H - 60, '‹', { fontFamily: Core.FONT, fontSize: '32px', fontStyle: '900', color: '#ffffff' }).setOrigin(0.5);
    this.prevBtn.setInteractive({ useHandCursor: true });
    this.prevBtn.on('pointerdown', () => { if (this.currentPage > 0) { this.currentPage--; this.renderPage(); } });
    this.nextBtn = this.add.rectangle(W - 60, H - 60, 60, 50, 0x2a2a4a).setOrigin(0.5).setStrokeStyle(2, 0x4ecca3, 0.6);
    this.add.text(W - 60, H - 60, '›', { fontFamily: Core.FONT, fontSize: '32px', fontStyle: '900', color: '#ffffff' }).setOrigin(0.5);
    this.nextBtn.setInteractive({ useHandCursor: true });
    this.nextBtn.on('pointerdown', () => { this.currentPage++; this.renderPage(); });
    this.renderPage();
    this.cameras.main.fadeIn(250, 0, 0, 0);
  }
  renderPage() {
    this.gridContainer.removeAll(true);
    const W = this.scale.width;
    const currentLevel = Core.SDK.get('level', 1);
    const bestStars = Core.SDK.get('bestStars', {});
    const perPage = 20;
    const cols = 4, rows = 5;
    const startLevel = this.currentPage * perPage + 1;
    const cellW = 150, cellH = 130, gapX = 15, gapY = 15;
    const totalW = cols * cellW + (cols - 1) * gapX;
    const startX = (W - totalW) / 2 + cellW / 2;
    const startY = 160;
    for (let i = 0; i < perPage; i++) {
      const lvl = startLevel + i;
      const col = i % cols, row = Math.floor(i / cols);
      const x = startX + col * (cellW + gapX);
      const y = startY + row * (cellH + gapY);
      const locked = lvl > currentLevel;
      const done = lvl < currentLevel;
      const isCurrent = lvl === currentLevel;
      const stars = bestStars[lvl] || 0;
      const cell = this.add.container(x, y);
      let bgColor = 0x2a2a4a, strokeColor = 0x444455, strokeAlpha = 0.5;
      if (isCurrent) { strokeColor = 0x4ecca3; strokeAlpha = 1; }
      else if (done) { strokeColor = 0xffd93d; strokeAlpha = 0.7; }
      const bg = this.add.rectangle(0, 0, cellW, cellH, bgColor).setOrigin(0.5).setStrokeStyle(isCurrent ? 3 : 2, strokeColor, strokeAlpha);
      cell.add(bg);
      if (isCurrent) this.tweens.add({ targets: bg, alpha: 0.7, duration: 700, yoyo: true, repeat: -1, ease: 'Sine.InOut' });
      if (locked) {
        cell.add(this.add.text(0, -8, '🔒', { fontSize: '32px' }).setOrigin(0.5).setAlpha(0.4));
      } else {
        cell.add(this.add.text(0, -18, String(lvl), {
          fontFamily: Core.FONT, fontSize: '36px', fontStyle: '900',
          color: isCurrent ? '#4ecca3' : (done ? '#ffd93d' : '#ffffff'),
          stroke: '#000000', strokeThickness: 2
        }).setOrigin(0.5));
        if (done || isCurrent) {
          for (let s = 0; s < 3; s++) {
            const on = s < stars;
            cell.add(this.add.text(-30 + s * 30, 30, '★', {
              fontFamily: Core.FONT, fontSize: '20px', fontStyle: '900',
              color: on ? '#ffd93d' : '#444455'
            }).setOrigin(0.5));
          }
        }
        bg.setInteractive({ useHandCursor: true });
        bg.on('pointerover', () => bg.setFillStyle(0x3a3a5a));
        bg.on('pointerout',  () => bg.setFillStyle(bgColor));
        bg.on('pointerdown', () => { Core.Audio.select(); this.scene.start('BallSort', { level: lvl, mode: 'level' }); });
      }
      this.gridContainer.add(cell);
    }
    const totalPages = Math.max(1, Math.ceil(currentLevel / perPage));
    this.pageText.setText('Страница ' + (this.currentPage + 1) + ' / ' + totalPages);
    this.prevBtn.setAlpha(this.currentPage === 0 ? 0.3 : 1);
    this.nextBtn.setAlpha(this.currentPage >= totalPages - 1 ? 0.3 : 1);
  }
}

const GameRegistry = { title: 'Ball Sort', sceneKey: 'BallSort' };

const MAX_TUBE = 4;

const Logic = {
  clone: function (t) { return t.map(function (x) { return x.slice(); }); },
  isUniform: function (t) { return t.length === MAX_TUBE && t.every(function (c) { return c === t[0]; }); },
  isSolved: function (tubes) { return tubes.every(function (t) { return t.length === 0 || Logic.isUniform(t); }); },
  canPour: function (tubes, from, to) {
    if (from === to) return false;
    const f = tubes[from], t = tubes[to];
    if (f.length === 0) return false;
    if (t.length >= MAX_TUBE) return false;
    if (t.length === 0) return true;
    return t[t.length - 1] === f[f.length - 1];
  },
  pourCount: function (tubes, from, to) {
    if (!Logic.canPour(tubes, from, to)) return 0;
    const f = tubes[from], t = tubes[to], c = f[f.length - 1];
    let count = 0;
    for (let i = f.length - 1; i >= 0 && f[i] === c; i--) count++;
    return Math.min(count, MAX_TUBE - t.length);
  },
  applyPour: function (tubes, from, to) {
    const n = Logic.pourCount(tubes, from, to);
    for (let k = 0; k < n; k++) tubes[to].push(tubes[from].pop());
    return n;
  }
};

function isSolvable(tubes, maxDepth) {
  const start = Date.now(), memo = new Map();
  function keyOf(t) { return t.map(function (x) { return x.join(','); }).join('|'); }
  function dfs(t, depth) {
    if (Date.now() - start > 350) return -1;
    if (depth < 0) return -1;
    const k = keyOf(t);
    if (memo.has(k)) return memo.get(k);
    if (Logic.isSolved(t)) { memo.set(k, 0); return 0; }
    let best = -1;
    for (let a = 0; a < t.length; a++) {
      for (let b = 0; b < t.length; b++) {
        if (!Logic.canPour(t, a, b)) continue;
        if (t[b].length === 0 && Logic.isUniform(t[a])) continue;
        const n = Logic.clone(t);
        Logic.applyPour(n, a, b);
        const r = dfs(n, depth - 1);
        if (r >= 0 && (best === -1 || r + 1 < best)) best = r + 1;
        if (best === 1) break;
      }
      if (best === 1) break;
    }
    memo.set(k, best);
    return best;
  }
  return dfs(tubes, maxDepth) >= 0;
}

function generateLevel(level, seed) {
  const rng = (seed !== undefined && seed !== null) ? mulberry32(seed) : Math.random;
  let colors;
  if (seed !== undefined && seed !== null) {
    colors = 5 + Math.floor(rng() * 3);
  } else {
    if (level <= 1) colors = 3;
    else if (level <= 3) colors = 4;
    else if (level <= 7) colors = 5;
    else if (level <= 15) colors = 6;
    else if (level <= 30) colors = 7;
    else colors = Math.min(9, 7 + Math.floor((level - 30) / 15));
  }
  for (let attempt = 0; attempt < 8; attempt++) {
    const balls = [];
    for (let c = 0; c < colors; c++) for (let i = 0; i < MAX_TUBE; i++) balls.push(c);
    Core.Utils.shuffleWith(balls, rng);
    const tubes = [];
    for (let i = 0; i < colors; i++) tubes.push(balls.slice(i * MAX_TUBE, (i + 1) * MAX_TUBE));
    tubes.push([]); tubes.push([]);
    if (Logic.isSolved(tubes)) continue;
    if (isSolvable(tubes, 50 + colors * 8)) return { tubes: tubes, colors: colors };
  }
  const balls = [];
  for (let c = 0; c < colors; c++) for (let i = 0; i < MAX_TUBE; i++) balls.push(c);
  Core.Utils.shuffleWith(balls, rng);
  const tubes = [];
  for (let i = 0; i < colors; i++) tubes.push(balls.slice(i * MAX_TUBE, (i + 1) * MAX_TUBE));
  tubes.push([]); tubes.push([]);
  return { tubes: tubes, colors: colors };
}

class BallSortScene extends BaseGameScene {
  constructor() { super('BallSort'); }
  buildLevel(level) {
    this.ballSkin = Core.SDK.get('currentBallSkin', 'classic');
    const data = this.isDaily ? generateLevel(0, this.seed) : generateLevel(level);
    this.tubes = data.tubes;
    this.colors = data.colors;
    this.layoutTubes();
    this.renderTubes();
  }
  resetState() {
    this.selected = -1;
    this.undoStack = [];
    this.animating = false;
    this.doneTubes = new Set();
    this.bonusAwarded = new Set();
    this.doneGlows = {};
    this.selectedGlow = null;
  }
  layoutTubes() {
    const W = this.scale.width;
    const n = this.tubes.length;
    let cols, rows;
    if (n <= 5) { cols = n; rows = 1; }
    else { cols = Math.ceil(n / 2); rows = 2; }
    const tubeW = 64, tubeH = 240, hGap = 20, vGap = 50;
    const totalW = cols * tubeW + (cols - 1) * hGap;
    const startX = (W - totalW) / 2 + tubeW / 2;
    const startY = 185 + tubeH / 2;
    this.tubeGeom = [];
    for (let i = 0; i < n; i++) {
      const col = i % cols, row = Math.floor(i / cols);
      this.tubeGeom.push({ x: startX + col * (tubeW + hGap), y: startY + row * (tubeH + vGap), w: tubeW, h: tubeH });
    }
  }
  renderTubes() {
    this.tubeGfx = []; this.ballGfx = []; this.zones = [];
    for (let i = 0; i < this.tubes.length; i++) {
      this.drawTube(i, false);
      this.ballGfx[i] = [];
      for (let j = 0; j < this.tubes[i].length; j++) this.ballGfx[i].push(this.makeBall(i, j));
    }
    for (let i = 0; i < this.tubes.length; i++) {
      const g = this.tubeGeom[i];
      const objs = [this.tubeGfx[i]].concat(this.ballGfx[i]);
      objs.forEach(function (o) { o.setAlpha(0); o.y = o.y + 60; });
      this.tweens.add({ targets: objs, alpha: 1, y: '-=60', duration: 420, delay: i * 55, ease: 'Back.Out' });
      const zone = this.add.zone(g.x, g.y, g.w + 20, g.h + 20).setInteractive({ useHandCursor: true });
      zone.on('pointerdown', () => this.onTubeClick(i));
      this.zones.push(zone);
    }
  }
  drawTube(i, selected) {
    if (this.tubeGfx[i]) this.tubeGfx[i].destroy();
    const g = this.tubeGeom[i];
    const x0 = g.x - g.w / 2, y0 = g.y - g.h / 2, r = 14;
    const s = this.skin;
    const gfx = this.add.graphics();
    if (selected) {
      gfx.fillStyle(s.activeFill, s.activeFillAlpha);
      gfx.lineStyle(s.lineWidth + 1, s.activeStroke, 0.95);
    } else {
      gfx.fillStyle(s.fill, s.fillAlpha);
      gfx.lineStyle(s.lineWidth, s.stroke, s.strokeAlpha);
    }
    gfx.beginPath();
    gfx.moveTo(x0, y0);
    gfx.lineTo(x0, y0 + g.h - r);
    gfx.arc(x0 + r, y0 + g.h - r, r, Math.PI, Math.PI / 2, true);
    gfx.lineTo(x0 + g.w - r, y0 + g.h);
    gfx.arc(x0 + g.w - r, y0 + g.h - r, r, Math.PI / 2, 0, true);
    gfx.lineTo(x0 + g.w, y0);
    gfx.closePath();
    gfx.strokePath(); gfx.fillPath();
    this.tubeGfx[i] = gfx;
  }
  createSelectionGlow(i) {
    if (this.selectedGlow) this.selectedGlow.destroy();
    const g = this.tubeGeom[i];
    const glow = this.add.rectangle(g.x, g.y, g.w + 24, g.h + 24, 0x4ecca3, 0.12).setStrokeStyle(3, 0x4ecca3, 0.9).setDepth(-2);
    this.tweens.add({ targets: glow, alpha: 0.03, duration: 700, yoyo: true, repeat: -1, ease: 'Sine.InOut' });
    this.selectedGlow = glow;
  }
  clearSelectionGlow() {
    if (this.selectedGlow) { this.selectedGlow.destroy(); this.selectedGlow = null; }
  }
  ballPos(tubeIdx, idxFromBottom) {
    const g = this.tubeGeom[tubeIdx];
    const ballR = 26, step = ballR * 2 + 2, bottomPad = 12;
    return { x: g.x, y: g.y + g.h / 2 - bottomPad - ballR - idxFromBottom * step };
  }
  makeBall(tubeIdx, idx) {
    const pos = this.ballPos(tubeIdx, idx);
    const color = Core.PALETTE[this.tubes[tubeIdx][idx] % Core.PALETTE.length];
    const c = Core.renderBall(this, 26, color, this.ballSkin || 'classic');
    c.setPosition(pos.x, pos.y);
    return c;
  }
  onTubeClick(i) {
    if (this.animating || this.levelJustFinished) return;
    if (this.selected === -1) {
      if (this.tubes[i].length === 0) return;
      if (Logic.isUniform(this.tubes[i])) return;
      this.selected = i;
      this.drawTube(i, true); this.liftTop(i, true);
      this.createSelectionGlow(i);
      const g = this.tubeGeom[i];
      Core.Juice.ring(this, g.x, g.y, 0x4ecca3, 20, g.w * 0.9, 400);
      Core.Audio.select();
    } else if (this.selected === i) {
      this.drawTube(i, false); this.liftTop(i, false); this.selected = -1;
      this.clearSelectionGlow();
    } else {
      const from = this.selected, to = i;
      if (Logic.canPour(this.tubes, from, to)) {
        this.drawTube(from, false); this.liftTop(from, false); this.selected = -1;
        this.clearSelectionGlow();
        this.pour(from, to, true, true);
      } else {
        Core.Audio.error(); Core.Juice.vibrate(30);
        this.cameras.main.shake(180, 0.006);
        this.shake(to);
        this.combo = 0; this.updateComboIndicator();
        this.drawTube(from, false); this.liftTop(from, false);
        this.clearSelectionGlow();
        if (this.tubes[i].length > 0 && !Logic.isUniform(this.tubes[i])) {
          this.selected = i; this.drawTube(i, true); this.liftTop(i, true);
          this.createSelectionGlow(i);
        } else this.selected = -1;
      }
    }
  }
  liftTop(i, on) {
    const top = this.ballGfx[i][this.ballGfx[i].length - 1];
    if (!top) return;
    const base = this.ballPos(i, this.tubes[i].length - 1);
    this.tweens.add({ targets: top, y: on ? base.y - 12 : base.y, duration: 140, ease: 'Cubic.Out' });
  }
  shake(i) {
    const self = this;
    [this.tubeGfx[i]].concat(this.ballGfx[i]).forEach(function (t) {
      const bx = t.x;
      self.tweens.add({ targets: t, x: bx + 8, duration: 45, yoyo: true, repeat: 2, ease: 'Sine.InOut', onComplete: function () { t.x = bx; } });
    });
  }
  checkDoneTubes() {
    for (let i = 0; i < this.tubes.length; i++) {
      const isDone = Logic.isUniform(this.tubes[i]);
      const wasDone = this.doneTubes.has(i);
      if (isDone && !wasDone) this.onTubeCompleted(i);
      else if (!isDone && wasDone) {
        this.doneTubes.delete(i);
        if (this.doneGlows[i]) { this.doneGlows[i].destroy(); delete this.doneGlows[i]; }
      }
    }
  }
  onTubeCompleted(i) {
    this.doneTubes.add(i);
    const g = this.tubeGeom[i];
    const color = Core.PALETTE[this.tubes[i][0] % Core.PALETTE.length];
    const glow = this.add.graphics().setDepth(-1);
    const x0 = g.x - g.w / 2 - 6, y0 = g.y - g.h / 2 - 6, r = 16;
    glow.fillStyle(0xffd93d, 0.10);
    glow.lineStyle(4, 0xffd93d, 1);
    glow.beginPath();
    glow.moveTo(x0, y0);
    glow.lineTo(x0, y0 + g.h + 12 - r);
    glow.arc(x0 + r, y0 + g.h + 12 - r, r, Math.PI, Math.PI / 2, true);
    glow.lineTo(x0 + g.w + 12 - r, y0 + g.h + 12);
    glow.arc(x0 + g.w + 12 - r, y0 + g.h + 12 - r, r, Math.PI / 2, 0, true);
    glow.lineTo(x0 + g.w + 12, y0);
    glow.closePath(); glow.strokePath(); glow.fillPath();
    this.doneGlows[i] = glow;
    this.tweens.add({ targets: glow, alpha: 0.4, duration: 700, yoyo: true, repeat: -1, ease: 'Sine.InOut' });
    Core.Juice.burst(this, g.x, g.y - g.h * 0.15, 0xffd93d, 32, 200);
    Core.Juice.burst(this, g.x, g.y - g.h * 0.15, color, 24, 180);
    const ring = this.add.circle(g.x, g.y, 20, 0xffffff, 0.85).setDepth(940);
    this.tweens.add({ targets: ring, scale: 7, alpha: 0, duration: 550, ease: 'Cubic.Out', onComplete: () => ring.destroy() });
    Core.Juice.ring(this, g.x, g.y, 0xffd93d, 40, 140, 500);
    Core.Juice.screenFlash(this, 0xffd93d, 0.22, 280);
    this.tweens.add({ targets: this.cameras.main, zoom: 1.02, duration: 130, yoyo: true, ease: 'Sine.InOut' });
    Core.Juice.vibrate([30, 30, 30]);
    Core.Audio.tubeComplete();
    if (!this.bonusAwarded.has(i)) {
      this.bonusAwarded.add(i);
      this.addScore(50, i, { color: '#ffd93d', size: 34 });
      const label = this.add.text(g.x, g.y - g.h / 2 - 32, '★ +50', {
        fontFamily: Core.FONT, fontSize: '36px', fontStyle: '900', color: '#ffd93d',
        stroke: '#000000', strokeThickness: 5
      }).setOrigin(0.5).setDepth(1500).setScale(0);
      this.tweens.add({ targets: label, scale: 1, duration: 350, ease: 'Back.Out' });
      this.tweens.add({ targets: label, alpha: 0, y: label.y - 90, duration: 900, delay: 500, onComplete: () => label.destroy() });
    }
  }
  animateMove(src, dst, cnt) {
    if (cnt <= 0) return;
    this.animating = true; this.refreshUndoButton();
    const moved = this.ballGfx[src].splice(-cnt).reverse();
    const destLen = this.ballGfx[dst].length;
    for (let k = 0; k < cnt; k++) {
      this.tubes[dst].push(this.tubes[src].pop());
      this.ballGfx[dst].push(moved[k]);
    }
    const self = this;
    for (let k = 0; k < cnt; k++) {
      const ball = moved[k];
      const target = this.ballPos(dst, destLen + k);
      const trail = this.time.addEvent({
        delay: 40, loop: true,
        callback: function () {
          if (!ball.active) { trail.remove(); return; }
          Core.Juice.trailPuff(self, ball.x + (Math.random() - 0.5) * 10, ball.y + (Math.random() - 0.5) * 10, 0xffffff);
        }
      });
      this.tweens.add({
        targets: ball, x: target.x, y: target.y, duration: 280, delay: k * 80, ease: 'Cubic.Out',
        onComplete: function () {
          trail.remove();
          self.tweens.add({ targets: ball, scale: 1.24, duration: 90, yoyo: true, ease: 'Quad.Out' });
          self.tweens.add({ targets: ball, scale: 1.0, duration: 160, delay: 90, ease: 'Back.Out' });
          Core.Juice.flash(self, target.x, target.y, 26);
          Core.Juice.ring(self, target.x, target.y, 0xffffff, 26, 46, 250);
          Core.Audio.drop();
          if (k === cnt - 1) {
            self.animating = false; self.refreshUndoButton();
            self.checkDoneTubes();
            if (Logic.isSolved(self.tubes)) self.onLevelComplete();
          }
        }
      });
    }
  }
  pour(from, to, recordUndo, countMove) {
    const cnt = Logic.pourCount(this.tubes, from, to);
    if (cnt === 0) return;
    if (recordUndo) this.undoStack.push({ from: from, to: to, cnt: cnt });
    this.animateMove(from, to, cnt);
    if (countMove) {
      this.moves++; this.updateMoves(); this.combo++;
      if (this.combo > this.maxCombo) this.maxCombo = this.combo;
      const pts = Math.min(this.combo, 5) * 10;
      this.addScore(pts, to);
      this.updateComboIndicator();
      if (this.combo >= 3 && (this.combo === 3 || this.combo % 5 === 0)) this.showCombo(this.combo);
    }
  }
  doUndo() {
    if (this.animating || this.levelJustFinished) return;
    if (this.undoStack.length === 0) return;
    const last = this.undoStack.pop();
    this.undoCount++; this.combo = 0; this.updateComboIndicator();
    this.clearSelectionGlow();
    this.animateMove(last.to, last.from, last.cnt);
    this.moves = Math.max(0, this.moves - 1);
    this.updateMoves(); this.refreshUndoButton();
  }
  showHint() {
    let best = null, bestScore = Infinity;
    for (let a = 0; a < this.tubes.length; a++) {
      for (let b = 0; b < this.tubes.length; b++) {
        if (!Logic.canPour(this.tubes, a, b)) continue;
        const n = Logic.clone(this.tubes);
        Logic.applyPour(n, a, b);
        let score = 0;
        for (let i = 0; i < n.length; i++) if (n[i].length > 0 && !Logic.isUniform(n[i])) score++;
        if (score < bestScore) { bestScore = score; best = { from: a, to: b }; }
      }
    }
    if (!best) return;
    this.flash(best.from);
    this.time.delayedCall(400, () => this.flash(best.to));
  }
  flash(i) {
    const g = this.tubeGeom[i];
    const r = this.add.rectangle(g.x, g.y, g.w + 20, g.h + 20, 0xffeb3b, 0.35).setStrokeStyle(3, 0xffeb3b, 1).setDepth(50);
    this.tweens.add({ targets: r, alpha: 0, duration: 600, onComplete: function () { r.destroy(); } });
  }
}

try {
  window.__game = new Phaser.Game({
    type: Phaser.AUTO, width: 720, height: 1280, parent: 'game',
    backgroundColor: '#0f3460',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: [BootScene, MenuScene, AchievementsScene, LevelMapScene, ShopScene, BallSortScene]
  });
} catch (e) {
  if (window.__showFatal) window.__showFatal('Запуск: ' + (e && e.message));
  console.error(e);
}
</script>
