function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function pfYMD(y, m, d) { return y * 10000 + (m + 1) * 100 + d; }
function pfMonthKey(dateStr) { return Math.floor(dateStr / 100); }
function pfTodayMonthKey() { const d = new Date(); return d.getFullYear() * 100 + (d.getMonth() + 1); }
function pfDaysInMonth(monthKey) {
  const y = Math.floor(monthKey / 100), m = monthKey % 100;
  return new Date(y, m, 0).getDate();
}
function pfMonthLabel(monthKey) {
  const names = ['ЯНВАРЬ','ФЕВРАЛЬ','МАРТ','АПРЕЛЬ','МАЙ','ИЮНЬ','ИЮЛЬ','АВГУСТ','СЕНТЯБРЬ','ОКТЯБРЬ','НОЯБРЬ','ДЕКАБРЬ'];
  const y = Math.floor(monthKey / 100), m = monthKey % 100;
  return names[m - 1] + ' ' + y;
}

function pfMonthStars(monthKey) {
  const h = Core.SDK.get('dailyHistory', {});
  let sum = 0;
  Object.keys(h).forEach(function (k) {
    if (Math.floor(Number(k) / 100) === monthKey) sum += (h[k] && h[k].bestStars) || 0;
  });
  return sum;
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

// ===================== SDK =====================
Core.SDK = {
  ysdk: null, player: null, isStub: true, saveData: {},
  async init() {
    if (typeof YaGames === 'undefined') { console.log('[SDK] stub mode'); this.loadStub(); return; }
    try {
      this.ysdk = await Promise.race([
        YaGames.init(),
        new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, 3000); })
      ]);
      this.isStub = false;
      try { this.player = await this.ysdk.getPlayer({ scopes: false }); } catch (e) {}
      if (this.player) {
        try { this.saveData = (await this.player.getData()) || {}; } catch (e) { this.saveData = {}; }
      }
    } catch (e) { console.warn('[SDK] stub:', e.message); this.isStub = true; this.loadStub(); }
    this.migrate();
  },
  loadStub() {
    try { this.saveData = JSON.parse(localStorage.getItem('_game_save') || '{}'); }
    catch (e) { this.saveData = {}; }
  },
  migrate() {
    const d = Core.DEFAULT_SAVE;
    for (const k in d) if (this.saveData[k] === undefined) this.saveData[k] = JSON.parse(JSON.stringify(d[k]));
    if (!this.saveData.dailyHistory) this.saveData.dailyHistory = {};
    if (!this.saveData.monthlyRewards) this.saveData.monthlyRewards = {};
    if (!this.saveData.upgrades) this.saveData.upgrades = {};
    if (!this.saveData.achClaimed) this.saveData.achClaimed = {};
    if (!Array.isArray(this.saveData.achievements)) {
      const v = this.saveData.achievements;
      const arr = [];
      if (v && typeof v === 'object') Object.keys(v).forEach(function (k) { if (v[k]) arr.push(String(k)); });
      this.saveData.achievements = arr;
    }
  },
  async save(patch) {
    Object.assign(this.saveData, patch);
    if (this.isStub || !this.player) { try { localStorage.setItem('_game_save', JSON.stringify(this.saveData)); } catch (e) {} return; }
    try { await this.player.setData(this.saveData, true); } catch (e) {}
  },
  get(key, def) {
    if (this.saveData[key] === undefined) return def !== undefined ? def : Core.DEFAULT_SAVE[key];
    return this.saveData[key];
  },
  async rewarded() {
    if (this.isStub || !this.ysdk) { await new Promise(function (r) { setTimeout(r, 600); }); return true; }
    return new Promise((resolve) => {
      let ok = false;
      try {
        this.ysdk.adv.showRewardedVideo({ callbacks: {
          onRewarded: function () { ok = true; },
          onClose: function () { resolve(ok); },
          onError: function () { resolve(false); }
        }});
      } catch (e) { resolve(false); }
    });
  },
  interstitial() { if (this.isStub || !this.ysdk) return; try { this.ysdk.adv.showFullscreenAdv({ callbacks: {} }); } catch (e) {} },
  gameplayStart() { try { if (this.ysdk?.features?.GameplayAPI) this.ysdk.features.GameplayAPI.start(); } catch (e) {} },
  gameplayStop()  { try { if (this.ysdk?.features?.GameplayAPI) this.ysdk.features.GameplayAPI.stop(); } catch (e) {} }
};

    { id: 'farmer', title: 'Фармер', desc: '???', goal: 10, hidden: true, value: function (s) { return s.uselessMoves || 0; } }

  unlocked: function () {
    const v = Core.SDK.get('achievements', []);
    if (Array.isArray(v)) return v;
    if (v && typeof v === 'object') {
      const arr = [];
      Object.keys(v).forEach(function (k) { if (v[k]) arr.push(String(k)); });
      Core.SDK.save({ achievements: arr });
      return arr;
    }
    Core.SDK.save({ achievements: [] });
    return [];
  },
claimed: function () {
  const v = Core.SDK.get('achClaimed');
  if (v && typeof v === 'object' && !Array.isArray(v)) return v;
  return {};
},
  isClaimed: function (id) { return !!this.claimed()[id]; },
  count: function () {
    const un = this.unlocked();
    return this.list.filter(function (a) { return un.indexOf(a.id) >= 0; }).length;
  },
  progress: function (a, s) {
    const v = Math.min(a.goal, (typeof a.value === 'function') ? (a.value(s) || 0) : 0);
    return { cur: v, goal: a.goal, done: v >= a.goal };
  },
  sync: function () {
    const s = this.stats();
    const un = this.unlocked().slice();
    const newly = [];
    
    this.list.forEach(function (a) {
      if (un.indexOf(a.id) < 0 && (a.value(s) || 0) >= a.goal) {
        un.push(a.id);
        newly.push(a);
      }
    });
    
    if (newly.length) {
      Core.SDK.save({ achievements: un });
    }
    return newly;
  },
claim: function (id) {
  const cl = { ...this.claimed() };
  if (cl[id]) return false;

  const r = this.rewardFor(id);
  const curCoins = Core.SDK.get('coins', 0) || 0;
  const curHints = Core.SDK.get('hintsOwned', 0) || 0;
  const newCoins = r.coins ? curCoins + r.coins : curCoins;
  const newHints = r.hints ? curHints + r.hints : curHints;

  cl[id] = Date.now();

  Core.SDK.save({
    coins: newCoins,
    hintsOwned: newHints,
    achClaimed: cl
  });

  return true;
},
};

Core.syncObsidianAccess = function () {
  if (!Core.SDK || !Core.SDK.saveData) return;
  const rewards = Core.SDK.get('monthlyRewards', {});
  let earned = false;
  Object.keys(rewards).forEach(function (k) {
    const r = rewards[k];
    const cl = r.claimed || (r.tier ? [String(r.tier).toLowerCase()] : []);
    if (cl.indexOf('gold') >= 0) earned = true;
  });
  const owned = Core.SDK.get('ownedSkins', ['classic']).slice();
  const patch = {};
  if (Core.TEST_OBSIDIAN) {
    if (owned.indexOf('obsidian') < 0) { owned.push('obsidian'); patch.ownedSkins = owned; }
    if (!Core.SDK.get('_obsidianTestSeen', false)) { patch.currentSkin = 'obsidian'; patch._obsidianTestSeen = true; }
  } else if (!earned) {
    const i = owned.indexOf('obsidian');
    if (i >= 0) { owned.splice(i, 1); patch.ownedSkins = owned; }
    if (Core.SDK.get('currentSkin', 'classic') === 'obsidian') patch.currentSkin = 'classic';
    if (Core.SDK.get('_obsidianTestSeen', false)) patch._obsidianTestSeen = false;
  }
  if (Object.keys(patch).length) Core.SDK.save(patch);
};

Core.Audio = (function () {
  let ctx = null;
  
  // Глобальная разблокировка для мобильных (Redmi/Xiaomi/iOS)
  function globalUnlock() {
    if (ctx && ctx.state === 'suspended') ctx.resume();
    document.removeEventListener('touchstart', globalUnlock);
    document.removeEventListener('touchend', globalUnlock);
  }
  document.addEventListener('touchstart', globalUnlock, { passive: true });
  document.addEventListener('touchend', globalUnlock, { passive: true });
  
  function ensure() {
    if (!ctx) { 
      try { 
        ctx = new (window.AudioContext || window.webkitAudioContext)(); 
      } catch (e) {} 
    }
    if (ctx && ctx.state === 'suspended') {
      try { ctx.resume(); } catch(e) {}
    }
  }
  function tone(freq, dur, type, vol) {

    gain.gain.setValueAtTime(vol || 0.12, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain).connect(ctx.destination); osc.start(t); osc.stop(t + dur);
  }
  return {
    unlock: ensure,
    select: function () { tone(660, 0.06, 'triangle', 0.1); },

Core.Music = (function() {
    let ctx = null;
    let masterGain = null;
    let isPlaying = false;
    let nextNoteTime = 0;
    let schedulerTimer = null;
    
    // Пентатоника C для спокойствия
    const SCALE = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25]; 
    const BASS_FREQ = 65.41; // C2

    function init() {
        if (!ctx) {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = ctx.createGain();
            masterGain.gain.value = Core.Settings.musicOn ? 0.12 : 0;
            
            // Простой дилей для пространства
            const delay = ctx.createDelay();
            delay.delayTime.value = 0.5;
            const feedback = ctx.createGain();
            feedback.gain.value = 0.4;
            
            masterGain.connect(ctx.destination);
            masterGain.connect(delay);
            delay.connect(feedback);
            feedback.connect(delay);
            feedback.connect(masterGain);
        }
        if (ctx.state === 'suspended') ctx.resume();
    }

    function playBell(time, freq) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = 'sine';
        osc.frequency.value = freq;
        
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(0.3, time + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 4);
        
        osc.connect(gain);
        gain.connect(masterGain);
        
        osc.start(time);
        osc.stop(time + 4.5);
    }

    function playBass(time) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        
        osc.type = 'triangle';
        osc.frequency.value = BASS_FREQ;
        
        filter.type = 'lowpass';
        filter.frequency.value = 200;
        
        gain.gain.setValueAtTime(0, time);
        gain.gain.linearRampToValueAtTime(0.4, time + 2);
        gain.gain.linearRampToValueAtTime(0, time + 8);
        
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(masterGain);
        
        osc.start(time);
        osc.stop(time + 8.5);
    }

    function scheduler() {
        if (!isPlaying || !Core.Settings.musicOn) return;
        
        while (nextNoteTime < ctx.currentTime + 0.1) {
            // Случайный колокольчик
            if (Math.random() > 0.3) {
                const note = SCALE[Math.floor(Math.random() * SCALE.length)];
                const octave = Math.random() > 0.8 ? 2 : 1;
                playBell(nextNoteTime, note * octave);
            }
            
            // Бас раз в ~8 секунд
            if (Math.random() > 0.92) {
                playBass(nextNoteTime);
            }
            
            nextNoteTime += 1.5 + Math.random() * 2.5;
        }
        schedulerTimer = requestAnimationFrame(scheduler);
    }

    return {
        start: function() {
            if (isPlaying) return;
            init();
            isPlaying = true;
            nextNoteTime = ctx.currentTime + 0.5;
            if (masterGain) masterGain.gain.setTargetAtTime(Core.Settings.musicOn ? 0.12 : 0, ctx.currentTime, 0.1);
            scheduler();
        },
        stop: function() {
            isPlaying = false;
            if (schedulerTimer) cancelAnimationFrame(schedulerTimer);
            if (masterGain && ctx) masterGain.gain.setTargetAtTime(0, ctx.currentTime, 0.5);
        },
        updateVolume: function() {
            if (masterGain && ctx) {
                const target = Core.Settings.musicOn ? 0.12 : 0;
                masterGain.gain.setTargetAtTime(target, ctx.currentTime, 0.1);
            }
        }
    };
})();

Core.Feel = (function () {
  'use strict';
const REDUCED = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
function vib(p) {
  try {
    const vibOn = localStorage.getItem('pf_vib') !== 'false';
    if (navigator.vibrate && !REDUCED && vibOn) navigator.vibrate(p);
  } catch (e) {}
}
  function vib(p) { try { if (navigator.vibrate && !REDUCED) navigator.vibrate(p); } catch (e) {} }
  const Haptics = {
    tap:   () => vib(8), place: () => vib(15),
    combo: (n) => vib(n >= 5 ? [20, 15, 30] : [10, 8, 15]),
    win:   () => vib([30, 20, 30, 20, 60]), error: () => vib([40, 30, 40]), coin:  () => vib([8, 5, 8])
  };
  const Ball = {
    land(scene, ball) {
      if (REDUCED || !ball) return;
      scene.tweens.add({ targets: ball, scaleX: { from: 1.25, to: 1 }, scaleY: { from: 0.75, to: 1 }, duration: 240, ease: 'Elastic.Out' });
    }
  };
  function scorePop(scene, x, y, amount, opts) {
    opts = opts || {};
    const t = scene.add.text(x, y, '+' + amount, {
      fontFamily: Core.FONT, fontSize: (opts.size || 26) * 1.3 + 'px', fontStyle: '900', color: opts.color || '#e8c874', stroke: '#000000', strokeThickness: 4
    }).setOrigin(0.5).setDepth(1000).setScale(0.3).setAlpha(0).setResolution(1);
    scene.tweens.add({ targets: t, scale: 1.15, alpha: 1, duration: 200, ease: 'Back.Out', onComplete: () => scene.tweens.add({ targets: t, scale: 1, duration: 100 }) });
    scene.tweens.add({ targets: t, y: y - 80, alpha: 0, duration: 900, delay: 220, ease: 'Cubic.Out', onComplete: () => t.destroy() });
  }
  function punch(scene, intensity) { if (REDUCED) return; scene.cameras.main.shake(180, intensity || 0.004); }
  function zoomPunch(scene, zoom, dur) { if (REDUCED) return; scene.tweens.add({ targets: scene.cameras.main, zoom: zoom || 1.04, duration: dur || 140, yoyo: true, ease: 'Sine.InOut' }); }
  function victory(scene) {
    const W = scene.scale.width, H = scene.scale.height;
    const fl = scene.add.rectangle(0, 0, W, H, 0xffffff, 0.32).setOrigin(0).setDepth(1000);
    scene.tweens.add({ targets: fl, alpha: 0, duration: 420, onComplete: () => fl.destroy() });
    zoomPunch(scene, 1.05, 320); Haptics.win();
  }
  return { Haptics, Ball, scorePop, punch, zoomPunch, victory, REDUCED };
})();

Core.Utils = {

    const rand = rng || Math.random;
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
};

Core.makeCoinTexture = function (scene) {
  if (scene.textures.exists('coin_icon')) return;
  const size = 64;
  try {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext('2d');
    const cx = size / 2, cy = size / 2, r = size / 2 - 2;
    ctx.fillStyle = '#6f5a1f'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e8c874'; ctx.beginPath(); ctx.arc(cx, cy, r - 2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(168,132,42,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, r - 8, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(245,230,184,0.85)'; ctx.beginPath(); ctx.arc(cx - r * 0.35, cy - r * 0.35, r * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(cx - r * 0.45, cy - r * 0.45, r * 0.1, 0, Math.PI * 2); ctx.fill();
    if (scene.textures.exists('coin_icon')) scene.textures.remove('coin_icon');
    scene.textures.addCanvas('coin_icon', canvas);

Core.createMarbleTexture = function(scene, key, baseColor, veinColor) {
  if (scene.textures.exists(key)) return;
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = baseColor;
  ctx.beginPath(); ctx.arc(size/2, size/2, size/2, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = veinColor;
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  for (let i = 0; i < 12; i++) {
    ctx.beginPath();
    let x = Math.random() * size, y = Math.random() * size;
    ctx.moveTo(x, y);
    for (let j = 0; j < 6; j++) {
      x += (Math.random() - 0.5) * 50;
      y += (Math.random() - 0.5) * 50;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  scene.textures.addCanvas(key, canvas);
};

Core.createStripesTexture = function(scene, key, baseColor) {
  if (scene.textures.exists(key)) return;
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  
  ctx.fillStyle = baseColor; 
  ctx.fillRect(0, 0, size, size);
  
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)'; 
  ctx.lineWidth = 16;
  for (let i = -size; i < size*2; i += 32) {
    ctx.beginPath(); 
    ctx.moveTo(i, 0); 
    ctx.lineTo(i + size, size); 
    ctx.stroke();
  }
  
  ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
  ctx.lineWidth = 6;
  for (let i = -size; i < size*2; i += 32) {
    ctx.beginPath(); 
    ctx.moveTo(i + 10, 0); 
    ctx.lineTo(i + size + 10, size); 
    ctx.stroke();
  }
  
  ctx.globalCompositeOperation = 'destination-in';
  ctx.beginPath(); ctx.arc(size/2, size/2, size/2, 0, Math.PI*2); ctx.fill();
  scene.textures.addCanvas(key, canvas);
};

Core.createGalaxyTexture = function(scene, key, baseColor) {
  if (scene.textures.exists(key)) return;
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  
  const g = ctx.createRadialGradient(size/2, size/2, 10, size/2, size/2, size/2);
  g.addColorStop(0, baseColor);
  g.addColorStop(0.5, '#0a0a10');
  g.addColorStop(1, '#000000');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(size/2, size/2, size/2, 0, Math.PI*2); ctx.fill();
  
  for (let i = 0; i < 80; i++) {
    const r = Math.random() * 2 + 0.5;
    ctx.fillStyle = Math.random() > 0.7 ? '#ffffff' : baseColor;
    ctx.beginPath(); ctx.arc(Math.random()*size, Math.random()*size, r, 0, Math.PI*2); ctx.fill();
  }
  scene.textures.addCanvas(key, canvas);
};

Core.createCandyTexture = function(scene, key, color1, color2) {

    if (!scene.textures.exists(key)) {
      if (style === 'marble') Core.createMarbleTexture(scene, key, hex, '#ffffff');
      else if (style === 'stripes') Core.createStripesTexture(scene, key, hex);
      else if (style === 'galaxy') Core.createGalaxyTexture(scene, key, hex);
      else if (style === 'lava') Core.createLavaTexture(scene, key, hex);
      else if (style === 'candy') Core.createCandyTexture(scene, key, hex, '#ffffff');
    }
    const img = scene.add.image(0, 0, key);
    img.setDisplaySize(r * 2, r * 2);
    c.add(img);
    
    c.add(scene.add.circle(0, 0, r).setStrokeStyle(2.5, 0x000000, 0.9));
    return c;
  }

  if (style === 'glossy') {
    c.add(scene.add.circle(0, r * 0.1, r, 0x000000, 0.2));
    c.add(scene.add.circle(0, 0, r, col));
    c.add(scene.add.circle(0, 0, r).setStrokeStyle(2.5, 0x000000, 0.9));
    const gloss = scene.add.ellipse(-r * 0.3, -r * 0.35, r * 0.6, r * 0.4, 0xffffff, 0.7);
    gloss.setAngle(-30); 
    c.add(gloss);
    
  } else if (style === 'flat') {
    c.add(scene.add.circle(0, 0, r, col));
    c.add(scene.add.circle(0, 0, r).setStrokeStyle(3, 0x000000, 0.9));
  } else if (style === 'neon') {
    c.add(scene.add.circle(0, 0, r + 4, col, 0.3));
    c.add(scene.add.circle(0, 0, r, col));
    c.add(scene.add.circle(0, 0, r).setStrokeStyle(2, 0xffffff, 0.9));
  } else if (style === 'metal') {
    c.add(scene.add.circle(0, 0, r, 0x202028));
    c.add(scene.add.circle(0, 0, r - 2, col));
    c.add(scene.add.circle(0, 0, r).setStrokeStyle(2, 0x000000, 0.8));
    c.add(scene.add.circle(-r * 0.3, -r * 0.3, r * 0.3, 0xffffff, 0.6));
  } else if (style === 'glass') {
    c.add(scene.add.circle(0, 0, r, col, 0.7)); 
    c.add(scene.add.circle(0, 0, r).setStrokeStyle(2, 0xffffff, 0.9));
    const gloss = scene.add.ellipse(-r * 0.3, -r * 0.35, r * 0.7, r * 0.45, 0xffffff, 0.8);
    gloss.setAngle(-30); c.add(gloss);
  } else {
    c.add(scene.add.circle(0, 0, r, col));
    c.add(scene.add.circle(0, 0, r).setStrokeStyle(2, 0x000000, 0.8));
  }
  
  return c;
};

Core.coinLabel = function (scene, x, y, amount, opts) {
  opts = opts || {};
  const fs = opts.fontSize || 22;
  const iconSize = (opts.iconSize || Math.round(fs * 1.05)) * 1.3;
  const gap = opts.gap || 6;
  const color = opts.color || '#e8c874';
  const stroke = opts.stroke || '#000000';
  const st = opts.strokeThickness != null ? opts.strokeThickness : 3;
  const anchor = opts.anchor || 'center';
  const fmt = function (v) { return typeof v === 'number' ? v.toLocaleString('ru-RU') : String(v); };

  const txt = scene.add.text(0, 0, fmt(amount), {
    fontFamily: Core.FONT, 
    fontSize: (fs) * 1.3 + 'px', 
    fontStyle: 'bold', 
    color: color, 
    stroke: stroke, 
    strokeThickness: st,
    padding: { x: 8, y: 8 }
  }).setOrigin(0, 0.5);

  const layout = function () {
    const totalW = iconSize + gap + txt.width;
    let startX = anchor === 'center' ? -totalW / 2 : (anchor === 'right' ? -totalW : 0);
    icon.x = startX + iconSize / 2;
    txt.x = startX + iconSize + gap;
  };
  const icon = scene.add.image(0, 0, 'coin_icon').setDisplaySize(iconSize, iconSize);
  const c = scene.add.container(x, y);
  c.add([icon, txt]);
  layout();
  
  c.__setAmount = function (v) { 
    try {
      txt.setText(fmt(v)); 
      layout(); 
    } catch (e) {
      console.warn('coinLabel setText skip:', e);
    }
  };
  
  c.__tickTo = function (target, dur) {
    c.__setAmount(target);
  };
  
  return c;
};

Core.makeGradients = function (scene) {
  Core.makeCoinTexture(scene);
};

Core.TextStyles = {

};

class BaseGameScene extends Phaser.Scene {
  init(data) {
    this.mode = (data && data.mode) || 'level';
    this.level = (data && data.level) || Core.SDK.get('level', 1);
    this.seed = (data && data.seed) || null;
    this.isDaily = this.mode === 'daily';
    this.dailyDate = (data && data.dailyDate) || todayStr();
  }
  create() {
    Core.syncObsidianAccess();
    const W = this.scale.width, H = this.scale.height;
    this.cameras.main.setBackgroundColor('#0a0a10');
    const bg = this.add.graphics().setDepth(-10);
    bg.fillGradientStyle(0x0a0a10, 0x0a0a10, 0x161022, 0x161022, 1);
    bg.fillRect(0, 0, W, H);
    Core.Juice.ambient(this, 22, -5);

    this.moves = 0; this.score = 0; this.animating = false;
    this.levelJustFinished = false;
    this.hintsLeft = Core.SDK.get('hintsOwned', 3);
    this.shufflesLeft = Core.SDK.get('shufflesOwned', 2);
    this.undoCount = 0; this.combo = 0; this.maxCombo = 0;
    this.savedHints = this.hintsLeft;
    this.bestScore = this.isDaily ? 0 : (Core.SDK.get('bestScores', {})[this.level] || 0);
    this.bestStars = this.isDaily ? 0 : (Core.SDK.get('bestStars', {})[this.level] || 0);
    this.skin = Core.Skins.tubes[Core.SDK.get('currentSkin', 'classic')] || Core.Skins.tubes.classic;

    this.createTopBar();
    this.buildLevel(this.level);
    this.resetState();
    this.createBottomBar();
    Core.SDK.gameplayStart();
    this.cameras.main.fadeIn(280, 0, 0, 0);
  }
  createTopBar() {
    const W = this.scale.width;
    const bar = this.add.graphics();
    bar.fillStyle(0x000000, 0.3); bar.fillRect(0, 0, W, 90);
    const back = this.add.text(20, 45, '←', { fontFamily: Core.FONT, fontSize: '54.6px', fontStyle: '900', color: '#f5f0e6' }).setOrigin(0, 0.5).setInteractive({ useHandCursor: true }).setResolution(1);
    back.on('pointerdown', () => { Core.SDK.gameplayStop(); this.scene.start('Menu'); });
    let title = 'Уровень ' + this.level;
    if (this.isDaily) title = 'Ежедневный вызов';
    this.add.text(W / 2, 30, title, Core.TextStyles.heading(26)).setOrigin(0.5).setResolution(1);
    const subtitle = this.bestScore > 0 ? 'Рекорд: ★ ' + this.bestScore : (this.isDaily ? 'Только раз в день' : '');
    this.add.text(W / 2, 62, subtitle, Core.TextStyles.soft(13, '#9a8fb8')).setOrigin(0.5).setResolution(1);
    

    
    this.coinLabel = Core.coinLabel(this, 20, 110, Core.SDK.get('coins', 0), { fontSize: 18, iconSize: 20, anchor: 'left' });
    this.scoreText = this.add.text(W - 20, 28, '★ 0', { fontFamily: Core.FONT, fontSize: '33.8px', fontStyle: '900', color: '#e8c874', stroke: '#000000', strokeThickness: 3 }).setOrigin(1, 0.5).setResolution(1);
    this.movesText = this.add.text(W - 20, 66, 'Ходы: 0', Core.TextStyles.soft(14, '#9a8fb8')).setOrigin(1, 0.5).setResolution(1);
    this.comboText = this.add.text(W - 20, 108, '', { fontFamily: Core.FONT, fontSize: '28.6px', fontStyle: '900', color: '#f0b060', stroke: '#000000', strokeThickness: 3 }).setOrigin(1, 0.5).setVisible(false).setResolution(1);
  }
  updateMoves() {
    if (!this.movesText) return;
    const par = this.parMoves || 0;
    this.movesText.setText(par ? ('Ходы: ' + this.moves + ' / ' + par) : ('Ходы: ' + this.moves));
    if (par) {
      const good = this.moves <= par;
      const ok = this.moves <= Math.ceil(par * 1.35);
      this.movesText.setColor(good ? '#e8c874' : (ok ? '#c9c2d8' : '#e0556a'));
    }
  }
  updateScore(smooth) {
    if (!this.scoreText) return;
    const self = this;
    const prev = parseInt(String(this.scoreText.text).replace(/[^\d-]/g, ''), 10) || 0;
    if (smooth === false) { this.scoreText.setText('★ ' + this.score); return; }
    this.tweens.addCounter({
      from: prev, to: this.score, duration: 260,
      onUpdate: function (tw) { self.scoreText.setText('★ ' + Math.round(tw.getValue())); },
      onComplete: function () { self.scoreText.setText('★ ' + self.score); }
    });
  }
  updateCoins() { if (this.coinLabel) this.coinLabel.__setAmount(Core.SDK.get('coins', 0)); }
  updateComboIndicator() {
    if (!this.comboText) return;
    if (this.combo < 2) { this.comboText.setVisible(false); return; }
    this.comboText.setText('x' + this.combo + ' КОМБО');
    this.comboText.setVisible(true);
    this.tweens.add({ targets: this.comboText, scale: 1.35, duration: 140, yoyo: true, ease: 'Quad.Out' });
  }
  addScore(pts, tubeIndex, opts) {
    opts = opts || {};
    if (pts <= 0) return;
    this.score += pts; this.updateScore(true);
    const g = (this.tubeGeom || [])[tubeIndex];
    if (g) {
      const size = opts.size || 26;
      const color = opts.color || '#e8c874';
      Core.Feel.scorePop(this, g.x, g.y - g.h / 2 - 16, pts, { color: color, size: size });
    }
    this.tweens.add({ targets: this.scoreText, scale: 1.25, duration: 130, yoyo: true, ease: 'Quad.Out' });
    Core.Audio.score();
  }
  createBottomBar() {
    const W = this.scale.width, H = this.scale.height;
    const y = H - 104;
    
    this.restartBtn = this.makeBtn(W/2 - 220, y, '↺', 'Заново', () => this.doRestart());
    this.undoBtn = this.makeBtn(W/2 - 75, y, '↶', 'Отмена хода', () => this.doUndo());
    this.shuffleBtn = this.makeBtn(W/2 + 75, y, 'Микс', 'Перемешать', () => this.doShuffle());
    this.hintBtn = this.makeBtn(W/2 + 220, y, 'Идея', 'Подсказка', () => this.doHint());
    
    const badge = this.add.circle(38, 30, 15, 0xd4af37, 1);
    const badgeText = this.add.text(38, 30, String(this.hintsLeft), {
      fontFamily: Core.FONT, fontSize: '15px', fontStyle: '400', color: '#0a0a10'
    }).setOrigin(0.5).setResolution(1);
    this.hintBtn.container.add([badge, badgeText]);
    this.hintBtn.badgeText = badgeText;
    
    this.refreshUndoButton();
    this.updateHintLabel();
  }
  makeBtn(x, y, icon, label, onClick) {
    const c = this.add.container(x, y);
    const w = 108, h = 88;
    const bg = this.add.graphics();
    bg.fillStyle(0x1c1628, 0.96); bg.fillRoundedRect(-w/2, -h/2, w, h, 20);
    bg.lineStyle(2, 0xd4af37, 0.75); bg.strokeRoundedRect(-w/2, -h/2, w, h, 20);
    c.add(bg);
    const iconT = this.add.text(0, -4, icon, {
      fontFamily: Core.FONT, fontSize: '22px', fontStyle: '400', color: '#f5f0e6'
    }).setOrigin(0.5).setResolution(1);
    c.add(iconT);
    const tip = this.add.container(0, -h/2 - 34);
    const tipText = this.add.text(0, 0, label, {
      fontFamily: Core.FONT, fontSize: '16px', fontStyle: '400', color: '#f5f0e6'
    }).setOrigin(0.5).setResolution(1);
    const tw = Math.max(120, tipText.width + 28), th = 36;
    const tipBg = this.add.graphics();
    tipBg.fillStyle(0x0a0a10, 0.96); tipBg.fillRoundedRect(-tw/2, -th/2, tw, th, 12);
    tipBg.lineStyle(1.5, 0xd4af37, 0.8); tipBg.strokeRoundedRect(-tw/2, -th/2, tw, th, 12);
    tipBg.fillTriangle(-7, th/2 - 1, 7, th/2 - 1, 0, th/2 + 9);
    tip.add([tipBg, tipText]);
    tip.setVisible(false);
    c.add(tip);
    const hit = this.add.rectangle(0, 0, w, h, 0xffffff, 0).setInteractive({ useHandCursor: true });
    c.add(hit);
    hit.on('pointerover', () => { tip.setVisible(true); bg.setAlpha(0.85); });
    hit.on('pointerout', () => { tip.setVisible(false); bg.setAlpha(1); c.setScale(1); });
    hit.on('pointerdown', () => c.setScale(0.94));
    hit.on('pointerup', () => { c.setScale(1); onClick(); });
    return { container: c, bg, labelT: tipText, iconT, tip };
  }
  refreshUndoButton() {
    if (!this.undoBtn) return;
    const disabled = !this.undoStack || this.undoStack.length === 0 || this.animating;
    this.undoBtn.container.setAlpha(disabled ? 0.4 : 1);
    this.restartBtn.container.setAlpha(this.animating ? 0.4 : 1);
  }
  showToast(msg) {
    const W = this.scale.width, H = this.scale.height;
    const t = this.add.text(W / 2, H * 0.85, msg, {
      fontFamily: Core.FONT, fontSize: '23.4px', fontStyle: '800', color: '#f5f0e6',
      backgroundColor: '#000000cc', padding: { x: 16, y: 10 }
    }).setOrigin(0.5).setDepth(1000).setResolution(1);
    this.tweens.add({ targets: t, alpha: 0, y: H * 0.8, duration: 1400, delay: 900, onComplete: () => t.destroy() });
  }

  doRestart() {
    if (this.animating) return;
    this.scene.restart({ level: this.level, mode: this.mode, seed: this.seed, dailyDate: this.dailyDate });
  }

  async doShuffle() {
    if (this.animating || this.levelJustFinished) return;
    
    if (this.selected === -1) {
        this.showToast('Выберите колбу для микса!');
        return;
    }

    const targetTube = this.selected;
    if (this.tubes[targetTube].length === 0 || Logic.isUniform(this.tubes[targetTube])) {
        this.showToast('Эту колбу нельзя миксовать');
        return;
    }

    if (this.shufflesLeft > 0) {
      this.shufflesLeft--;
      Core.SDK.save({ shufflesOwned: this.shufflesLeft });
      this.updateShuffleLabel();
      this.performShuffle(targetTube);
      return;
    }
    const coins = Core.SDK.get('coins', 0);
    if (coins >= 50) {
      Core.SDK.save({ coins: coins - 50, shufflesOwned: this.shufflesLeft + 1 });
      this.shufflesLeft++; this.updateShuffleLabel(); this.updateCoins();
      Core.Audio.buy(); this.showToast('Куплено!');
      this.doShuffle();
    } else {
      this.showToast('Не хватает монет (нужно 50)');
    }
  }
  updateShuffleLabel() { if (this.shuffleBtn) this.shuffleBtn.labelT.setText('Микс (' + this.shufflesLeft + ')'); }
  
  performShuffle(targetIndex) {
    this.animating = true;
    this.clearSelectionGlow();
    this.drawTube(targetIndex, false);
    this.liftTop(targetIndex, false);
    this.selected = -1;

    const balls = this.tubes[targetIndex].slice();
    Core.Utils.shuffleWith(balls);
    this.tubes[targetIndex] = balls;

    this.ballGfx[targetIndex].forEach(b => b.destroy());
    this.ballGfx[targetIndex] = [];
    for (let j = 0; j < this.tubes[targetIndex].length; j++) {
      const b = this.makeBall(targetIndex, j);
      b.setAlpha(0);
      this.tweens.add({ targets: b, alpha: 1, duration: 300 });
      this.ballGfx[targetIndex].push(b);
    }
    
    Core.Juice.screenFlash(this, 0xf0b060, 0.2, 300);
    Core.Audio.select();
    this.time.delayedCall(350, () => {
      this.animating = false;
      this.checkDoneTubes();
      this.refreshUndoButton();
    });
  }

  async doHint() {
    if (this.animating) return;
    if (this.hintsLeft > 0) {
      this.hintsLeft--;
      Core.SDK.save({ hintsOwned: this.hintsLeft });
      this.updateHintLabel(); this.showHint(); return;
    }
    this.offerHintPurchase();
  }
  offerHintPurchase() {
    const W = this.scale.width, H = this.scale.height;
    const overlay = this.add.rectangle(0, 0, W, H, 0x000000, 0.75).setOrigin(0).setInteractive().setDepth(1001);
    const panel = this.add.container(W / 2, H / 2).setDepth(1002);
    
    const frame = this.add.graphics();
    frame.fillStyle(0x1c1628, 1);
    frame.fillRoundedRect(-220, -170, 440, 340, 20);
    frame.lineStyle(4, 0xd4af37, 1);
    frame.strokeRoundedRect(-220, -170, 440, 340, 20);
    panel.add(frame);
    
    panel.add(this.add.text(0, -130, 'Нет подсказок', Core.TextStyles.title(32)).setOrigin(0.5).setResolution(1));
    panel.add(this.add.text(0, -80, 'Как получить ещё?', Core.TextStyles.soft(16, '#c9c2d8')).setOrigin(0.5).setResolution(1));
    const coins = Core.SDK.get('coins', 0), canBuy = coins >= 30;
    const adBtn = this.add.graphics();
    adBtn.fillStyle(0xd4af37, 1);
    adBtn.fillRoundedRect(-190, -55, 380, 60, 16);
    panel.add(adBtn);
    const adHit = this.add.rectangle(0, -25, 380, 60, 0xffffff, 0).setInteractive({ useHandCursor: true });
    panel.add(adHit);
    panel.add(this.add.text(0, -25, 'СМОТРЕТЬ РЕКЛАМУ (+1)', {
      fontFamily: Core.FONT, fontSize: '22px', fontStyle: '900', color: '#0a0a10'
    }).setOrigin(0.5).setResolution(1));
    adHit.on('pointerdown', async () => {
      overlay.destroy(); panel.destroy();
      this.showToast('Смотрим рекламу...');
      const ok = await Core.SDK.rewarded();
      if (ok) { this.hintsLeft++; Core.SDK.save({ hintsOwned: this.hintsLeft }); this.updateHintLabel(); this.showHint(); }
      else this.showToast('Реклама недоступна');
    });
    
    const buyBtn = this.add.graphics();
    buyBtn.fillStyle(canBuy ? 0xe8c874 : 0x2a2138, 1);
    buyBtn.fillRoundedRect(-190, 20, 380, 60, 16);
    panel.add(buyBtn);
    if (canBuy) {
      const buyHit = this.add.rectangle(0, 50, 380, 60, 0xffffff, 0).setInteractive({ useHandCursor: true });
      panel.add(buyHit);
      buyHit.on('pointerdown', () => {
        overlay.destroy(); panel.destroy();
        Core.SDK.save({ coins: coins - 30, hintsOwned: this.hintsLeft + 1 });
        this.hintsLeft++; this.updateHintLabel(); this.updateCoins();
        Core.Audio.buy(); this.showToast('Куплено!'); this.showHint();
      });
    }
    panel.add(this.add.text(0, 50, canBuy ? 'Купить за 30' : 'Не хватает монет', {
      fontFamily: Core.FONT, fontSize: '26px', fontStyle: '900', color: canBuy ? '#0a0a10' : '#9a8fb8'
    }).setOrigin(0.5).setResolution(1));
    
    const close = this.add.text(0, 130, 'Отмена', Core.TextStyles.soft(16, '#9a8fb8')).setOrigin(0.5).setInteractive().setResolution(1);
    close.on('pointerdown', () => { overlay.destroy(); panel.destroy(); });
    panel.add(close);
    panel.setScale(0.7); panel.setAlpha(0);
    this.tweens.add({ targets: panel, scale: 1, alpha: 1, duration: 300, ease: 'Back.Out' });
  }
  updateHintLabel() {
    if (!this.hintBtn) return;
    const n = this.hintsLeft;
    if (this.hintBtn.labelT) this.hintBtn.labelT.setText('Подсказка (' + n + ')');
    if (this.hintBtn.badgeText) this.hintBtn.badgeText.setText(String(n));
  }
  showCombo(n) {
    const W = this.scale.width;
    const isBig = n >= 5, isHuge = n >= 10;
    if (isBig) {
      Core.Audio.bigCombo();
      Core.Feel.punch(this, isHuge ? 0.008 : 0.005);
      Core.Feel.zoomPunch(this, isHuge ? 1.06 : 1.03, 160);
      Core.Juice.screenFlash(this, 0xe8c874, 0.22, 240);
    } else {
      Core.Audio.combo(n);
    }
    Core.Feel.Haptics.combo(n);
    const fontSize = isHuge ? 56 : (isBig ? 46 : 38);
    const t = this.add.text(W / 2, 190, 'x' + n + ' КОМБО!', Core.TextStyles.title(fontSize)).setOrigin(0.5).setDepth(1500).setResolution(1);
    t.setScale(0.2);
    this.tweens.add({ targets: t, scale: 1, duration: 300, ease: 'Back.Out' });
    this.tweens.add({ targets: t, alpha: 0, y: 140, duration: 800, delay: 600, onComplete: function () { t.destroy(); } });

  getStars() {
    const assists = this.getAssists();
    const par = this.parMoves || Core.Solver.estimate(this.tubes || [], this.colors || 3);
    let stars;
    if (this.moves <= par) stars = 3;
    else if (this.moves <= Math.ceil(par * 1.35)) stars = 2;
    else stars = 1;
    if (assists >= 1) stars = Math.min(stars, 2);
    if (assists >= 3) stars = 1;
    return stars;
  }
  checkAchievementsAfterWin(stars, totalCompleted) {
    const newly = Core.Achievements.sync();
    newly.forEach((a, i) => {
      this.time.delayedCall(700 + i * 1100, () => {

      });
    });

  onLevelComplete() {
    if (this.levelJustFinished) return;
    this.levelJustFinished = true;
    const stars = this.getStars();
    const perf = this.computeLevelScore(stars);
    this.scoreBreakdown = perf;
    this.starBonus = perf.starBonus;
    this.score = perf.total;
    this.updateScore(true);
    const up = Core.SDK.get('upgrades', {});
    const perks = Core.activePerks();
    const coinBonus = up.coinBonus ? 10 : 0;
    const baseCoins = 20 + stars * 10 + coinBonus;
    const isNewRecord = this.isDaily ? false : (this.score > this.bestScore);
    const recordBonus = isNewRecord ? 20 : 0;
    const patch = {};
    let coinsEarned = 0;
    let firstDaily = false;

    if (this.isDaily) {
      const dateKey = this.dailyDate || todayStr();
      const history = Core.SDK.get('dailyHistory', {});
      const prev = history[dateKey];
      firstDaily = !prev;
      const bestScore = Math.max(prev && prev.bestScore ? prev.bestScore : 0, this.score);
      const bestStars = Math.max(prev && prev.bestStars ? prev.bestStars : 0, stars);
      history[dateKey] = {
        bestScore: bestScore, bestStars: bestStars, lastScore: this.score, lastStars: stars,
        moves: this.moves, par: this.parMoves || 0, plays: (prev && prev.plays ? prev.plays : 0) + 1,
        completedAt: prev && prev.completedAt ? prev.completedAt : Date.now(), updatedAt: Date.now()
      };
      patch.dailyHistory = history;
      if (dateKey === todayStr()) {
        patch.dailyDate = dateKey; patch.dailyStars = Math.max(Core.SDK.get('dailyStars', 0), stars);
      }
      coinsEarned = firstDaily ? (baseCoins + 100 + (up.dailyBonus ? 50 : 0)) : 0;
      if (firstDaily) {
        patch.totalScore = Core.SDK.get('totalScore', 0) + this.score;
        patch.totalLevelsCompleted = Core.SDK.get('totalLevelsCompleted', 0) + 1;
      }
    } else {
      const bestScores = Core.SDK.get('bestScores', {});
      if (isNewRecord) bestScores[this.level] = this.score;
      patch.bestScores = bestScores;
      const bestStars = Core.SDK.get('bestStars', {});
      if (stars > (bestStars[this.level] || 0)) bestStars[this.level] = stars;
      patch.bestStars = bestStars;
      coinsEarned = baseCoins + recordBonus;
      this.level++;
      patch.level = this.level;
      patch.totalScore = Core.SDK.get('totalScore', 0) + this.score;
      patch.totalLevelsCompleted = Core.SDK.get('totalLevelsCompleted', 0) + 1;
    }

    coinsEarned = Math.round(coinsEarned * (perks.coinMult || 1));
    patch.coins = Core.SDK.get('coins', 0) + coinsEarned;
    patch.hintsOwned = this.hintsLeft;
    Core.SDK.save(patch);
    this.updateCoins();
    this.coinsEarned = coinsEarned;
    this.coinMult = perks.coinMult || 1;
    this.dailyFirstCompletion = firstDaily;
    this.levelScore = perf.total;
    this.totalScore = Core.SDK.get('totalScore', 0);
    this.totalCoins = patch.coins;
    this.isNewRecord = isNewRecord;
    this.starsGot = stars;
    this.recordAfter = this.isDaily ? (Core.SDK.get('dailyHistory', {})[this.dailyDate] || {}).bestScore || this.score : Core.SDK.get('bestScores', {})[this.level - 1] || this.score;
    Core.Audio.win();
    if (isNewRecord) this.time.delayedCall(500, () => Core.Audio.record());
    Core.Feel.victory(this);
    this.spawnConfetti();
    this.checkAchievementsAfterWin(stars, Core.SDK.get('totalLevelsCompleted', 0));
    this.time.delayedCall(1000, () => this.showWinPanel());

    panel.add(this.add.text(0, -272, title, { fontFamily: Core.FONT, fontSize: '34px', fontStyle: '400', color: '#f5f0e6', stroke: '#000000', strokeThickness: 5 }).setOrigin(0.5).setResolution(1));

    panel.add(this.add.text(0, -98, '★ ' + this.levelScore, { fontFamily: Core.FONT, fontSize: '42px', fontStyle: '400', color: '#e8c874', stroke: '#000000', strokeThickness: 4 }).setOrigin(0.5).setResolution(1));

    let breakdown = 'База ' + b.base + ' · Точность +' + b.eff + ' · Звёзды +' + b.starBonus;
    if (b.penalty) breakdown += ' · Штраф −' + b.penalty;
    if (b.scoreMult > 1) breakdown += ' · Скин ×' + b.scoreMult;
    panel.add(this.add.text(0, -54, breakdown, { fontFamily: Core.FONT, fontSize: '13px', fontStyle: '400', color: '#9a8fb8', align: 'center', wordWrap: { width: 440 } }).setOrigin(0.5).setResolution(1));

    const coinsLabel = Core.coinLabel(this, 0, -10, 0, { fontSize: 26, iconSize: 28, anchor: 'center' });

    this.time.delayedCall(500, () => { coinsLabel.__tickTo(this.coinsEarned, 900); });
    if (this.coinMult > 1) {
      panel.add(this.add.text(0, 22, 'Скин: монеты ×' + this.coinMult, { fontFamily: Core.FONT, fontSize: '13px', fontStyle: '400', color: '#e8c874' }).setOrigin(0.5).setResolution(1));
    }

    panel.add(this.add.text(0, 62, 'Ходы: ' + this.moves + (b.par ? ' / цель ' + b.par : ''), { fontFamily: Core.FONT, fontSize: '18px', fontStyle: '400', color: '#c9c2d8' }).setOrigin(0.5).setResolution(1));
    panel.add(this.add.text(0, 96, 'Рекорд: ★ ' + this.recordAfter, { fontFamily: Core.FONT, fontSize: '18px', fontStyle: '400', color: '#e8c874' }).setOrigin(0.5).setResolution(1));
    panel.add(this.add.text(0, 128, 'Всего очков: ' + this.totalScore, { fontFamily: Core.FONT, fontSize: '15px', fontStyle: '400', color: '#9a8fb8' }).setOrigin(0.5).setResolution(1));

    const drawIcon = (type, color) => {
      const g = this.add.graphics();
      g.lineStyle(3, color, 1);
      if (type === 'home') {
        g.beginPath(); g.moveTo(-15, -1); g.lineTo(0, -15); g.lineTo(15, -1); g.strokePath();
        g.strokeRoundedRect(-11, -1, 22, 16, 3);
        g.strokeRoundedRect(-4, 5, 8, 10, 2);
      } else if (type === 'replay') {
        g.beginPath(); g.arc(0, 0, 12, Phaser.Math.DegToRad(-90), Phaser.Math.DegToRad(180), false); g.strokePath();
        g.fillStyle(color, 1); g.fillTriangle(0, -17, 0, -7, 9, -12);
      } else if (type === 'next') {
        g.fillStyle(color, 1); g.fillTriangle(-7, -13, -7, 13, 13, 0);
      } else if (type === 'archive') {
        g.strokeRoundedRect(-14, -11, 28, 26, 4);
        g.lineBetween(-14, -3, 14, -3);
        g.lineBetween(-7, -16, -7, -8);
        g.lineBetween(7, -16, 7, -8);
        g.fillStyle(color, 1);
        g.fillCircle(-6, 4, 2); g.fillCircle(0, 4, 2); g.fillCircle(6, 4, 2);
        g.fillCircle(-6, 10, 2); g.fillCircle(0, 10, 2);
      }
      return g;
    };
    
    // СКРУГЛЁННЫЕ КНОПКИ
    const makeIconBtn = (x, y, type, fill, border, iconColor, cb) => {
      const size = 84;
      const r = 20;
      const shadow = this.add.graphics();
      shadow.fillStyle(0x000000, 0.45);
      shadow.fillRoundedRect(x - size/2, y + 5 - size/2, size, size, r);
      const bg = this.add.graphics();
      bg.fillStyle(fill, 1);
      bg.fillRoundedRect(x - size/2, y - size/2, size, size, r);
      bg.lineStyle(2, border, 1);
      bg.strokeRoundedRect(x - size/2, y - size/2, size, size, r);
      const hit = this.add.rectangle(x, y, size, size, 0xffffff, 0).setInteractive({ useHandCursor: true });
      const icon = drawIcon(type, iconColor); icon.setPosition(x, y);
      panel.add([shadow, bg, hit, icon]);
      hit.on('pointerover', () => { bg.setAlpha(0.9); icon.setAlpha(0.9); });
      hit.on('pointerout', () => { bg.setAlpha(1); icon.setAlpha(1); icon.setScale(1); });
      hit.on('pointerdown', () => { icon.setScale(0.93); });
      hit.on('pointerup', () => { icon.setScale(1); cb(); });
    };
    const close = () => { overlay.destroy(); panel.destroy(); };
    const goMenu = () => { close(); Core.SDK.gameplayStop(); this.scene.start('Menu'); };

    if (this.isDaily) {
      makeIconBtn(-104, 226, 'home', 0x2a2138, 0x4a4460, 0xf5f0e6, goMenu);
      makeIconBtn(0, 226, 'replay', 0x7c5cff, 0xe8c874, 0xf5f0e6, () => { close(); this.scene.restart({ mode: 'daily', level: 0, seed: this.seed, dailyDate: this.dailyDate }); });
      makeIconBtn(104, 226, 'archive', 0xe8c874, 0xa8842a, 0x0a0a10, () => { close(); Core.SDK.gameplayStop(); this.scene.start('DailyArchive'); });

      makeIconBtn(-104, 226, 'home', 0x2a2138, 0x4a4460, 0xf5f0e6, goMenu);

      makeIconBtn(104, 226, 'next', 0xe8c874, 0xa8842a, 0x0a0a10, () => {
        close();
        const nl = this.level;
        const needAd = ((nl - 1) % 3 === 0) && nl > 1;
        if (needAd) { Core.SDK.interstitial(); this.time.delayedCall(500, () => this.scene.restart({ level: nl, mode: 'level' })); }
        else this.scene.restart({ level: nl, mode: 'level' });
      });
    }

    panel.setScale(0.6); panel.setAlpha(0);
    this.tweens.add({
      targets: panel, scale: 1, alpha: 1, duration: 520, ease: 'Back.Out',
      onComplete: () => Core.Feel.Haptics.tap()
    });
  }
  buildLevel(level) { throw new Error('not implemented'); }
  resetState() { throw new Error('not implemented'); }
  doUndo() {}
  showHint() {}
  doShuffle() {}

  getAssists() {
    const perks = Core.activePerks();
    const usedHints = Math.max(0, (this.savedHints || 0) - (this.hintsLeft || 0));
    let a = (perks.hintFree ? 0 : usedHints) + (perks.undoFree ? 0 : (this.undoCount || 0)) + (perks.shuffleFree ? 0 : (this.shuffleCount || 0) * 2);
    if (Core.SDK.get('upgrades', {}).starShield) a = Math.max(0, a - 1);
    return a;
  }

  computeLevelScore(stars) {
    const par = this.parMoves || Core.Solver.estimate(this.tubes || [], this.colors || 3);
    const moves = this.moves || 0;
    const assists = this.getAssists();
    const over = Math.max(0, moves - par);
    const eff = Math.round(800 * Math.max(0, Math.min(1, 1 - over / Math.max(1, par * 1.5))));
    const starBonus = stars * 300;
    const base = 400 + (this.colors || 3) * 60;
    const penalty = assists * 50;
    const perks = Core.activePerks();
    const raw = Math.max(100, base + eff + starBonus - penalty);
    const total = Math.round(raw * (perks.scoreMult || 1));
    return { total: total, base: base, eff: eff, starBonus: starBonus, penalty: penalty, assists: assists, par: par, moves: moves, scoreMult: perks.scoreMult || 1 };
  }
}

class AchievementsScene extends Phaser.Scene {
  constructor() { super('Achievements'); }
  create() {
    const W = this.scale.width, H = this.scale.height;
    this.cameras.main.setBackgroundColor('#0a0a10');
    const bg = this.add.graphics();
    bg.fillGradientStyle(0x0a0a10, 0x0a0a10, 0x161022, 0x161022, 1);

    const back = this.add.text(20, 45, '←', { fontFamily: Core.FONT, fontSize: '42px', fontStyle: '400', color: '#f5f0e6' }).setOrigin(0, 0.5).setInteractive({ useHandCursor: true }).setResolution(1);
    back.on('pointerdown', () => this.scene.start('Menu'));
    this.add.text(W / 2, 45, 'ДОСТИЖЕНИЯ', { fontFamily: Core.FONT, fontSize: '30px', fontStyle: '400', color: '#f5f0e6', stroke: '#000000', strokeThickness: 4 }).setOrigin(0.5).setResolution(1);
    this.countText = this.add.text(W - 20, 45, '', { fontFamily: Core.FONT, fontSize: '20px', fontStyle: '400', color: '#e8c874' }).setOrigin(1, 0.5).setResolution(1);
    this.maskTop = 90;
    this.listY = 140;
    this.listContainer = this.add.container(0, this.listY);
    this.renderList();
    this.cameras.main.fadeIn(240, 0, 0, 0);
  }
  iconOf(id) {
    const map = {
      first_win: ['flag', 1], lvl_10: ['flag', 2], lvl_25: ['flag', 2], lvl_50: ['flag', 3], lvl_100: ['flag', 4],
      score_10k: ['gem', 2], score_50k: ['gem', 3],
      coins_500: ['coin', 1], coins_2000: ['coin', 3],
      perfect_5: ['star', 2], perfect_20: ['star', 3], stars_100: ['star', 3],
      daily_first: ['cal', 1], daily_7: ['cal', 2], daily_30: ['cal', 3], month_stars_30: ['cal', 4],
      collector: ['tube', 2],
      upgrades_1: ['gear', 1], upgrades_all: ['gear', 3],
      record_10: ['chart', 2],
      farmer: ['gear', 1]
    };
    return map[id] || ['star', 1];
  }
  tierColor(t) { return [0, 0xcd7f32, 0xc0c0c0, 0xe8c874, 0x7c5cff][t] || 0xe8c874; }
  drawGlyph(g, cat, color) {
    g.lineStyle(2.5, color, 1);
    g.fillStyle(color, 1);
    if (cat === 'flag') {
      g.lineBetween(-4, -9, -4, 10);
      g.beginPath(); g.moveTo(-4, -9); g.lineTo(9, -5); g.lineTo(-4, -1); g.closePath(); g.fillPath();
    } else if (cat === 'gem') {
      g.beginPath(); g.moveTo(0, -10); g.lineTo(9, -2); g.lineTo(0, 10); g.lineTo(-9, -2); g.closePath(); g.fillPath();
      g.lineStyle(1.5, 0x0a0a10, 0.5); g.lineBetween(0, -10, 0, 10); g.lineBetween(-9, -2, 9, -2);
    } else if (cat === 'coin') {
      g.fillCircle(0, 0, 10);
      g.fillStyle(0x0a0a10, 0.35); g.fillCircle(0, 0, 6);
      g.fillStyle(color, 1); g.fillCircle(0, 0, 3.5);
    } else if (cat === 'star') {
      const pts = []; for (let i = 0; i < 10; i++) { const r = i % 2 === 0 ? 10 : 4.5; const a = -Math.PI / 2 + i * Math.PI / 5; pts.push([Math.cos(a) * r, Math.sin(a) * r]); }
      g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < 10; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); g.fillPath();
    } else if (cat === 'cal') {
      g.lineStyle(2.5, color, 1); g.strokeRoundedRect(-9, -8, 18, 17, 3);
      g.lineBetween(-9, -3, 9, -3);
      g.lineBetween(-4, -11, -4, -5); g.lineBetween(4, -11, 4, -5);
      g.fillCircle(-3, 3, 1.7); g.fillCircle(3, 3, 1.7);
    } else if (cat === 'tube') {
      g.lineStyle(2.5, color, 1); g.strokeRoundedRect(-6, -9, 12, 18, 5);
      g.fillStyle(color, 0.55); g.fillRoundedRect(-4, 1, 8, 7, { tl: 2, tr: 2, bl: 4, br: 4 });
    } else if (cat === 'gear') {
      const hp = []; for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 - Math.PI / 6; hp.push([Math.cos(a) * 9, Math.sin(a) * 9]); }
      g.beginPath(); g.moveTo(hp[0][0], hp[0][1]); for (let i = 1; i < 6; i++) g.lineTo(hp[i][0], hp[i][1]); g.closePath(); g.fillPath();
      g.fillStyle(0x241a3a, 1); g.fillCircle(0, 0, 3.5);
    } else if (cat === 'chart') {
      g.fillRect(-9, 3, 5, 7); g.fillRect(-2, -2, 5, 12); g.fillRect(5, -7, 5, 17);
    }
  }
  drawAchBadge(parent, x, y, cat, tier, unlocked) {
    const col = unlocked ? this.tierColor(tier) : 0x3a3450;
    const ring = this.add.graphics();
    ring.fillStyle(0x241a3a, unlocked ? 1 : 0.8); ring.fillCircle(0, 0, 26);
    ring.lineStyle(2.5, col, unlocked ? 1 : 0.5); ring.strokeCircle(0, 0, 26);
    ring.setPosition(x, y);
    const glyph = this.add.graphics();
    glyph.setPosition(x, y);
    this.drawGlyph(glyph, cat, unlocked ? col : 0x55506a);
    parent.add([ring, glyph]);
  }
  renderList() {
    const W = this.scale.width, H = this.scale.height;
    const s = Core.Achievements.stats();
    const un = Core.Achievements.unlocked();
    const claimedMap = Core.Achievements.claimed();
    this.listContainer.removeAll(true);
    const rowH = 88, gap = 10, rowW = W - 60;
    
    let visibleIndex = 0;
    Core.Achievements.list.forEach((a, i) => {
      // Скрытые ачивки показываются только если разблокированы
      if (a.hidden && un.indexOf(a.id) < 0) return;
      
      const y = visibleIndex * (rowH + gap);
      visibleIndex++;
      
      const c = this.add.container(W / 2, y);
      const p = Core.Achievements.progress(a, s);
      const done = un.indexOf(a.id) >= 0 || p.done;
      const rewarded = !!claimedMap[a.id];
      const reward = Core.Achievements.rewardFor(a.id);
      const rewardStr = Core.Achievements.rewardLabel(reward);
      const ic = this.iconOf(a.id);
      const canClaim = done && !rewarded;
      
      const card = this.add.graphics();
      card.fillStyle(0x1c1628, done ? 1 : 0.88); 
      card.fillRoundedRect(-rowW / 2, -rowH / 2, rowW, rowH, 14);
      if (canClaim) {
        card.lineStyle(3, 0xe8c874, 1); 
        card.strokeRoundedRect(-rowW / 2, -rowH / 2, rowW, rowH, 14);
      } else {
        card.lineStyle(2, done ? this.tierColor(ic[1]) : 0x3a3450, done ? 0.9 : 0.5); 
        card.strokeRoundedRect(-rowW / 2, -rowH / 2, rowW, rowH, 14);
      }
      c.add(card);
      
      if (canClaim) {
        this.tweens.add({ targets: card, alpha: 0.6, duration: 800, yoyo: true, repeat: -1, ease: 'Sine.InOut' });
      }
      
      this.drawAchBadge(c, -rowW / 2 + 48, 0, ic[0], ic[1], done);
      c.add(this.add.text(-rowW / 2 + 92, -22, a.title, { fontFamily: Core.FONT, fontSize: '18px', fontStyle: '400', color: done ? '#e8c874' : '#f5f0e6' }).setOrigin(0, 0.5).setResolution(1));
      c.add(this.add.text(-rowW / 2 + 92, -2, a.desc, { fontFamily: Core.FONT, fontSize: '12px', fontStyle: '400', color: '#9a8fb8' }).setOrigin(0, 0.5).setResolution(1));
      
      if (rewarded) {
        c.add(this.add.text(-rowW / 2 + 92, 18, '✓ ' + rewardStr, { fontFamily: Core.FONT, fontSize: '13px', fontStyle: '400', color: '#7c5cff' }).setOrigin(0, 0.5).setResolution(1));
      } else if (done) {
        c.add(this.add.text(-rowW / 2 + 92, 18, 'Награда: ' + rewardStr, { fontFamily: Core.FONT, fontSize: '13px', fontStyle: '400', color: '#e8c874' }).setOrigin(0, 0.5).setResolution(1));
      } else {
        c.add(this.add.text(-rowW / 2 + 92, 18, 'Награда: ' + rewardStr, { fontFamily: Core.FONT, fontSize: '13px', fontStyle: '400', color: '#6f6785' }).setOrigin(0, 0.5).setResolution(1));
      }
      
      // Награда всегда видна
      const rewardLine = rewarded ? '✓ ' + rewardStr : ('Награда: ' + rewardStr);
      c.add(this.add.text(-rowW / 2 + 92, 18, rewardLine, { fontFamily: Core.FONT, fontSize: '13px', fontStyle: '400', color: rewarded ? '#7c5cff' : (done ? '#e8c874' : '#6f6785') }).setOrigin(0, 0.5).setResolution(1));
      
      
      // Вся карточка кликабельна для забирания награды
      if (done && !rewarded) {
        const claimHit = this.add.rectangle(0, 0, rowW, rowH, 0xffffff, 0.1).setInteractive({ useHandCursor: true });
        c.add(claimHit);
        claimHit.on('pointerdown', () => {
          Core.Achievements.claim(a.id);
          Core.Audio.buy();
          this.renderList();
        });
      }
      
      c.add(this.add.text(rowW / 2 - 20, -22, (done ? '✓ ' : '') + p.cur + '/' + p.goal, { fontFamily: Core.FONT, fontSize: '13px', fontStyle: '400', color: done ? '#e8c874' : '#c9c2d8' }).setOrigin(1, 0.5).setResolution(1));      
      c.add(this.add.text(rowW / 2 - 20, -22, (done ? '✓ ' : '') + p.cur + '/' + p.goal, { fontFamily: Core.FONT, fontSize: '13px', fontStyle: '400', color: done ? '#e8c874' : '#c9c2d8' }).setOrigin(1, 0.5).setResolution(1));
      const barX = -rowW / 2 + 92, barY = 32, barW = rowW - 180, barH = 8;
      const track = this.add.graphics(); track.fillStyle(0x0a0a10, 1); track.fillRoundedRect(barX, barY - barH / 2, barW, barH, 4); c.add(track);
      const fillW = Math.max(0, Math.min(1, p.cur / p.goal)) * barW;
      if (fillW > 0) { const fg = this.add.graphics(); fg.fillStyle(done ? this.tierColor(ic[1]) : 0x7c5cff, 1); fg.fillRoundedRect(barX, barY - barH / 2, fillW, barH, 4); c.add(fg); }
      this.listContainer.add(c);
    });
    this.countText.setText(Core.Achievements.count() + ' / ' + Core.Achievements.list.length);

    const totalH = visibleIndex * (rowH + gap);
    const viewH = H - this.maskTop - 20;
    if (this.listMask) { this.listMask.destroy(); this.listMask = null; }
    const maskShape = this.make.graphics({ x: 0, y: this.maskTop });
    maskShape.fillRect(0, 0, W, viewH);
    this.listContainer.setMask(maskShape.createGeometryMask());
    this.listMask = maskShape;
    this.listContainer.y = this.listY;
    const minY = this.listY - Math.max(0, totalH - viewH);
    const maxY = this.listY;
    let dragging = false, startY = 0, startScrollY = 0;
    this.input.removeAllListeners('pointerdown');
    this.input.removeAllListeners('pointerup');
    this.input.removeAllListeners('pointermove');
    this.input.removeAllListeners('wheel');
    this.input.on('pointerdown', (p) => { if (p.y > this.maskTop) { dragging = true; startY = p.y; startScrollY = this.listContainer.y; } });
    this.input.on('pointerup', () => { dragging = false; });
    this.input.on('pointermove', (p) => { if (dragging) this.listContainer.y = Math.max(minY, Math.min(maxY, startScrollY + (p.y - startY))); });
    this.input.on('wheel', (p, objs, dx, dy) => { this.listContainer.y = Math.max(minY, Math.min(maxY, this.listContainer.y - dy * 0.5)); });
  }
}

class LevelMapScene extends Phaser.Scene {

    const W = this.scale.width, H = this.scale.height;

    const bg = this.add.graphics();
    bg.fillGradientStyle(0x0a0a10, 0x0a0a10, 0x161022, 0x161022, 1);
    bg.fillRect(0, 0, W, H);

    const back = this.add.text(20, 45, '←', { fontFamily: Core.FONT, fontSize: '54.6px', fontStyle: '900', color: '#f5f0e6' }).setOrigin(0, 0.5).setInteractive({ useHandCursor: true }).setResolution(1);
    back.on('pointerdown', () => this.scene.start('Menu'));
    this.add.text(W / 2, 45, 'УРОВНИ', Core.TextStyles.heading(30)).setOrigin(0.5).setResolution(1);
    this.coinLabel = Core.coinLabel(this, W - 20, 45, Core.SDK.get('coins', 0), { fontSize: 20, iconSize: 22, anchor: 'right' });
    this.gridContainer = this.add.container(0, 0);

    this.add.text(60, H - 60, '‹', { fontFamily: Core.FONT, fontSize: '41.6px', fontStyle: '900', color: '#f5f0e6' }).setOrigin(0.5).setResolution(1);
    this.prevBtn.setInteractive({ useHandCursor: true });
    const prevGfx = this.add.graphics();
    prevGfx.fillStyle(0x1c1628, 1);
    prevGfx.fillRoundedRect(30, H - 85, 60, 50, 14);
    prevGfx.lineStyle(2, 0xd4af37, 0.6);
    prevGfx.strokeRoundedRect(30, H - 85, 60, 50, 14);
    this.add.text(60, H - 60, '‹', { fontFamily: Core.FONT, fontSize: '41.6px', fontStyle: '900', color: '#f5f0e6' }).setOrigin(0.5).setResolution(1);
    this.prevBtn = this.add.rectangle(60, H - 60, 60, 50, 0xffffff, 0).setInteractive({ useHandCursor: true });
    this.prevBtn.on('pointerdown', () => { if (this.currentPage > 0) { this.currentPage--; this.renderPage(); } });
    
    const nextGfx = this.add.graphics();
    nextGfx.fillStyle(0x1c1628, 1);
    nextGfx.fillRoundedRect(W - 90, H - 85, 60, 50, 14);
    nextGfx.lineStyle(2, 0xd4af37, 0.6);
    nextGfx.strokeRoundedRect(W - 90, H - 85, 60, 50, 14);
    this.add.text(W - 60, H - 60, '›', { fontFamily: Core.FONT, fontSize: '41.6px', fontStyle: '900', color: '#f5f0e6' }).setOrigin(0.5).setResolution(1);
    this.nextBtn = this.add.rectangle(W - 60, H - 60, 60, 50, 0xffffff, 0).setInteractive({ useHandCursor: true });
    this.nextBtn.on('pointerdown', () => { this.currentPage++; this.renderPage(); });
    this.renderPage();
    this.cameras.main.fadeIn(250, 0, 0, 0);
  }
  renderPage() {
    this.gridContainer.removeAll(true);
    const W = this.scale.width, H = this.scale.height;
    const currentLevel = Core.SDK.get('level', 1);
    const bestStars = Core.SDK.get('bestStars', {});
    const bestScores = Core.SDK.get('bestScores', {});
    const perPage = 20, cols = 4;
    const startLevel = this.currentPage * perPage + 1;
    const cellW = 150, cellH = 150, gapX = 15, gapY = 15;
    const totalW = cols * cellW + (cols - 1) * gapX;
    const startX = (W - totalW) / 2 + cellW / 2;
    const startY = 150;
    for (let i = 0; i < perPage; i++) {
      const lvl = startLevel + i;
      const col = i % cols, row = Math.floor(i / cols);
      const x = startX + col * (cellW + gapX);
      const y = startY + row * (cellH + gapY);
      const locked = lvl > currentLevel;
      const done = lvl < currentLevel;
      const isCurrent = lvl === currentLevel;
      const stars = bestStars[lvl] || 0;
      const record = bestScores[lvl] || 0;
      const cell = this.add.container(x, y);
      let bgColor = 0x1c1628, strokeColor = 0x4a4460, strokeAlpha = 0.6;
      if (isCurrent) { strokeColor = 0xd4af37; strokeAlpha = 1; }
      else if (done) { strokeColor = 0xe8c874; strokeAlpha = 0.75; }
            const bg = this.add.graphics();
      bg.fillStyle(bgColor, 1);
      bg.fillRoundedRect(-cellW/2, -cellH/2, cellW, cellH, 18);
      bg.lineStyle(isCurrent ? 3 : 2, strokeColor, strokeAlpha);
      bg.strokeRoundedRect(-cellW/2, -cellH/2, cellW, cellH, 18);
      cell.add(bg);
      if (isCurrent) this.tweens.add({ targets: bg, alpha: 0.7, duration: 700, yoyo: true, repeat: -1, ease: 'Sine.InOut' });      if (locked) {
        cell.add(this.add.text(0, -8, 'LOCK', { fontFamily: Core.FONT, fontSize: '24px', fontStyle: '400', color: '#4a4460' }).setOrigin(0.5).setResolution(1));
      } else {
        cell.add(this.add.text(0, -34, String(lvl), {
          fontFamily: Core.FONT, fontSize: '38px', fontStyle: '400',
          color: isCurrent ? '#e8c874' : (done ? '#f5f0e6' : '#c9c2d8'),
          stroke: '#000000', strokeThickness: 3
        }).setOrigin(0.5).setResolution(1));
        for (let s = 0; s < 3; s++) {
          const on = s < stars;
          cell.add(this.add.text(-30 + s * 30, 8, '★', {
            fontFamily: Core.FONT, fontSize: '22px', fontStyle: '400',
            color: on ? '#e8c874' : '#3a3450'
          }).setOrigin(0.5).setResolution(1));
        }
        cell.add(this.add.text(0, 44, record ? ('РЕКОРД ★ ' + record) : 'РЕКОРДА НЕТ', {
          fontFamily: Core.FONT, fontSize: record ? '14px' : '12px', fontStyle: '400',
          color: record ? '#e8c874' : '#6f6785'
        }).setOrigin(0.5).setResolution(1));
        const hit = this.add.rectangle(0, 0, cellW, cellH, 0xffffff, 0).setInteractive({ useHandCursor: true });
        cell.add(hit);
        hit.on('pointerdown', () => { Core.Audio.select(); this.scene.start('BallSort', { level: lvl, mode: 'level' }); });
      }
      this.gridContainer.add(cell);
    }
    const totalPages = Math.max(1, Math.ceil(currentLevel / perPage));
    this.pageText.setText('Страница ' + (this.currentPage + 1) + ' / ' + totalPages);
    this.prevBtn.setAlpha(this.currentPage === 0 ? 0.3 : 1);
    this.nextBtn.setAlpha(this.currentPage >= totalPages - 1 ? 0.3 : 1);
  }
}

  buyUpgrade(key, cost) {

    if (coins < cost) { this.showToast('Не хватает монет'); return; }
    const up = Core.SDK.get('upgrades', {});
    if (up[key]) { this.showToast('Уже активно'); return; }
    up[key] = true;
    Core.SDK.save({ coins: coins - cost, upgrades: up });
    Core.Audio.buy();
    this.showToast('Улучшение куплено');

    this.skinContainer = this.content;

    this.ballTab = this.makeSubTab(W / 2 + 90, 210, 'ШАРЫ', 'balls');
    this.content.add([this.tubeTab.bg, this.tubeTab.lbl, this.ballTab.bg, this.ballTab.lbl]);

    const startY = 280, rowH = 82;
    if (this.skinTab === 'tubes') {
      const owned = Core.SDK.get('ownedSkins', ['classic']);
      const current = Core.SDK.get('currentSkin', 'classic');
      Object.keys(Core.Skins.tubes).forEach((k, i) => this.createSkinRow(k, Core.Skins.tubes[k], owned, current, startY + i * rowH, rowH - 12));

    updateSubTabs() {

      t.bg.clear();

    this.tweens.add({ targets: t, alpha: 0, y: H - 100, duration: 1400, delay: 900, onComplete: () => t.destroy() });
  }
}

class DailyArchiveScene extends Phaser.Scene {
  constructor() { super('DailyArchive'); }
  init() {
    this.seasonStart = 202611;
    this.monthKey = Math.max(pfTodayMonthKey(), this.seasonStart);
  }
  seasonNum(mk) { const y = Math.floor(mk / 100), m = mk % 100; return (y - 2026) * 12 + (m - 11) + 1; }
  claimedTiers() {
    const rewards = Core.SDK.get('monthlyRewards', {});
    const rec = rewards[this.monthKey];
    if (!rec) return [];
    if (rec.claimed) return rec.claimed;
    return rec.tier ? [String(rec.tier).toLowerCase()] : [];
  }
  create() {
    const W = this.scale.width, H = this.scale.height;
    this.cameras.main.setBackgroundColor('#0a0a10');
    const bg = this.add.graphics();
    bg.fillGradientStyle(0x0a0a10, 0x0a0a10, 0x161022, 0x161022, 1);
    bg.fillRect(0, 0, W, H);
    Core.Juice.ambient(this, 10, -1);
    const back = this.add.text(20, 45, '←', { fontFamily: Core.FONT, fontSize: '42px', fontStyle: '400', color: '#f5f0e6' }).setOrigin(0, 0.5).setInteractive({ useHandCursor: true }).setResolution(1);
    back.on('pointerdown', () => this.scene.start('Menu'));
    this.add.text(W / 2, 45, 'АРХИВ ВЫЗОВОВ', { fontFamily: Core.FONT, fontSize: '30px', fontStyle: '400', color: '#f5f0e6', stroke: '#000000', strokeThickness: 4 }).setOrigin(0.5).setResolution(1);
    this.prevBtn = this.add.text(W / 2 - 215, 108, '‹', { fontFamily: Core.FONT, fontSize: '40px', fontStyle: '400', color: '#f5f0e6' }).setOrigin(0.5).setInteractive({ useHandCursor: true }).setResolution(1);
    this.monthText = this.add.text(W / 2, 108, '', { fontFamily: Core.FONT, fontSize: '21px', fontStyle: '400', color: '#e8c874' }).setOrigin(0.5).setResolution(1);
    this.nextBtn = this.add.text(W / 2 + 215, 108, '›', { fontFamily: Core.FONT, fontSize: '40px', fontStyle: '400', color: '#f5f0e6' }).setOrigin(0.5).setInteractive({ useHandCursor: true }).setResolution(1);
    this.prevBtn.on('pointerdown', () => this.changeMonth(-1));
    this.nextBtn.on('pointerdown', () => this.changeMonth(1));
    this.progressText = this.add.text(W / 2, 158, '', { fontFamily: Core.FONT, fontSize: '24px', fontStyle: '400', color: '#e8c874', stroke: '#000000', strokeThickness: 3 }).setOrigin(0.5).setResolution(1);
    this.progressContainer = this.add.container(0, 0);
    this.gridContainer = this.add.container(0, 0);
    this.add.text(W / 2, H - 34, '★ пройдено · фиолетовый — доступно · LOCK — будущее', { fontFamily: Core.FONT, fontSize: '13px', fontStyle: '400', color: '#6f6785' }).setOrigin(0.5).setResolution(1);
    this.renderMonth();
    this.cameras.main.fadeIn(240, 0, 0, 0);
  }
  changeMonth(delta) {
    let y = Math.floor(this.monthKey / 100), m = this.monthKey % 100;
    m += delta;
    if (m < 1) { m = 12; y--; }
    if (m > 12) { m = 1; y++; }
    const mk = y * 100 + m;
    if (mk < this.seasonStart || mk > pfTodayMonthKey()) return;
    this.monthKey = mk;
    this.renderMonth();
  }
  renderMonth() {
    const W = this.scale.width;
    const gained = Core.autoClaimMonthly(this.monthKey);
    if (gained.length) this.showToast('Награда: ' + gained.map(t => t.label).join(' · '));
    const stars = pfMonthStars(this.monthKey);
    const hist = Core.SDK.get('dailyHistory', {});
    const rewards = Core.SDK.get('monthlyRewards', {});
    const claimed = this.claimedTiers();
    this.monthText.setText('СЕЗОН ' + this.seasonNum(this.monthKey) + ' · ' + pfMonthLabel(this.monthKey));
    this.progressText.setText('★ ' + stars + ' / 90');
    this.prevBtn.setAlpha(this.monthKey <= this.seasonStart ? 0.3 : 1);
    this.nextBtn.setAlpha(this.monthKey >= pfTodayMonthKey() ? 0.3 : 1);
    this.progressContainer.removeAll(true);
    const barW = 520, barH = 12, barX = (W - barW) / 2, barY = 198;
    this.progressContainer.add(this.add.rectangle(W / 2, barY, barW, barH, 0x0a0a10).setStrokeStyle(1, 0x3a3450, 0.9));
    const fillW = Math.min(1, stars / 90) * barW;
    if (fillW > 0) this.progressContainer.add(this.add.rectangle(barX + fillW / 2, barY, fillW, barH, 0xe8c874));
    [{ key: 'bronze', need: 30, color: 0xcd7f32 }, { key: 'silver', need: 60, color: 0xc0c0c0 }, { key: 'gold', need: 90, color: 0xe8c874 }].forEach(t => {
      const mx = barX + (t.need / 90) * barW;
      const reached = stars >= t.need;
      const isClaimed = claimed.indexOf(t.key) >= 0;
      this.progressContainer.add(this.add.circle(mx, barY, 9, isClaimed || reached ? t.color : 0x241a3a).setStrokeStyle(2, isClaimed ? 0xf5f0e6 : (reached ? t.color : 0x3a3450), 1));
      if (isClaimed) this.progressContainer.add(this.add.text(mx, barY, '✓', { fontFamily: Core.FONT, fontSize: '11px', fontStyle: '400', color: '#0a0a10' }).setOrigin(0.5).setResolution(1));
      this.progressContainer.add(this.add.text(mx, barY + 24, t.need + '★', { fontFamily: Core.FONT, fontSize: '12px', fontStyle: '400', color: reached ? '#e8c874' : '#6f6785' }).setOrigin(0.5).setResolution(1));
    });
    this.gridContainer.removeAll(true);
    const y = Math.floor(this.monthKey / 100), m = this.monthKey % 100;
    const days = pfDaysInMonth(this.monthKey);
    const firstWeekday = (new Date(y, m - 1, 1).getDay() + 6) % 7;
    const cellW = 88, cellH = 96, gap = 8;
    const totalW = 7 * cellW + 6 * gap;
    const startX = (W - totalW) / 2 + cellW / 2;
    const headerY = 264, gridY = 334;
    const names = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ', 'ВС'];
    const headPlate = this.add.graphics();
    headPlate.fillStyle(0x241a3a, 0.9);
    headPlate.fillRoundedRect(startX - cellW / 2 - 6, headerY - 21, totalW + 12, 42, 10);
    headPlate.lineStyle(1.5, 0x4a4460, 0.9);
    headPlate.strokeRoundedRect(startX - cellW / 2 - 6, headerY - 21, totalW + 12, 42, 10);
    this.gridContainer.add(headPlate);
    for (let col = 0; col < 7; col++) {
      this.gridContainer.add(this.add.text(startX + col * (cellW + gap), headerY, names[col], {
        fontFamily: Core.FONT, fontSize: '21px', fontStyle: '400',
        color: col >= 5 ? '#e8c874' : '#f2eefc',
        stroke: '#000000', strokeThickness: 3
      }).setOrigin(0.5).setResolution(1));
    }
    const today = todayStr();
    const totalCells = firstWeekday + days;
    for (let i = 0; i < totalCells; i++) {
      const col = i % 7, row = Math.floor(i / 7);
      const x = startX + col * (cellW + gap), cy = gridY + row * (cellH + gap);
      if (i < firstWeekday) {
        this.gridContainer.add(this.add.rectangle(x, cy, cellW, cellH, 0x14101f, 0.35).setStrokeStyle(1, 0x241a3a, 0.4));
        continue;
      }
      const day = i - firstWeekday + 1;
      const dateKey = this.monthKey * 100 + day;
      const rec = hist[dateKey];
      const future = dateKey > today;
      const isToday = dateKey === today;
      const done = !!rec;
      const c = this.add.container(x, cy);
      let fill = 0x1c1628, border = 0x7c5cff, borderAlpha = 0.45, numColor = '#c9c2d8';
      if (done) { border = 0xe8c874; borderAlpha = 0.95; numColor = '#f5f0e6'; }
      else if (isToday) { border = 0x7c5cff; borderAlpha = 1; numColor = '#e8c874'; }
      else if (future) { fill = 0x14101f; border = 0x3a3450; borderAlpha = 0.3; numColor = '#4a4460'; }
      const bg = this.add.graphics();
      bg.fillStyle(fill, 1);
      bg.fillRoundedRect(-cellW/2, -cellH/2, cellW, cellH, 14);
      bg.lineStyle(2, border, borderAlpha);
      bg.strokeRoundedRect(-cellW/2, -cellH/2, cellW, cellH, 14);
      c.add(bg);
      c.add(this.add.text(0, -32, String(day), { fontFamily: Core.FONT, fontSize: '23px', fontStyle: '400', color: numColor }).setOrigin(0.5).setResolution(1));
      if (done) {
        const bs = rec.bestStars || 0;
        c.add(this.add.text(0, -4, '★'.repeat(bs) + '☆'.repeat(3 - bs), { fontFamily: Core.FONT, fontSize: '15px', fontStyle: '400', color: '#e8c874' }).setOrigin(0.5).setResolution(1));
        c.add(this.add.text(0, 24, String(rec.bestScore || 0), { fontFamily: Core.FONT, fontSize: '13px', fontStyle: '400', color: '#9a8fb8' }).setOrigin(0.5).setResolution(1));
      } else if (future) {
        c.add(this.add.text(0, 6, 'LOCK', { fontFamily: Core.FONT, fontSize: '14px', fontStyle: '400', color: '#4a4460' }).setOrigin(0.5).setResolution(1));
      } else if (isToday) {
        c.add(this.add.text(0, 6, 'СЕГОДНЯ', { fontFamily: Core.FONT, fontSize: '11px', fontStyle: '400', color: '#7c5cff' }).setOrigin(0.5).setResolution(1));
        this.tweens.add({ targets: bg, alpha: 0.65, duration: 850, yoyo: true, repeat: -1, ease: 'Sine.InOut' });
      } else {
        c.add(this.add.text(0, 6, '▶', { fontFamily: Core.FONT, fontSize: '18px', fontStyle: '400', color: '#7c5cff' }).setOrigin(0.5).setAlpha(0.75).setResolution(1));
      }
        if (!future) {
        const hit = this.add.rectangle(0, 0, cellW, cellH, 0xffffff, 0).setInteractive({ useHandCursor: true });
        c.add(hit);
        hit.on('pointerdown', () => { Core.Audio.select(); this.scene.start('BallSort', { mode: 'daily', level: 0, seed: dateKey, dailyDate: dateKey }); });
      }
      this.gridContainer.add(c);
    }
  }
  showToast(msg) {
    const W = this.scale.width, H = this.scale.height;
    const t = this.add.text(W / 2, H - 70, msg, { fontFamily: Core.FONT, fontSize: '18px', fontStyle: '400', color: '#f5f0e6', backgroundColor: '#000000cc', padding: { x: 16, y: 10 } }).setOrigin(0.5).setDepth(1000).setResolution(1);
    this.tweens.add({ targets: t, alpha: 0, y: H - 100, duration: 1400, delay: 900, onComplete: () => t.destroy() });
  }
}
