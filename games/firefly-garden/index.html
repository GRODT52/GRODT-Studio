<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Firefly Garden</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #0a0e1a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #game { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #hud {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    left: 16px; right: 16px;
    display: flex; justify-content: space-between;
    color: #8fa0c0; font-size: 14px;
    pointer-events: none;
    letter-spacing: 0.3px;
    z-index: 10;
  }
  .hud-left, .hud-right { display: flex; flex-direction: column; gap: 4px; }
  .hud-left { flex-direction: row; align-items: center; gap: 8px; }
  .hud-right { align-items: flex-end; }
  #levelText, #scoreText { color: #d8e0f0; font-weight: 600; font-size: 15px; }
  #timerText, #statText { font-size: 13px; }

  .icon-btn {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(140,180,255,0.25);
    color: #c8d4ea;
    padding: 9px 12px;
    border-radius: 12px;
    font-size: 18px;
    line-height: 1;
    min-width: 42px;
    min-height: 42px;
    cursor: pointer;
    pointer-events: auto;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: background 0.15s, transform 0.08s, border-color 0.15s;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }
  .icon-btn:active { background: rgba(255,255,255,0.16); transform: scale(0.94); }

  .icon-btn.studio {
    color: #e2b857;
    border-color: rgba(226,184,87,0.35);
    font-size: 16px;
  }
  .icon-btn.studio:hover { border-color: rgba(226,184,87,0.6); }
  .icon-btn.studio:active { background: rgba(226,184,87,0.2); }

  .pop { animation: popText 0.42s cubic-bezier(.3,1.6,.5,1); }
  @keyframes popText {
    0% { transform: scale(1); }
    45% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }

  #combo {
    position: fixed;
    top: 28%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 56px;
    font-weight: 900;
    color: #ffd93d;
    text-shadow: 0 0 30px #ffd93d, 0 0 60px #ffd93d88;
    pointer-events: none;
    opacity: 0;
    z-index: 15;
    font-family: Georgia, serif;
  }
  #combo.show { animation: comboPop 0.7s cubic-bezier(.2,1.4,.4,1); }
  @keyframes comboPop {
    0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
    40% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }

  #controls {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    left: 0; right: 0;
    display: flex; justify-content: center; gap: 10px;
    z-index: 10;
  }
  #controls button, #win button, #menu button, .continue-btn {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(140,180,255,0.15);
    color: #c8d4ea;
    padding: 11px 18px;
    border-radius: 14px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: background 0.15s, transform 0.08s, opacity 0.2s;
  }
  #controls button:active, #win button:active, #menu button:active, .continue-btn:active {
    background: rgba(255,255,255,0.14); transform: scale(0.96);
  }
  button:disabled { opacity: 0.4; cursor: default; }

  #menu {
    position: fixed; inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(8,12,22,0.9);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 22;
    padding: 20px;
    animation: fade 0.3s ease;
  }
  #menu.show { display: flex; }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }

  .menu-content {
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: 440px;
    max-height: calc(100vh - 40px);
    animation: winIn 0.5s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes winIn {
    from { opacity: 0; transform: scale(0.82) translateY(14px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .menu-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 6px;
  }
  .menu-title-group { flex: 1; min-width: 0; }
  .menu-title {
    font-family: Georgia, serif;
    font-size: 28px;
    font-weight: 800;
    margin: 0 0 4px;
    color: #fff;
    letter-spacing: 0.02em;
    text-shadow: 0 0 30px rgba(180,220,255,0.5);
  }
  .menu-sub {
    color: #8fa0c0;
    margin: 0;
    font-size: 12.5px;
    line-height: 1.4;
  }

  .lang-switch {
    display: flex;
    gap: 2px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(140,180,255,0.15);
    border-radius: 10px;
    padding: 3px;
    flex-shrink: 0;
  }
  .lang-btn {
    background: transparent !important;
    border: none !important;
    color: #8fa0c0;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 8px !important;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, color 0.15s;
  }
  .lang-btn.active {
    background: rgba(140,180,255,0.22) !important;
    color: #fff;
  }

  .continue-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    margin: 16px 0 20px;
    padding: 14px 16px !important;
    background: linear-gradient(135deg, rgba(255,217,61,0.22), rgba(160,124,255,0.22)) !important;
    border: 1px solid rgba(255,217,61,0.4) !important;
    color: #fff !important;
    border-radius: 14px !important;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 0 20px rgba(255,217,61,0.15);
  }
  .continue-btn:hover { box-shadow: 0 0 28px rgba(255,217,61,0.3); }
  .continue-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,217,61,0.25);
    color: #ffd93d;
    font-size: 16px;
    flex-shrink: 0;
  }
  .continue-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
  }
  .continue-label {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
  }
  .continue-meta {
    font-size: 12px;
    color: #ffd93d;
    letter-spacing: 0.05em;
  }
  .continue-arrow {
    color: #ffd93d;
    font-size: 18px;
    font-weight: 700;
  }

  .menu-section {
    display: flex;
    flex-direction: column;
    min-height: 0;
    margin-bottom: 14px;
  }
  .menu-section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #8fa0c0;
    margin-bottom: 10px;
    font-weight: 600;
  }

  #levelGrid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    width: 100%;
    max-height: 38vh;
    overflow-y: auto;
    padding: 4px 4px 4px 0;
    scrollbar-width: thin;
    scrollbar-color: rgba(140,180,255,0.3) transparent;
  }
  #levelGrid::-webkit-scrollbar { width: 6px; }
  #levelGrid::-webkit-scrollbar-thumb { background: rgba(140,180,255,0.3); border-radius: 3px; }

  .level-cell {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(140,180,255,0.15);
    border-radius: 12px;
    cursor: pointer;
    color: #d8e0f0;
    font-weight: 700;
    font-size: 16px;
    transition: background 0.15s, border-color 0.15s, transform 0.08s;
    user-select: none;
    position: relative;
  }
  .level-cell:hover:not(.locked) { background: rgba(255,255,255,0.12); border-color: #a07cff; }
  .level-cell:active:not(.locked) { transform: scale(0.94); }
  .level-cell.locked { opacity: 0.25; cursor: default; }
  .level-cell.current {
    border-color: #ffd93d;
    background: rgba(255,217,61,0.12);
    box-shadow: 0 0 14px rgba(255,217,61,0.35);
  }
  .level-cell.current::after {
    content: '';
    position: absolute;
    top: 4px;
    right: 4px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #ffd93d;
    box-shadow: 0 0 6px #ffd93d;
    animation: pulseDot 1.5s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .level-stars { font-size: 9px; letter-spacing: 1px; line-height: 1; }
  .level-stars .on { color: #ffd93d; }
  .level-stars .off { color: rgba(255,255,255,0.15); }

  /* Кнопка «GRODT Studio» в меню */
  .studio-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    margin-bottom: 12px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(226,184,87,0.10), rgba(160,124,255,0.10));
    border: 1px solid rgba(226,184,87,0.28);
    color: #e2b857;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    transition: background 0.15s, transform 0.08s, border-color 0.15s, box-shadow 0.2s;
    box-shadow: 0 0 14px rgba(226,184,87,0.08);
  }
  .studio-link:hover {
    background: linear-gradient(135deg, rgba(226,184,87,0.18), rgba(160,124,255,0.18));
    border-color: rgba(226,184,87,0.55);
    box-shadow: 0 0 22px rgba(226,184,87,0.2);
  }
  .studio-link:active { transform: scale(0.98); }
  .studio-link-icon {
    font-size: 15px;
    color: #e2b857;
    text-shadow: 0 0 10px rgba(226,184,87,0.6);
  }
  .studio-link-text { flex: 1; }
  .studio-link-arrow {
    font-size: 14px;
    opacity: 0.7;
  }

  .menu-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 12px;
    border-top: 1px solid rgba(140,180,255,0.1);
    gap: 12px;
  }
  .progress-summary {
    font-size: 12px;
    color: #8fa0c0;
    letter-spacing: 0.02em;
  }
  .progress-summary b { color: #ffd93d; font-weight: 700; }
  .menu-tools {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .version-tag {
    font-size: 11px;
    color: rgba(143,160,192,0.6);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  #win {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column;
    background: rgba(8,12,22,0.82);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 20;
    animation: fade 0.35s ease;
  }
  #win.show { display: flex; }

  #win canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #win .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: winIn 0.55s cubic-bezier(.2,1.4,.4,1);
    padding: 0 24px;
    text-align: center;
  }

  #winStars {
    display: flex;
    gap: 14px;
    margin-bottom: 14px;
    font-size: 54px;
    line-height: 1;
  }
  #winStars span {
    color: rgba(255,255,255,0.12);
    display: inline-block;
  }
  #winStars span.filled {
    color: #ffd93d;
    text-shadow: 0 0 30px #ffd93d, 0 0 60px #ffd93d88;
    animation: starPop 0.5s cubic-bezier(.3,1.6,.5,1) both;
  }
  @keyframes starPop {
    0% { transform: scale(0) rotate(-45deg); opacity: 0; }
    60% { transform: scale(1.35) rotate(12deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  #win h1 {
    font-size: 32px; margin: 0 0 6px;
    color: #fff; font-weight: 600;
    animation: glowPulse 2.4s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { text-shadow: 0 0 30px rgba(180,220,255,0.45); }
    50% { text-shadow: 0 0 55px rgba(180,220,255,0.9), 0 0 95px rgba(140,180,255,0.4); }
  }
  #win p { color: #8fa0c0; margin: 0 0 14px; font-size: 15px; }
  #winScore {
    font-size: 17px;
    color: #d8e0f0;
    margin-bottom: 26px;
  }
  #winScore b { color: #ffd93d; font-size: 22px; }
  .newbest {
    display: inline-block;
    margin-left: 6px;
    color: #4ecdc4;
    font-weight: 700;
    font-size: 13px;
    animation: blink 1s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .win-buttons { display: flex; gap: 10px; align-items: center; }
  #win button.primary {
    padding: 15px 34px;
    font-size: 16px;
    background: rgba(140,180,255,0.18);
    border-color: rgba(140,180,255,0.35);
  }
  #win button.secondary {
    padding: 15px 20px;
    font-size: 14px;
  }
</style>
</head>
<body>
<div id="game"><canvas id="c"></canvas></div>
<div id="hud">
  <div class="hud-left">
    <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
    <a id="studioBtn" class="icon-btn studio" href="https://grodt52.github.io/GRODT-Studio/#games" target="_blank" rel="noopener" aria-label="GRODT Studio">←</a>
    <div>
      <div id="levelText">Уровень 1</div>
      <div id="timerText">0:00</div>
    </div>
  </div>
  <div class="hud-right">
    <div id="scoreText">0 очков</div>
    <div id="statText">0 / 3 пар</div>
  </div>
</div>
<div id="combo"></div>
<div id="controls">
  <button id="undoBtn">↶</button>
  <button id="resetBtn">↻</button>
  <button id="hintBtn">💡 3</button>
  <button id="soundBtn">🔊</button>
</div>

<div id="menu">
  <div class="menu-content">
    <div class="menu-header">
      <div class="menu-title-group">
        <h1 class="menu-title" data-i18n="title">Сад светлячков</h1>
        <p class="menu-sub" data-i18n="subtitle">Соединяй точки · длиннее путь — больше очков</p>
      </div>
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>

    <button id="menuPlayBtn" class="continue-btn">
      <span class="continue-icon">▶</span>
      <span class="continue-text">
        <span class="continue-label">Продолжить</span>
        <span class="continue-meta" id="continueMeta">Уровень 1</span>
      </span>
      <span class="continue-arrow">→</span>
    </button>

    <div class="menu-section">
      <div class="menu-section-title" data-i18n="chooseLevel">Выбери уровень</div>
      <div id="levelGrid"></div>
    </div>

    <a id="studioLink" class="studio-link" href="https://grodt52.github.io/GRODT-Studio/#games" target="_blank" rel="noopener">
      <span class="studio-link-icon">✦</span>
      <span class="studio-link-text" data-i18n="studioLink">GRODT Studio — другие игры</span>
      <span class="studio-link-arrow">↗</span>
    </a>

    <div class="menu-footer">
      <div class="progress-summary" id="progressSummary"></div>
      <div class="menu-tools">
        <button id="menuSoundBtn" class="icon-btn" aria-label="Sound">🔊</button>
        <span class="version-tag" id="versionLabel">v1.2.0</span>
      </div>
    </div>
  </div>
</div>

<div id="win">
  <canvas id="wc"></canvas>
  <div class="content">
    <div id="winStars"><span>★</span><span>★</span><span>★</span></div>
    <h1 data-i18n="winTitle">Сад расцвёл ✨</h1>
    <p id="winSub">все светлячки нашли друг друга</p>
    <div id="winScore">Очки: <b>0</b></div>
    <div class="win-buttons">
      <button id="nextBtn" class="primary">Дальше →</button>
      <button id="winMenuBtn" class="secondary">В меню</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

const APP_VERSION = '1.2.0';
const STUDIO_URL = 'https://grodt52.github.io/GRODT-Studio/#games';

const I18N = {
  ru: {
    title: 'Сад светлячков',
    subtitle: 'Соединяй точки · длиннее путь — больше очков',
    continue: 'Продолжить',
    chooseLevel: 'Выбери уровень',
    studioLink: 'GRODT Studio — другие игры',
    level: 'Уровень',
    score: 'очков',
    pairs: 'пар',
    next: 'Дальше',
    inMenu: 'В меню',
    winTitle: 'Сад расцвёл ✨',
    winSubs: [
      'все светлячки нашли друг друга',
      'ни одна искорка не потерялась',
      'сад светится от края до края',
      'тихая ночь, тёплый свет',
    ],
    allCrystalsWon: 'все светлячки и кристаллы найдены',
    newRecord: 'НОВЫЙ РЕКОРД!',
    points: 'Очки:',
    length: 'длина:',
    allCrystals: 'ВСЕ КРИСТАЛЛЫ!',
    totalStars: 'Звёзды',
    version: 'v',
    sound: 'Звук',
    studioLabel: 'GRODT Studio',
  },
  en: {
    title: 'Firefly Garden',
    subtitle: 'Connect the pairs · longer path — more points',
    continue: 'Continue',
    chooseLevel: 'Choose level',
    studioLink: 'GRODT Studio — more games',
    level: 'Level',
    score: 'pts',
    pairs: 'pairs',
    next: 'Next',
    inMenu: 'Menu',
    winTitle: 'The garden blooms ✨',
    winSubs: [
      'all fireflies found each other',
      'not a single spark was lost',
      'the garden glows from edge to edge',
      'quiet night, warm light',
    ],
    allCrystalsWon: 'all fireflies and crystals found',
    newRecord: 'NEW RECORD!',
    points: 'Score:',
    length: 'length:',
    allCrystals: 'ALL CRYSTALS!',
    totalStars: 'Stars',
    version: 'v',
    sound: 'Sound',
    studioLabel: 'GRODT Studio',
  },
};

const COLORS = ['#ff5c9d', '#4ecdc4', '#ffd93d', '#a78bfa', '#ff9f43', '#5dd39e'];
const DIRS = [[0,1],[1,0],[0,-1],[-1,0]];
const PENTA = [0, 2, 4, 7, 9];
const CRYSTAL_COLOR = '#9df0ff';
const POINTS_PER_CELL = 12;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let cellSize = 0, gridX = 0, gridY = 0;

const state = {
  n: 5, endpoints: {}, paths: {}, colorOf: {}, pop: {},
  dragging: null, level: 1, dragSnapshot: null,
  crystals: [], collectedCrystals: new Set(), garden: [],
  score: 0, combo: 0, lastConnectTime: 0, hintsLeft: 3,
  undoCount: 0, trimCount: 0, hintCell: null, floaters: [], startTime: 0,
  scoredPairs: new Set(),
  lang: 'ru',
  highestUnlocked: 1,
};

let currentPuzzle = null;
let undoStack = [];
let particles = [], ripples = [], ambient = [];
let shake = 0, flash = 0, flashCol = [255,255,255], introT = 0;
let hoverCell = null, lastTick = 0, lastDeny = 0, soundOn = true;
let lastHudMs = 0, lastTimerStr = '';
let pauseStart = 0;

const t = (key) => I18N[state.lang][key];
const manhattan = (a, b) => Math.abs(a.x-b.x) + Math.abs(a.y-b.y);
const clone = (o) => JSON.parse(JSON.stringify(o));
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const easeOutBack = v => { const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(v-1,3)+c1*Math.pow(v-1,2); };
function hexToRgb(hex){ const h=hex.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }

function stepToward(from, to) {
  const dx = Math.sign(to.x - from.x), dy = Math.sign(to.y - from.y);
  if (Math.abs(to.x - from.x) >= Math.abs(to.y - from.y)) return { x: from.x + dx, y: from.y };
  return { x: from.x, y: from.y + dy };
}
function roundRect(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function pointOnPolyline(pts, u) {
  let total = 0; const segs = [];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y); segs.push(d); total += d; }
  if (total <= 0) return null;
  let target = u * total;
  for (let i = 0; i < segs.length; i++) {
    if (target <= segs[i]) { const k = segs[i]===0?0:target/segs[i];
      return { x: pts[i].x+(pts[i+1].x-pts[i].x)*k, y: pts[i].y+(pts[i+1].y-pts[i].y)*k }; }
    target -= segs[i];
  }
  return pts[pts.length-1];
}

function randomHamiltonian(n) {
  const path = [];
  for (let y=0;y<n;y++){ const xs=[]; for(let x=0;x<n;x++)xs.push(x); if(y%2===1)xs.reverse(); for(const x of xs)path.push({x,y}); }
  const total=n*n; const cellToIdx=new Int32Array(total);
  for(let i=0;i<path.length;i++)cellToIdx[path[i].y*n+path[i].x]=i;
  for(let iter=0;iter<1500;iter++){
    const end=path[path.length-1]; const [dx,dy]=DIRS[(Math.random()*4)|0];
    const nx=end.x+dx, ny=end.y+dy;
    if(nx<0||ny<0||nx>=n||ny>=n)continue;
    const k=cellToIdx[ny*n+nx]; if(k===path.length-2)continue;
    const np=[]; for(let i=0;i<=k;i++)np.push(path[i]); for(let i=path.length-1;i>k;i--)np.push(path[i]);
    for(let i=0;i<np.length;i++)cellToIdx[np[i].y*n+np[i].x]=i;
    path.length=0; for(const p of np)path.push(p);
  }
  return path;
}

function splitPath(path, numPairs, minLen) {
  const total = path.length;
  if (total < numPairs*minLen) return null;
  for (let attempt=0;attempt<300;attempt++){
    const positions=[]; for(let i=1;i<total;i++)positions.push(i);
    for(let i=positions.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [positions[i],positions[j]]=[positions[j],positions[i]]; }
    const chosen=[];
    for(const p of positions){ if(chosen.length===numPairs-1)break; let ok=true;
      for(const c of chosen){ if(Math.abs(c-p)<minLen){ok=false;break;} } if(ok)chosen.push(p); }
    if(chosen.length<numPairs-1)continue; chosen.sort((a,b)=>a-b);
    if(chosen[0]<minLen)continue; if(total-chosen[chosen.length-1]<minLen)continue;
    const segs=[]; let start=0; for(const c of chosen){segs.push(path.slice(start,c));start=c;} segs.push(path.slice(start));
    if(segs.some(s=>s.length<minLen))continue;
    return segs;
  }
  return null;
}

function generateCrystals(n, endpoints) {
  const occ=new Set();
  for(const id in endpoints)for(const e of endpoints[id])occ.add(e.y*n+e.x);
  const cand=[]; for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!occ.has(y*n+x))cand.push({x,y});
  for(let i=cand.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[cand[i],cand[j]]=[cand[j],cand[i]];}
  const chosen=[]; const count=Math.min(3,cand.length);
  for(const c of cand){ if(chosen.length>=count)break; let ok=true;
    for(const o of chosen)if(manhattan(o,c)<2){ok=false;break;} if(ok)chosen.push(c); }
  return chosen;
}

function difficultyFor(level){
  if(level<=2)return{n:4,pairs:2};
  if(level<=4)return{n:5,pairs:3};
  if(level<=8)return{n:6,pairs:3};
  if(level<=14)return{n:6,pairs:4};
  if(level<=20)return{n:7,pairs:4};
  return{n:7,pairs:5};
}

function generatePuzzle(level){
  const {n,pairs}=difficultyFor(level);
  let segments=null,attempts=0;
  while(!segments&&attempts<30){segments=splitPath(randomHamiltonian(n),pairs,3);attempts++;}
  if(!segments){const path=randomHamiltonian(n);segments=[];const segLen=Math.floor(path.length/pairs);
    for(let i=0;i<pairs;i++){const s=i*segLen;const e=i===pairs-1?path.length:s+segLen;segments.push(path.slice(s,e));}}
  const pool=COLORS.slice();
  for(let i=pool.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[pool[i],pool[j]]=[pool[j],pool[i]];}
  const endpoints={},colorOf={};
  segments.forEach((seg,i)=>{endpoints[i]=[seg[0],seg[seg.length-1]];colorOf[i]=pool[i%pool.length];});
  const crystals=generateCrystals(n,endpoints);
  return {n,endpoints,colorOf,crystals};
}

function saveHighest() {
  try { localStorage.setItem('firefly_highest', String(state.highestUnlocked)); } catch(e) {}
}

function startLevel(level, puzzle) {
  state.level = level;
  if (!puzzle) puzzle = generatePuzzle(level);
  currentPuzzle = puzzle;
  state.n = puzzle.n;
  state.endpoints = clone(puzzle.endpoints);
  state.colorOf = { ...puzzle.colorOf };
  state.paths = {}; state.pop = {};
  for (const id in state.endpoints) state.paths[id] = [];
  state.dragging = null; state.dragSnapshot = null;
  state.crystals = puzzle.crystals ? clone(puzzle.crystals) : [];
  state.collectedCrystals = new Set();
  state.scoredPairs = new Set();
  state.garden = []; state.score = 0; state.combo = 0; state.lastConnectTime = 0;
  state.hintsLeft = 3; state.undoCount = 0; state.trimCount = 0;
  state.hintCell = null; state.floaters = []; state.startTime = performance.now();
  pauseStart = 0;
  undoStack = []; particles = []; ripples = [];
  shake = 0; flash = 0; introT = 0; lastTimerStr = '';
  layout(); hideWin(); updateHud();
  blip(noteFreq(3), 0.35, 'sine', 0.05, 0, 1.02);
  blip(noteFreq(6), 0.45, 'sine', 0.045, 0.1, 1.02);
}
function resetLevel(){ blip(300,0.18,'sine',0.06,0,0.55); addShake(2); startLevel(state.level, currentPuzzle); }

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=canvas.clientWidth; H=canvas.clientHeight;
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout(); initAmbient();
}
function layout(){
  const topPad=80,bottomPad=90;
  const availW=W-40, availH=H-topPad-bottomPad;
  const size=Math.max(100,Math.min(availW,availH));
  cellSize=size/state.n;
  gridX=(W-size)/2;
  gridY=topPad+(availH-size)/2;
}

function cellAt(px,py){
  const x=Math.floor((px-gridX)/cellSize);
  const y=Math.floor((py-gridY)/cellSize);
  if(x<0||y<0||x>=state.n||y>=state.n)return null;
  return {x,y};
}

function isColorConnected(colorId){
  const path=state.paths[colorId];
  if(!path||path.length<2)return false;
  const [a,b]=state.endpoints[colorId];
  const f=path[0],l=path[path.length-1];
  const fA=f.x===a.x&&f.y===a.y, fB=f.x===b.x&&f.y===b.y;
  const lA=l.x===a.x&&l.y===a.y, lB=l.x===b.x&&l.y===b.y;
  return (fA&&lB)||(fB&&lA);
}
function isCellBlocked(x,y,colorId){
  for(const other in state.endpoints){
    if(+other===colorId)continue;
    const [a,b]=state.endpoints[other];
    if((a.x===x&&a.y===y)||(b.x===x&&b.y===y))return true;
  }
  for(const other in state.paths){
    if(+other===colorId)continue;
    for(const p of state.paths[other])if(p.x===x&&p.y===y)return true;
  }
  return false;
}
function isOwnPathCell(x,y,colorId){
  const path=state.paths[colorId]; if(!path)return false;
  for(const p of path)if(p.x===x&&p.y===y)return true;
  return false;
}

function onPointerDown(px,py){
  ensureAudio();
  const cell=cellAt(px,py); if(!cell)return;
  addRipple(px,py,cellSize*0.9,'rgba(160,200,255,0.45)');
  state.dragSnapshot={paths:clone(state.paths)};
  for(const id in state.endpoints){
    const [a,b]=state.endpoints[id];
    if((a.x===cell.x&&a.y===cell.y)||(b.x===cell.x&&b.y===cell.y)){
      const path=state.paths[id]||[];
      if(path.length>0){
        const f=path[0],l=path[path.length-1];
        if(f.x===cell.x&&f.y===cell.y)state.paths[id]=[f];
        else if(l.x===cell.x&&l.y===cell.y)state.paths[id]=[l];
        else state.paths[id]=[cell];
      } else state.paths[id]=[cell];
      state.dragging={color:+id};
      blip(noteFreq(+id),0.14,'triangle',0.07);
      sparkle(px,py,state.colorOf[id],7,90);
      return;
    }
  }
  for(const id in state.paths){
    const path=state.paths[id];
    for(let i=0;i<path.length;i++){
      if(path[i].x===cell.x&&path[i].y===cell.y){
        if(i<path.length-1)state.trimCount++;
        state.paths[id]=path.slice(0,i+1);
        state.dragging={color:+id};
        blip(520,0.1,'sine',0.05);
        return;
      }
    }
  }
}

function onPointerMove(px,py){
  const target=cellAt(px,py);
  hoverCell=target;
  if(!state.dragging)return;
  if(!target)return;
  const colorId=state.dragging.color;
  let safety=0;
  while(safety++<60){
    if(!state.dragging)return;
    const path=state.paths[colorId];
    if(!path||path.length===0)return;
    const last=path[path.length-1];
    if(last.x===target.x&&last.y===target.y)return;
    let next;
    if(manhattan(last,target)===1)next=target;
    else{next=stepToward(last,target);if(next.x===last.x&&next.y===last.y)return;}
    const idx=path.findIndex(p=>p.x===next.x&&p.y===next.y);
    if(idx>=0&&idx<path.length-1){state.paths[colorId]=path.slice(0,idx+1);state.trimCount++;blip(280,0.09,'sine',0.05);return;}
    if(idx===path.length-1)return;
    if(isCellBlocked(next.x,next.y,colorId)){deny(next);return;}
    const [ea,eb]=state.endpoints[colorId];
    const start=path[0];
    const otherEnd=(start.x===ea.x&&start.y===ea.y)?eb:ea;
    if(next.x===otherEnd.x&&next.y===otherEnd.y){
      const wasConnected=isColorConnected(colorId);
      state.paths[colorId].push(next);
      if(!wasConnected)onPairComplete(colorId);
      state.dragging=null; updateHud(); checkWin();
      return;
    }
    state.paths[colorId].push(next);

    const key=next.y*state.n+next.x;
    const nearCrystal=state.crystals.some(c=>c.x===next.x&&c.y===next.y)&&!state.collectedCrystals.has(key);
    const cx=gridX+(next.x+0.5)*cellSize, cy=gridY+(next.y+0.5)*cellSize;
    if(nearCrystal) sparkle(cx,cy,CRYSTAL_COLOR,3,40);
    sparkle(cx,cy,state.colorOf[colorId],2,55);
    tickSound();
  }
}

function onPointerUp(){
  if(state.dragSnapshot){
    if(JSON.stringify(state.paths)!==JSON.stringify(state.dragSnapshot.paths)){
      undoStack.push(state.dragSnapshot);
      if(undoStack.length>40)undoStack.shift();
    }
    state.dragSnapshot=null;
  }
  state.dragging=null;
}

function tickSound(){
  const now=performance.now(); if(now-lastTick<45)return;
  lastTick=now; blip(760+Math.random()*160,0.05,'sine',0.022);
}
function deny(cell){
  const now=performance.now(); if(now-lastDeny<140)return;
  lastDeny=now;
  blip(95,0.1,'sawtooth',0.045,0,0.7); addShake(1.4);
  const cx=gridX+(cell.x+0.5)*cellSize, cy=gridY+(cell.y+0.5)*cellSize;
  addRipple(cx,cy,cellSize*0.75,'rgba(255,110,110,0.6)');
}
function addShake(v){ shake=Math.min(shake+v,14); }
function sparkle(x,y,color,count,spd=120){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2, s=spd*(0.3+Math.random());
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:1.4+Math.random()*1.4,color,size:1.4+Math.random()*2.2,grav:0});
  }
}
function addRipple(x,y,max,color){ ripples.push({x,y,r:0,max,life:1,color}); }
function addScore(amount,cell,color){
  state.score+=amount;
  const px=gridX+(cell.x+0.5)*cellSize, py=gridY+(cell.y+0.5)*cellSize;
  addFloater(px,py,'+'+amount,color||'#fff',20);
}
function addFloater(x,y,text,color,size){ state.floaters.push({x,y,text,color,size:size||20,life:1.4,vy:-70}); }

function onPairComplete(colorId){
  const now = performance.now();
  const path = state.paths[colorId];
  const pathLength = path.length;

  for (const cell of path) {
    const key = cell.y * state.n + cell.x;
    if (state.collectedCrystals.has(key)) continue;
    if (!state.crystals.some(c => c.x === cell.x && c.y === cell.y)) continue;
    state.collectedCrystals.add(key);
    addScore(50, cell, CRYSTAL_COLOR);
    sparkle(gridX+(cell.x+0.5)*cellSize, gridY+(cell.y+0.5)*cellSize, CRYSTAL_COLOR, 10, 140);
    playChord([noteFreq(10), noteFreq(12), noteFreq(14)], 0.4);
    if (state.crystals.length > 0 && state.collectedCrystals.size === state.crystals.length) {
      addFloater(gridX+(cell.x+0.5)*cellSize, gridY+(cell.y+0.5)*cellSize-30, t('allCrystals'), CRYSTAL_COLOR, 22);
    }
  }

  if (!state.scoredPairs.has(colorId)) {
    state.scoredPairs.add(colorId);
    if (state.lastConnectTime > 0 && now - state.lastConnectTime < 2500) state.combo++;
    else state.combo = 1;
    state.lastConnectTime = now;

    const multiplier = Math.min(3, 1 + (state.combo - 1) * 0.5);
    const baseGain = pathLength * POINTS_PER_CELL;
    const gain = Math.round(baseGain * multiplier);
    const mid = path[Math.floor(path.length / 2)];
    const mx = gridX + (mid.x + 0.5) * cellSize;
    const my = gridY + (mid.y + 0.5) * cellSize;

    addScore(gain, mid, state.colorOf[colorId]);
    if (pathLength >= 4) addFloater(mx, my - 28, `${t('length')} ${pathLength}`, '#9dc6ff', 13);
    if (state.combo >= 2) showCombo(state.combo);

    triggerBloom(colorId);
    bloomFlower(colorId);
  }
}

function showCombo(n){
  const el=document.getElementById('combo');
  el.textContent='×'+n;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}

function undo(){
  if(undoStack.length===0)return;
  const snap=undoStack.pop();
  state.paths=snap.paths; state.pop={}; state.dragging=null; state.undoCount++;
  blip(420,0.14,'sine',0.06,0,0.7); addShake(1.5); updateHud();
}

function doHint(){
  if(state.hintsLeft<=0)return;
  let targetColor=-1;
  for(const id in state.endpoints){
    if(!isColorConnected(+id)&&state.paths[id]&&state.paths[id].length>0){targetColor=+id;break;}
  }
  if(targetColor===-1){
    for(const id in state.endpoints){
      if(!isColorConnected(+id)){
        const [a]=state.endpoints[id];
        state.hintCell={x:a.x,y:a.y,until:performance.now()+2500};
        state.hintsLeft--; updateHud(); blip(660,0.2); return;
      }
    }
    return;
  }
  const path=state.paths[targetColor];
  const last=path[path.length-1];
  const [ea,eb]=state.endpoints[targetColor];
  const start=path[0];
  const otherEnd=(start.x===ea.x&&start.y===ea.y)?eb:ea;
  for(const [dx,dy] of DIRS){
    const nx=last.x+dx, ny=last.y+dy;
    if(nx<0||ny<0||nx>=state.n||ny>=state.n)continue;
    if(isCellBlocked(nx,ny,targetColor))continue;
    if(isOwnPathCell(nx,ny,targetColor)&&!(nx===otherEnd.x&&ny===otherEnd.y))continue;
    state.hintCell={x:nx,y:ny,until:performance.now()+2500};
    state.hintsLeft--; updateHud(); blip(880,0.25); return;
  }
  state.hintCell={x:last.x,y:last.y,until:performance.now()+2500};
  state.hintsLeft--; updateHud();
}

function popEl(el){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
function updateHud(){
  const lvlEl=document.getElementById('levelText');
  const pairsEl=document.getElementById('statText');
  const scoreEl=document.getElementById('scoreText');
  const hintBtn=document.getElementById('hintBtn');
  const lvlStr = `${t('level')} ${state.level}`;
  if(lvlEl.textContent!==lvlStr){lvlEl.textContent=lvlStr;popEl(lvlEl);}
  let connected=0,total=0;
  for(const id in state.endpoints){total++;if(isColorConnected(+id))connected++;}
  const ps = `${connected} / ${total} ${t('pairs')}`;
  if(pairsEl.textContent!==ps){pairsEl.textContent=ps;popEl(pairsEl);}
  const ss = `${state.score} ${t('score')}`;
  if(scoreEl.textContent!==ss)scoreEl.textContent=ss;
  hintBtn.textContent=`💡 ${state.hintsLeft}`;
  hintBtn.disabled=state.hintsLeft<=0;
}
function updateTimer(){

  if(s!==lastTimerStr){lastTimerStr=s;document.getElementById('timerText').textContent=s;}
}
function checkWin(){

}

function buildLevelGrid() {
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  const maxUnlocked = state.highestUnlocked;
  const showUpTo = Math.max(maxUnlocked + 2, 12);
  for (let i = 1; i <= showUpTo; i++) {
    const stars = parseInt(localStorage.getItem(`firefly_stars_${i}`), 10) || 0;
    const locked = i > maxUnlocked;
    const cell = document.createElement('div');
    cell.className = 'level-cell' + (locked ? ' locked' : '') + (i === state.level ? ' current' : '');
    const starsHtml = [0,1,2].map(k => `<span class="${k < stars ? 'on' : 'off'}">★</span>`).join('');
    cell.innerHTML = `<div>${i}</div><div class="level-stars">${starsHtml}</div>`;
    if (!locked) {
      cell.addEventListener('click', () => {
        blip(noteFreq(4), 0.18, 'sine', 0.07, 0, 1.2);
        hideMenu();
        if (i !== state.level) startLevel(i);
      });
    }
    grid.appendChild(cell);
  }
}

const wc=document.getElementById('wc');
const wctx=wc.getContext('2d');
let winParts=[],winRAF=0,winRunning=false,winLast=0;

function sizeWinCanvas(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  wc.width=Math.round(window.innerWidth*dpr);
  wc.height=Math.round(window.innerHeight*dpr);
  wctx.setTransform(dpr,0,0,dpr,0,0);
}
function winLoop(now){
  const dt=Math.min((now-winLast)/1000,0.05); winLast=now;
  const w=window.innerWidth,h=window.innerHeight;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  wctx.setTransform(dpr,0,0,dpr,0,0); wctx.clearRect(0,0,w,h);
  for(let i=winParts.length-1;i>=0;i--){
    const p=winParts[i];
    p.vy+=420*dt; p.vx*=0.995; p.x+=p.vx*dt; p.y+=p.vy*dt; p.rot+=p.vr*dt; p.life-=dt*0.26;
    if(p.life<=0||p.y>h+70){winParts.splice(i,1);continue;}
    wctx.save(); wctx.globalAlpha=clamp(p.life,0,1); wctx.translate(p.x,p.y); wctx.rotate(p.rot);
    wctx.fillStyle=p.color; wctx.shadowBlur=14; wctx.shadowColor=p.color;
    wctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.55); wctx.restore();
  }
  if(winRunning)winRAF=requestAnimationFrame(winLoop);
}
function showWin(){
  const L = I18N[state.lang];
  const allCrystals = state.crystals.length === 0 || state.collectedCrystals.size === state.crystals.length;
  const noMistakes = state.undoCount===0 && state.trimCount===0;
  let stars=1;
  if(noMistakes && allCrystals) stars=3;
  else if(noMistakes || allCrystals) stars=2;
  const elapsed=(performance.now()-state.startTime)/1000;
  const timeBonus=Math.max(0,Math.round(300-elapsed*5));
  state.score+=timeBonus;
  const key=`firefly_best_${state.level}`;
  const prevBest=parseInt(localStorage.getItem(key),10)||0;
  const newBest=state.score>prevBest;
  if(newBest){try{localStorage.setItem(key,String(state.score));}catch(e){}}
  const starsKey=`firefly_stars_${state.level}`;
  const prevStars=parseInt(localStorage.getItem(starsKey),10)||0;
  if(stars>prevStars){try{localStorage.setItem(starsKey,String(stars));}catch(e){}}

  if (state.level + 1 > state.highestUnlocked) {
    state.highestUnlocked = state.level + 1;
    saveHighest();
  }

  document.getElementById('winSub').textContent = allCrystals ? L.allCrystalsWon : L.winSubs[(Math.random()*L.winSubs.length)|0];
  document.getElementById('winScore').innerHTML = `${L.points} <b>${state.score}</b>${newBest?' <span class="newbest">'+L.newRecord+'</span>':''}`;
  const starEls=document.querySelectorAll('#winStars span');
  starEls.forEach((el,i)=>{
    el.classList.remove('filled');
    el.style.animationDelay=(0.25+i*0.15)+'s';
    if(i<stars){void el.offsetWidth;el.classList.add('filled');}
  });
  document.getElementById('win').classList.add('show');
  pauseTimer();
  sizeWinCanvas(); winParts=[];
  const w=window.innerWidth,h=window.innerHeight;
  const cols=COLORS.concat(['#ffffff','#cfe3ff',CRYSTAL_COLOR]);
  for(let i=0;i<150;i++){
    const fromSide=Math.random()<0.5;
    winParts.push({
      x:fromSide?(Math.random()<0.5?-20:w+20):Math.random()*w,
      y:h*0.10+Math.random()*h*0.35,
      vx:(fromSide?(Math.random()*2-0.5):(Math.random()-0.5))*260,
      vy:-230-Math.random()*260,
      rot:Math.random()*Math.PI*2, vr:(Math.random()-0.5)*11,
      s:5+Math.random()*9, color:cols[(Math.random()*cols.length)|0], life:1.3+Math.random()*0.8,
    });
  }
  winRunning=true; winLast=performance.now(); cancelAnimationFrame(winRAF); winRAF=requestAnimationFrame(winLoop);
  playWinFanfare(); vibrate([20,50,20,50,90]);
  flashCol=[200,230,255]; flash=1; addShake(5);
}
function hideWin(){

}

function triggerBloom(colorId){
  const [a,b]=state.endpoints[colorId];
  const color=state.colorOf[colorId];
  for(const e of [a,b]){
    const px=gridX+(e.x+0.5)*cellSize, py=gridY+(e.y+0.5)*cellSize;
    for(let i=0;i<26;i++){
      const ang=Math.random()*Math.PI*2, spd=50+Math.random()*230;
      particles.push({x:px,y:py,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,life:1,decay:0.9+Math.random()*1.1,color,size:2+Math.random()*3.2,grav:0});
    }
    addRipple(px,py,cellSize*1.8,color);
  }
  state.pop[colorId]=1; addShake(3.5);
  flashCol=hexToRgb(color); flash=1;
  blip(noteFreq(colorId*2),0.22,'triangle',0.085);
  blip(noteFreq(colorId*2+2),0.34,'sine',0.075,0.09);
  vibrate(18);
}
function bloomFlower(colorId){
  const path=state.paths[colorId]; if(!path||path.length<2)return;
  const mid=path[Math.floor(path.length/2)];
  const px=gridX+(mid.x+0.5)*cellSize, py=gridY+(mid.y+0.5)*cellSize;
  state.garden.push({
    x:px+(Math.random()-0.5)*cellSize*0.5,
    y:py+(Math.random()-0.5)*cellSize*0.5,
    color:state.colorOf[colorId], size:cellSize*(0.4+Math.random()*0.15),
    phase:Math.random()*Math.PI*2, alpha:0, targetAlpha:0.5,
  });
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.vy+=(p.grav||0)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vx*=0.94; p.vy*=0.94; p.life-=dt*p.decay;
    if(p.life<=0)particles.splice(i,1);
  }
}
function updateRipples(dt){
  for(let i=ripples.length-1;i>=0;i--){
    const r=ripples[i]; r.life-=dt*1.9; r.r+=(r.max-r.r)*dt*9;
    if(r.life<=0)ripples.splice(i,1);
  }
}
function updateFloaters(dt){
  for(let i=state.floaters.length-1;i>=0;i--){
    const f=state.floaters[i]; f.y+=f.vy*dt; f.vy*=0.96; f.life-=dt*0.9;
    if(f.life<=0)state.floaters.splice(i,1);
  }
}
function updateGarden(dt){
  for(const f of state.garden)f.alpha+=(f.targetAlpha-f.alpha)*Math.min(1,dt*6);
}

function initAmbient(){
  const count=Math.round((W*H)/45000);
  ambient=[];
  for(let i=0;i<count;i++)ambient.push({
    x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10,
    r:0.9+Math.random()*1.7,phase:Math.random()*Math.PI*2,sp:0.5+Math.random()*1.3,
    hue:Math.random()<0.55?'#ffe98a':(Math.random()<0.5?'#8ef0c0':'#9dc6ff'),
  });
}
function updateAmbient(dt){
  for(const p of ambient){
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.x<-30)p.x=W+30; if(p.x>W+30)p.x=-30;
    if(p.y<-30)p.y=H+30; if(p.y>H+30)p.y=-30;
  }
}

let audioCtx=null;
function ensureAudio(){
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){audioCtx=null;}}
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
}
function noteFreq(step){
  const oct=Math.floor(step/5), deg=((step%5)+5)%5;
  return 261.63*Math.pow(2,oct+PENTA[deg]/12);
}
function blip(freq,dur=0.16,type='triangle',vol=0.09,delay=0,slide=1){
  if(!audioCtx||!soundOn)return;
  try{
    const t0=audioCtx.currentTime+delay;
    const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
    osc.type=type; osc.frequency.setValueAtTime(freq,t0);
    if(slide!==1)osc.frequency.exponentialRampToValueAtTime(Math.max(20,freq*slide),t0+dur);
    gain.gain.setValueAtTime(0.0001,t0);
    gain.gain.exponentialRampToValueAtTime(vol,t0+0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0+dur+0.03);
  }catch(e){}
}
function playChord(freqs,dur=0.4){ freqs.forEach((f,i)=>blip(f,dur,'sine',0.05,i*0.02)); }
function playWinFanfare(){
  const seq=[0,2,4,7,9,12,14];
  seq.forEach((s,i)=>blip(noteFreq(s+5),0.55,'sine',0.06,i*0.085,1.004));
  blip(noteFreq(12),0.9,'triangle',0.04,0.6,1.002);
}
function vibrate(pattern){ if(!soundOn)return; try{if(navigator.vibrate)navigator.vibrate(pattern);}catch(e){} }

function syncSoundButtons(){
  const s = soundOn ? '🔊' : '🔇';
  document.getElementById('soundBtn').textContent = s;
  document.getElementById('menuSoundBtn').textContent = s;
}

function drawGarden(t){
  for(const f of state.garden){
    if(f.alpha<0.02)continue;
    const petals=5, r=f.size*(1+0.06*Math.sin(t*1.8+f.phase));
    ctx.save(); ctx.globalAlpha=f.alpha; ctx.translate(f.x,f.y);
    for(let i=0;i<petals;i++){
      const a=(i/petals)*Math.PI*2+t*0.08;
      ctx.shadowBlur=12; ctx.shadowColor=f.color; ctx.fillStyle=f.color+'88';
      ctx.beginPath(); ctx.ellipse(Math.cos(a)*r*0.45,Math.sin(a)*r*0.45,r*0.42,r*0.24,a,0,Math.PI*2); ctx.fill();
    }
    ctx.shadowBlur=8; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(0,0,r*0.22,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha=1;
}
function drawAmbient(t){
  ctx.save();
  for(const p of ambient){
    const a=0.2+0.8*Math.abs(Math.sin(t*p.sp+p.phase)), r=p.r*(0.7+0.6*a);
    ctx.globalAlpha=0.30*a; ctx.shadowBlur=r*8; ctx.shadowColor=p.hue; ctx.fillStyle=p.hue;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fill();
  }
  ctx.restore(); ctx.globalAlpha=1;
}
function drawGrid(){
  const gx=gridX,gy=gridY,cs=cellSize,n=state.n;
  const radius=Math.max(4,cs*0.16);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const a=clamp((introT-(x+y)*0.035)/0.35,0,1);
    if(a<=0)continue;
    const px=gx+x*cs, py=gy+y*cs;
    ctx.globalAlpha=a;
    ctx.fillStyle='rgba(255,255,255,0.022)';
    roundRect(px+1.5,py+1.5,cs-3,cs-3,radius); ctx.fill();
    ctx.strokeStyle='rgba(100,150,255,0.055)'; ctx.lineWidth=1; ctx.stroke();
    ctx.globalAlpha=1;
  }
  if(hoverCell&&!state.dragging&&introT>0.6){
    const px=gx+hoverCell.x*cs, py=gy+hoverCell.y*cs;
    ctx.fillStyle='rgba(160,200,255,0.07)';
    roundRect(px+2,py+2,cs-4,cs-4,radius); ctx.fill();
  }
}
function drawCrystals(t){
  const gx=gridX,gy=gridY,cs=cellSize;
  for(const c of state.crystals){
    const key=c.y*state.n+c.x;
    if(state.collectedCrystals.has(key))continue;
    const px=gx+(c.x+0.5)*cs, py=gy+(c.y+0.5)*cs;
    const size=cs*0.18, pulse=0.85+0.15*Math.sin(t*4+c.x+c.y);
    ctx.save(); ctx.translate(px,py); ctx.rotate(t*1.2);
    ctx.shadowBlur=cs*0.5; ctx.shadowColor=CRYSTAL_COLOR; ctx.fillStyle=CRYSTAL_COLOR;
    ctx.beginPath();
    ctx.moveTo(0,-size*pulse); ctx.lineTo(size*0.7*pulse,0);
    ctx.lineTo(0,size*pulse); ctx.lineTo(-size*0.7*pulse,0); ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.beginPath(); ctx.arc(0,0,size*0.25,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}
function drawPaths(t){
  const gx=gridX,gy=gridY,cs=cellSize;
  for(const id in state.paths){
    const path=state.paths[id];
    if(path.length<2)continue;
    const color=state.colorOf[id], connected=isColorConnected(+id);
    const pts=path.map(p=>({x:gx+(p.x+0.5)*cs,y:gy+(p.y+0.5)*cs}));
    ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
    const pulse=connected?0.85+0.15*Math.sin(t*3.4+(+id)):1;
    ctx.shadowBlur=cs*0.7*pulse; ctx.shadowColor=color; ctx.strokeStyle=color; ctx.lineWidth=cs*0.32;
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke();
    ctx.shadowBlur=cs*0.25; ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=cs*0.10;
    ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y); ctx.stroke();
    ctx.restore();
    if(connected){
      const pos=pointOnPolyline(pts,(t*0.22+(+id)*0.17)%1);
      if(pos){
        const rg=ctx.createRadialGradient(pos.x,pos.y,0,pos.x,pos.y,cs*0.7);
        rg.addColorStop(0,'rgba(255,255,255,0.95)'); rg.addColorStop(0.25,color); rg.addColorStop(1,color+'00');
        ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(pos.x,pos.y,cs*0.7,0,Math.PI*2); ctx.fill();
      }
    }
  }
  if(state.dragging){
    const id=state.dragging.color, path=state.paths[id];
    if(path&&path.length){
      const last=path[path.length-1];
      const px=gx+(last.x+0.5)*cs, py=gy+(last.y+0.5)*cs;
      const col=state.colorOf[id], r=cs*(0.42+0.08*Math.sin(t*9));
      const rg=ctx.createRadialGradient(px,py,0,px,py,r);
      rg.addColorStop(0,'rgba(255,255,255,0.9)'); rg.addColorStop(0.35,col); rg.addColorStop(1,col+'00');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2); ctx.fill();
      if(path.length >= 3){
        ctx.fillStyle = 'rgba(255,255,255,0.88)';
        ctx.font = `800 ${Math.round(cs*0.32)}px -apple-system, sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.shadowBlur = 10; ctx.shadowColor = col;
        ctx.fillText(String(path.length), px, py - cs*0.55);
        ctx.shadowBlur = 0;
      }
    }
  }
}
function drawEndpoints(t){
  const gx=gridX,gy=gridY,cs=cellSize;
  for(const id in state.endpoints){
    const color=state.colorOf[id], [a,b]=state.endpoints[id];
    const connected=isColorConnected(+id), pop=state.pop[id]||0;
    const intro=clamp((introT-0.35-(+id)*0.05)/0.35,0,1);
    const introScale=easeOutBack(intro);
    for(const e of [a,b]){
      const px=gx+(e.x+0.5)*cs, py=gy+(e.y+0.5)*cs;
      const pulse=0.85+0.15*Math.sin(t*2.6+e.x*1.3+e.y*1.7);
      const sc=introScale*(1+pop*0.55);
      if(sc<0.02)continue;
      const glowR=cs*(connected?0.95:0.75)*pulse*sc;
      const rg=ctx.createRadialGradient(px,py,0,px,py,glowR);
      rg.addColorStop(0,color); rg.addColorStop(0.45,color+'99'); rg.addColorStop(1,color+'00');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(px,py,glowR,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=color; ctx.shadowBlur=cs*0.3; ctx.shadowColor=color;
      ctx.beginPath(); ctx.arc(px,py,cs*0.22*pulse*sc,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0; ctx.fillStyle='rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(px,py,cs*0.08*sc,0,Math.PI*2); ctx.fill();
    }
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
    ctx.fillStyle=p.color; ctx.shadowBlur=p.size*2.8; ctx.shadowColor=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(0.5+p.life*0.6),0,Math.PI*2); ctx.fill();
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
}
function drawRipples(){
  for(const r of ripples){
    ctx.globalAlpha=Math.max(0,r.life)*0.7; ctx.strokeStyle=r.color;
    ctx.lineWidth=Math.max(1,r.life*3);
    ctx.beginPath(); ctx.arc(r.x,r.y,Math.max(0.1,r.r),0,Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function drawFloaters(){
  for(const f of state.floaters){
    ctx.globalAlpha=Math.max(0,Math.min(1,f.life));
    ctx.fillStyle=f.color;
    ctx.font=`700 ${f.size}px -apple-system, sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowBlur=12; ctx.shadowColor=f.color;
    ctx.fillText(f.text,f.x,f.y); ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
}
function drawHint(t){
  if(!state.hintCell)return;
  if(performance.now()>state.hintCell.until){state.hintCell=null;return;}
  const px=gridX+(state.hintCell.x+0.5)*cellSize;
  const py=gridY+(state.hintCell.y+0.5)*cellSize;
  const pulse=0.6+0.4*Math.sin(t*10);
  const r=cellSize*(0.4+0.08*pulse);
  ctx.strokeStyle=`rgba(255,240,150,${0.7*pulse})`;
  ctx.lineWidth=3; ctx.shadowBlur=20; ctx.shadowColor='#fff08a';
  ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2); ctx.stroke(); ctx.shadowBlur=0;
}
function drawVignette(){
  const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.78);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function render(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#0a0e1a'; ctx.fillRect(0,0,W,H);
  const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.75);
  bg.addColorStop(0,'rgba(40,65,110,0.35)'); bg.addColorStop(1,'rgba(5,8,15,0)');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  drawGarden(t); drawAmbient(t);
  ctx.save();
  if(shake>0.05)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawGrid(); drawCrystals(t); drawPaths(t); drawEndpoints(t);
  drawParticles(); drawRipples(); drawFloaters(); drawHint(t);
  ctx.restore();
  drawVignette();
  if(flash>0.01){
    ctx.fillStyle=`rgba(${flashCol[0]},${flashCol[1]},${flashCol[2]},${flash*0.3})`;
    ctx.fillRect(0,0,W,H);
  }
}

let lastT=0;
function loop(now){
  const dt=Math.min((now-lastT)/1000,0.05); lastT=now;
  const t=now/1000;
  introT=Math.min(introT+dt*1.6,5);
  shake*=Math.pow(0.0012,dt); if(shake<0.05)shake=0;
  flash*=Math.pow(0.02,dt);
  for(const id in state.pop)state.pop[id]=Math.max(0,state.pop[id]-dt*2.0);
  updateParticles(dt); updateRipples(dt); updateFloaters(dt);
  updateGarden(dt); updateAmbient(dt); updateTimer();
  if(now-lastHudMs>500){updateHud();lastHudMs=now;}
  render(t);
  requestAnimationFrame(loop);
}

soundBtn.addEventListener('click',()=>{
  soundOn=!soundOn; syncSoundButtons();
  if(soundOn){ensureAudio();blip(660,0.14,'sine',0.08);}
});

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const menuOpen = document.getElementById('menu').classList.contains('show');
    const winOpen = document.getElementById('win').classList.contains('show');
    if (menuOpen) hideMenu();
    else if (!winOpen) showMenu();
  }
});

window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,100));

// ---------- Старт ----------
try {
  const savedLang = localStorage.getItem('firefly_lang');
  if (savedLang === 'ru' || savedLang === 'en') state.lang = savedLang;
} catch(e) {}
state.highestUnlocked = Math.max(1, parseInt(localStorage.getItem('firefly_highest'), 10) || 1);

resize();
startLevel(state.highestUnlocked);
applyLanguage();
showMenu();
requestAnimationFrame(t=>{lastT=t;loop(t);});

})();
</script>
</body>
</html>
